 ; favorisés par l'humectation. Éviter l'aspersion et aérer.","sp":"Feuilles brun foncé avec taches rectangulaires brunes ou rouges en bordure (S48).","sa":"Taches brunes à marge rouge foncé sur rameaux ; chancres et dépérissement (S48).","ident":"Acervules (fructifications noires) visibles à la loupe.","bio":"Nombreuses spores dispersées par l'air et l'eau (S48).","cond":"Aspersion, humectation prolongée, plantes serrées (S48).","stsens":"—","m1":null,"m2":null,"surv":"Feuilles et rameaux lors des visites.","seuil":"—","sseuil":"—","conf":"Septoriose ; Phomopsis.","confirm":"Laboratoire.","prev":"Éviter l'aspersion, réduire l'humectation, espacer et aérer (S48).","gest":"Tailler les rameaux atteints.","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Présence au Maroc non démontrée.","eff":"—","fia":"🟨","src":"S48 ; S46"},{"id":"M-MY-09","cu":"Myrtillier","ty":"Maladie","nom":"Momification des baies (mummy berry)","sci":"Monilinia vaccinii-corymbosi","grp":"Champignon dont les fruits momifiés au sol produisent au printemps des petites coupes (apothécies) libérant des spores.","cls":"Vigilance — non signalé au Maroc","stat":"Décrite dans la revue marocaine (S48) ; absente de l'enquête 2019 (S46) ; « non significative » en Floride (S132).","org":"Jeunes pousses, fleurs, fruits.","resume":"Pousses flétries à la floraison puis baies momifiées. Ramasser les momies au sol si la maladie apparaît.","sp":"À la floraison, jeunes feuilles et pousses qui flétrissent, brunissent et meurent (S48).","sa":"Baies momifiées qui tombent (S48).","ident":"Fruits momifiés ; apothécies sur les momies.","bio":"Hiverne dans les fruits momifiés au sol ; apothécies vers 10 °C ; pas de sporulation sans humidité ; infections secondaires des fleurs par des conidies (S48).","cond":"Humidité au débourrement.","stsens":"Débourrement–floraison.","m1":null,"m2":null,"surv":"Pousses flétries et momies au sol.","seuil":"—","sseuil":"—","conf":"Gel ; Botrytis.","confirm":"Laboratoire.","prev":"Ramasser et détruire les momies (hypothèse de travail).","gest":"—","lbio":"Bacillus subtilis antagoniste (S48).","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Présence au Maroc non démontrée.","eff":"—","fia":"🟨","src":"S48 ; S46 ; S132"},{"id":"M-MY-10","cu":"Myrtillier","ty":"Maladie","nom":"Pourriture des fruits à Alternaria","sci":"Alternaria spp.","grp":"Champignon de fruits surmûrs ou blessés.","cls":"Maroc — présence non vérifiée","stat":"Non documentée au Maroc dans les sources consultées (référence Floride, S132).","org":"Fruits mûrs.","resume":"Sporulation vert foncé à noire près du calice sur des fruits restés trop longtemps : récolter régulièrement.","sp":"Zones déprimées près du calice (S132).","sa":"Sporulation vert foncé à noire sur fruits mûrs (S132).","ident":"—","bio":"—","cond":"Fruits laissés trop longtemps sur la plante (S132).","stsens":"Récolte.","m1":12,"m2":4,"surv":"Lots récoltés.","seuil":"—","sseuil":"—","conf":"Anthracnose ; Botrytis.","confirm":"—","prev":"Cueillettes fréquentes, refroidissement rapide (S132).","gest":"—","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Référence étrangère.","eff":"—","fia":"🟨","src":"S132"},{"id":"M-MY-11","cu":"Myrtillier","ty":"Maladie","nom":"Rouille du myrtillier","sci":"Thekopsora (Pucciniastrum) minima et autres rouilles","grp":"Champignon de rouille (pustules orange).","cls":"Maroc — usage ONSSA, présence non publiée","stat":"Usages homologués « Myrtillier / Rouilles » dans l'index ONSSA (copie 05/2026) ; aucune donnée Maroc dans la base OEPP (S113).","org":"Feuilles.","resume":"Rouille de fin d'automne et d'hiver dans les systèmes à feuillage persistant (Floride) ; défolie et affaiblit l'induction florale.","sp":"Pustules orange à la face inférieure des feuilles (description générale).","sa":"Défoliation prématurée ; mauvaise induction florale (S132).","ident":"—","bio":"—","cond":"Fin d'automne et hiver en système persistant (S132).","stsens":"Automne–hiver.","m1":10,"m2":2,"surv":"Face inférieure des feuilles.","seuil":"—","sseuil":"—","conf":"Oïdium ; taches foliaires.","confirm":"Loupe : pustules.","prev":"—","gest":"—","lbio":"—","onssa":["Myrtillier|Rouilles"],"chim_note":"—","res":"Alterner.","suivi":"—","lim":"Présence au Maroc non publiée.","eff":"—","fia":"🟨","src":"S132 ; S113 ; S152"},{"id":"M-MY-12","cu":"Myrtillier","ty":"Vigilance","nom":"Brûlure bactérienne à Xylella (vigilance)","sci":"Xylella fastidiosa","grp":"Bactérie des vaisseaux, transmise par des insectes piqueurs (cicadelles, cercopes).","cls":"Absent — organisme de quarantaine","stat":"Absente du Maroc, confirmé par prospections 2015 et 2020–2021 (OEPP, S113) ; des vecteurs potentiels sont présents au Maroc (S113).","org":"Feuilles, tiges.","resume":"Organisme de quarantaine absent : toute brûlure marginale unilatérale sur des plantes dispersées dans la parcelle doit être signalée.","sp":"Brûlure marginale irrégulière des feuilles d'un côté de la plante (S132).","sa":"Tiges jaunes chez certaines variétés ; plantes atteintes dispersées au hasard (S132).","ident":"—","bio":"Transmise par cicadelles et cercopes (S132).","cond":"Introduction de plants infectés.","stsens":"—","m1":null,"m2":null,"surv":"Signalement.","seuil":"—","sseuil":"—","conf":"Brûlures salines ; sécheresse.","confirm":"Laboratoire officiel.","prev":"Plants certifiés.","gest":"Déclaration obligatoire.","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Fiche de vigilance.","eff":"—","fia":"🟩","src":"S113 ; S132"},{"id":"D-MY-01","cu":"Myrtillier","ty":"Désordre","nom":"Chlorose ferrique (pH trop élevé)","sci":"Indisponibilité du fer liée au pH du sol, du substrat ou de l'eau","grp":"Désordre nutritionnel (abiotique).","cls":"Maroc — documenté","stat":"Eaux alcalines (bicarbonates) fréquentes ; le myrtillier exige un pH de 4,5 à 5,5 (S69 ; S39).","org":"Jeunes feuilles.","resume":"Jaunissement entre les nervures des jeunes feuilles : dans la grande majorité des cas, c'est le pH qui est trop élevé, pas le fer qui manque. Mesurer le pH du sol ou du lixiviat et neutraliser l'alcalinité de l'eau avant d'ajouter des chélates.","sp":"Jaunissement entre les nervures commençant sur les jeunes feuilles, nervures vertes (S69).","sa":"Feuilles presque blanches, croissance ralentie.","ident":"—","bio":"Le fer devient moins disponible quand le pH monte ; plus de ~110 kg d'urée/ha en une fois peut provoquer une carence temporaire (S69).","cond":"pH du sol > 5,5 ; eau riche en bicarbonates non neutralisée ; en pots, pH du lixiviat > 5,5 (S69 ; S39).","stsens":"Pousses.","m1":3,"m2":10,"surv":"pH du sol (pleine terre) ; pH et EC du lixiviat par pour-through (pots) ; Fe foliaire 61–200 ppm (S69 ; S39).","seuil":"Lixiviat pH cible 4,5–5,5 ; sol 4,5–5,5 (S39 ; S69).","sseuil":"S39 ; S69","conf":"Carences en Mn ou Cu ; excès de sels ; pourriture racinaire.","confirm":"pH + analyse foliaire.","prev":"Neutraliser l'alcalinité de l'eau par titration (feuille Irrigation) ; engrais acidifiants (sulfate d'ammonium) ; en sol, soufre élémentaire avant plantation (S69 ; S39).","gest":"Corriger d'abord le pH ; chélate de fer seulement en complément.","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"pH du lixiviat ou du sol 2–4 semaines après correction ; reverdissement des nouvelles feuilles.","lim":"—","eff":"—","fia":"🟩","src":"S69 ; S39"},{"id":"D-MY-02","cu":"Myrtillier","ty":"Désordre","nom":"Excès de sels (EC élevée)","sci":"Accumulation de sels dans le substrat ou la zone racinaire","grp":"Désordre abiotique.","cls":"Maroc — documenté","stat":"Le myrtillier est sensible : l'EC au-dessus de 1,0 dS/m affecte la croissance et la qualité (S40) ; eaux salées dans certains secteurs du Gharb (TR-EAU).","org":"Racines, bords des feuilles.","resume":"Brûlure des bords des feuilles et croissance ralentie quand l'EC du lixiviat monte. Viser une EC de lixiviat < 2,0 dS/m, une fraction de lessivage de 15–25 % et rincer à l'eau acidifiée si nécessaire.","sp":"Bords des feuilles brûlés ; croissance ralentie.","sa":"Défoliation ; racines brunes ; porte ouverte au Phytophthora.","ident":"—","bio":"Sels apportés par l'eau et les engrais, concentrés si le drainage est insuffisant (S40).","cond":"Eau salée ; fertigation trop concentrée ; fraction de lessivage trop faible ; engrais chlorés (S69 ; S40).","stsens":"Été ; jeunes plants plus sensibles (S39).","m1":5,"m2":10,"surv":"EC et volume du lixiviat (pour-through : 50 mL de lixiviat après saturation) ; EC de l'eau (S39).","seuil":"EC du lixiviat < 2,0 dS/m (plus bas pour les jeunes plants) (S39) ; ne pas irriguer avec une eau > 2 dS/m (guide fournisseur, S139).","sseuil":"S39","conf":"Carence en K ; Phytophthora ; sécheresse.","confirm":"EC du lixiviat et de l'eau ; Cl foliaire.","prev":"Fraction de lessivage 15–25 % ; éviter KCl ; alterner fertigation et irrigation claire (S39 ; S40).","gest":"Rinçage avec de grands volumes d'eau acidifiée (S39 ; S40).","lbio":"—","onssa":[],"chim_note":"Voir Correcteurs de salinité.","res":"—","suivi":"EC du lixiviat après rinçage.","lim":"—","eff":"—","fia":"🟩","src":"S39 ; S40 ; S69 ; S139 ; TR-EAU"},{"id":"D-MY-03","cu":"Myrtillier","ty":"Désordre","nom":"Entrée en production retardée, bourgeons floraux secs","sci":"Climat (froid insuffisant, chaleur), dégâts de bourgeons","grp":"Désordre abiotique ou ravageur à distinguer.","cls":"Maroc — documenté","stat":"91 % des producteurs enquêtés en 2019 observent une entrée en production retardée de 10 jours à 1 mois (S46).","org":"Bourgeons floraux.","resume":"Bourgeons floraux secs ou floraison retardée : ne pas conclure au manque de froid sans avoir disséqué des bourgeons, car la cécidomyie donne des dégâts confondus avec le gel ou le manque de froid (S130).","sp":"Bourgeons floraux qui ne s'ouvrent pas ou se dessèchent.","sa":"Floraison étalée, retard de récolte.","ident":"—","bio":"—","cond":"Hivers doux ; vagues de chaleur ; gel.","stsens":"Gonflement des bourgeons–floraison.","m1":9,"m2":12,"surv":"Dissection de bourgeons à la loupe (larves orange de cécidomyie ?) ; relevés de température.","seuil":"—","sseuil":"—","conf":"Cécidomyie des bourgeons ; phytopte des bourgeons ; gel ; Phomopsis.","confirm":"Dissection de bourgeons.","prev":"Choix variétal adapté au froid disponible.","gest":"—","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"—","eff":"—","fia":"🟩","src":"S46 ; S130"},{"id":"R-MY-01","cu":"Myrtillier","ty":"Ravageur","nom":"Pucerons","sci":"Aphis spp. (espèces non identifiées dans l'enquête)","grp":"Insectes piqueurs-suceurs.","cls":"Gharb — documenté","stat":"Ravageur le plus fréquent de l'enquête 2019 : 82 % des exploitations, dans les trois régions (S46).","org":"Jeunes pousses, face inférieure des feuilles.","resume":"Le ravageur le plus fréquent du myrtillier au Maroc. Suivre les colonies et leurs momies sur les pousses ; Aphidius colemani est déjà utilisé par quelques producteurs ; la pratique dominante (un seul néonicotinoïde) expose à la résistance et aux problèmes de résidus.","sp":"Colonies sur jeunes pousses ; miellat.","sa":"Pousses déformées, miellat et fumagine.","ident":"Colonies de pucerons ; momies dorées = pucerons parasités (S135).","bio":"—","cond":"Pousses tendres ; excès d'azote.","stsens":"Flushes de végétation (printemps–été).","m1":3,"m2":9,"surv":"Pièges jaunes (88 % des producteurs, S46) + observation directe des pousses (colonies, momies, coccinelles).","seuil":"Aucun seuil publié pour le myrtillier au Maroc.","sseuil":"—","conf":"Thrips (feuilles rougies enroulées) ; cécidomyie (bourgeons).","confirm":"Observation des colonies.","prev":"Fertilisation azotée raisonnée ; enherbement fleuri pour les auxiliaires.","gest":"Élimination des pousses infestées (9 % des producteurs, S46).","lbio":"Aphidius colemani (3 exploitations, S46) ; coccinelles, syrphes, chrysopes (S135).","onssa":["Myrtillier|Pucerons"],"chim_note":"Pratique relevée en 2019 (≠ homologation) : thiaclopride 74 % des producteurs ; statut UE à vérifier pour l'export (S46).","res":"Alterner les modes d'action IRAC.","suivi":"% de pousses colonisées 7 jours après ; momies.","lim":"Espèces non identifiées.","eff":"Néonicotinoïdes : toxiques pour les pollinisateurs.","fia":"🟩","src":"S46 ; S135 ; S152"},{"id":"R-MY-02","cu":"Myrtillier","ty":"Ravageur","nom":"Cécidomyie des bourgeons","sci":"Dasineura oxycoccana (Diptera : Cecidomyiidae)","grp":"Insecte, petite mouche dont les larves vivent dans les bourgeons.","cls":"Gharb — documenté","stat":"68 % des exploitations en 2019, dans les trois régions (Souss 43 %, Gharb 40 %, Loukkos 17 % des cas) (S46).","org":"Bourgeons floraux et végétatifs.","resume":"Les larves orange dessèchent les boutons floraux environ deux semaines après la ponte ; dégât souvent pris pour du gel. Disséquer des bourgeons aux stades 2–3 et poser des pièges ; intervenir juste avant le débourrement.","sp":"Boutons floraux chiffonnés, desséchés (S130).","sa":"Boutons floraux qui se désagrègent en ~2 semaines ; bourgeons végétatifs gonflés à feuilles enroulées, pousses très courtes ; jusqu'à 80 % des bourgeons perdus (S131 ; S130 ; S48).","ident":"Adultes de 2 à 3 mm, abdomen orange rayé de noir (microscope pour l'identification sûre) ; œufs de 0,25 mm dans les bourgeons ; larves incolores puis blanches à orange (S130 ; S48).","bio":"Adultes vivant 2–3 jours ; développement larvaire ~10 jours puis nymphose au sol ; génération en 2–3 semaines ; jusqu'à 11 générations par an (Mississippi) ; émergences après les « faux hivers » ; jusqu'à 33 larves par bourgeon (S130). Diapause au sol en été et automne (Floride) (S131).","cond":"Hivers doux ; bourgeons aux stades 2–3 (gonflement, écailles qui s'écartent) ; vieux paillage décomposé (S130).","stsens":"Gonflement des bourgeons floraux (stades 2–3) puis bourgeons végétatifs.","m1":9,"m2":3,"surv":"Prélèvement de 25 bourgeons aux stades 2–3 sur 3 plantes par répétition, en sacs fermés à température ambiante (sortie des larves en 2–4 jours) ; pièges collants transparents (5–10/ha) ; pièges d'émergence au sol ; points bas en priorité (S130).","seuil":"Floride : intervention dès 2 cécidomyies capturées (S130). Pas de seuil marocain.","sseuil":"S130 (Floride)","conf":"Gel ; manque de froid ; phytopte des bourgeons ; Phomopsis.","confirm":"Larves orange dans les bourgeons disséqués.","prev":"Paillage organique frais (< 75 % décomposé) ou paillage plastique qui empêche les larves d'atteindre le sol ; hersage superficiel en fin d'automne (S130 ; S131).","gest":"Traiter juste avant le débourrement puis ~10 jours après, au moment des émergences (S130).","lbio":"Parasitoïdes Platygaster (89 % des parasitoïdes en Floride), Synopeas, Inostemma : 25–40 % des larves (S130).","onssa":["Myrtillier|Cécidomyie"],"chim_note":"Pratique relevée en 2019 : spinétoram 53 %, cyantraniliprole 41 % (S46). Floride : cyantraniliprole et imidaclopride les plus toxiques pour les parasitoïdes, spinétoram le moins (S130).","res":"Alterner les groupes IRAC (S130).","suivi":"% de bourgeons infestés 2 semaines après ; fleurs par grappe à la floraison.","lim":"Seuils et dates de Floride.","eff":"Choisir des produits épargnant les parasitoïdes.","fia":"🟩","src":"S46 ; S48 ; S130 ; S131 ; S152"},{"id":"R-MY-03","cu":"Myrtillier","ty":"Ravageur","nom":"Thrips des fleurs","sci":"Frankliniella spp. (dont F. occidentalis)","grp":"Insectes thrips.","cls":"Gharb — documenté","stat":"52 % des exploitations en 2019 (Gharb 30 % des cas) ; apparition en novembre dans le Loukkos, toute l'année dans le Souss (S46).","org":"Fleurs, jeunes fruits, jeunes feuilles.","resume":"Les thrips abîment les fleurs et réduisent la nouaison. Battre les grappes florales sur une feuille blanche : repère floridien > 4 thrips par fleur (SHB) ; pièges bleus pour suivre les vols.","sp":"Feuilles enroulées et rougies (S48).","sa":"Nouaison réduite ; baies déformées (S48).","ident":"Thrips jaunâtres à orange d'environ 1,5 mm, ailes frangées (S132).","bio":"Adultes et deux premiers stades larvaires sur pollen, fleurs et fruits ; ponte dans les tissus floraux (S48 ; S132).","cond":"Floraison ; temps doux.","stsens":"Floraison.","m1":10,"m2":2,"surv":"Battage des grappes florales sur feuille blanche en 4–5 points par bloc d'~0,4 ha ; pièges bleus (les plus efficaces), blancs, jaunes (S132 ; S48) ; 95 % des producteurs marocains utilisent des pièges bleus (S46).","seuil":"Floride : SHB > 4 thrips par fleur ; pièges collants 2 par 2 ha : 80–100 captures (S132). Pas de seuil marocain.","sseuil":"S132 (Floride)","conf":"Pucerons ; oïdium (rougissement) ; carences.","confirm":"Battage + loupe.","prev":"—","gest":"Pendant la floraison, uniquement des produits compatibles, appliqués tôt le matin ou tard le soir (S132).","lbio":"Orius et Amblyseius peu efficaces en plein champ selon les études citées (S48).","onssa":["Myrtillier|Thrips"],"chim_note":"Pratique relevée en 2019 : cyantraniliprole 71 %, spinétoram 21 %, azadirachtine 7 % (S46).","res":"Alterner.","suivi":"Thrips par fleur 3–5 jours après.","lim":"Seuil floridien.","eff":"Floraison : protéger les pollinisateurs.","fia":"🟩","src":"S46 ; S48 ; S132 ; S152"},{"id":"R-MY-04","cu":"Myrtillier","ty":"Ravageur","nom":"Drosophile à ailes tachetées","sci":"Drosophila suzukii (Diptera : Drosophilidae)","grp":"Insecte, petite mouche dont la femelle pond dans les fruits sains en cours de maturation.","cls":"Gharb — documenté","stat":"Présente au Maroc depuis 2013 (framboisier), Gharb et Loukkos (Boughdad et al. 2021 ; OEPP, S113) ; 41 % des exploitations en 2019 (Gharb et Loukkos, absente du Souss), apparition en mars dans le Gharb (S46).","org":"Fruits en maturation et mûrs.","resume":"Contrairement aux autres drosophiles, elle pond dans les fruits sains encore sur la plante. Pièges dès la véraison, cueillettes fréquentes et complètes, destruction des fruits tombés et refroidissement rapide sont la base.","sp":"Petites piqûres de ponte sur fruits sains (S48 ; S114).","sa":"Larves dans la pulpe : zone déprimée et molle, intérieur brunâtre ; pourritures secondaires (S48).","ident":"2–3 mm, yeux rouges ; mâle : une tache sombre au bord de chaque aile (absente chez les jeunes mâles) ; femelle : ovipositeur fortement denté ; confusions possibles avec d'autres drosophiles (S114).","bio":"Hiverne en adulte ; 350–400 œufs par femelle ; œuf → adulte en 9–10 jours à 25 °C, 21–25 jours à 15 °C ; pas de reproduction sous 10 °C ; mâles stériles au-dessus de 30 °C ; nombreux hôtes sauvages (ronces, lierre…) (S114).","cond":"Fruits mûrs ou surmûrs laissés sur la plante ; hôtes sauvages proches ; temps doux.","stsens":"Véraison à récolte (fruits de couleur).","m1":2,"m2":6,"surv":"Pièges rouges appâtés (levure + sucre plus attractif que le vinaigre) dans la frondaison, à l'ombre ; 100 % des producteurs enquêtés utilisent des pièges rouges (S46 ; S114 ; S132) ; contrôle des fruits (recherche des larves).","seuil":"Aucun seuil marocain publié ; les captures ne prédisent pas toujours l'infestation (S114).","sseuil":"—","conf":"Autres drosophiles sur fruits abîmés ; anthracnose ; Botrytis.","confirm":"Larves dans les fruits ; identification des adultes (aile tachée du mâle).","prev":"Aération des plantes ; ne pas laisser de fruits surmûrs ; filets anti-insectes ; destruction des fruits atteints (S48) ; froid post-récolte (S114).","gest":"Cueillettes au moins tous les 7 jours (S132) ; piégeage de masse (S48).","lbio":"Trichopria drosophilae (lâchers, Europe) (S114) ; parasitoïdes cités dans la revue marocaine (S48) — non disponibles commercialement au Maroc selon les sources lues.","onssa":["Myrtillier|Drosophila suzukii"],"chim_note":"Pratique relevée en 2019 : cyantraniliprole 56 %, spinétoram 44 % (S46). Résistance au spinosad documentée en Californie (S114).","res":"Alterner les modes d'action.","suivi":"% de fruits avec larves dans les lots ; captures hebdomadaires.","lim":"—","eff":"—","fia":"🟩","src":"S113 ; S114 ; S46 ; S48 ; S132 ; TR-BOUGHDAD ; S152" 01.","cond":"Vergers d'agrumes voisins.","stsens":"—","m1":null,"m2":null,"surv":"Piège de surveillance (Ceratrap utilisé par les producteurs, S46).","seuil":"—","sseuil":"—","conf":"—","confirm":"—","prev":"—","gest":"—","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"—","eff":"—","fia":"🟩","src":"S46"},{"id":"R-MY-10","cu":"Myrtillier","ty":"Ravageur","nom":"Vers blancs (larves de scarabées)","sci":"Larves de Scarabaeidae (espèces non précisées)","grp":"Insectes du sol.","cls":"Maroc — documenté","stat":"Un cas (2 %) dans l'enquête 2019 (S46).","org":"Racines.","resume":"Larves qui rongent les racines et donnent des symptômes de sécheresse ; les jeunes plants peuvent mourir vite. Inspecter le sol ou le pot au pied des plantes qui flétrissent.","sp":"Flétrissement malgré l'irrigation.","sa":"Racines rongées ; mort de jeunes plants (S132).","ident":"Larves blanches en C à tête brune (S132).","bio":"Populations qui augmentent sur plusieurs années (S132).","cond":"Sol riche en matière organique ; prairies voisines.","stsens":"—","m1":null,"m2":null,"surv":"Fouiller le sol ou le substrat au pied des plantes faibles.","seuil":"—","sseuil":"—","conf":"Phytophthora ; sécheresse.","confirm":"Larves dans le sol.","prev":"—","gest":"—","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Fiche partielle.","eff":"—","fia":"🟨","src":"S46 ; S132"},{"id":"R-MY-11","cu":"Myrtillier","ty":"Ravageur","nom":"Punaise diabolique","sci":"Halyomorpha halys (Hemiptera : Pentatomidae)","grp":"Insecte, punaise polyphage invasive.","cls":"Maroc — documenté","stat":"Présente au Maroc, distribution restreinte : trouvée en 2019 lors d'enquêtes sur myrtillier dans le Souss-Massa et le Loukkos (OEPP RS 2021/096, S113 ; S46).","org":"Fruits.","resume":"Punaise invasive présente au Maroc en distribution restreinte. Signaler toute observation et faire confirmer l'identification ; pas de lutte établie au Maroc.","sp":"—","sa":"—","ident":"Identification à confirmer p e d'environ 52 % cité pour le Gharb d'après des travaux antérieurs (S80).","org":"Fruits, feuilles et rameaux portant des boucliers de pou de Californie.","resume":"Principal ennemi naturel du pou de Californie. Avant de traiter, retourner des boucliers : trous de sortie ronds et cochenilles desséchées signalent son action. Le préserver (fourmis, poussière, insecticides larges) vaut souvent mieux qu'un traitement de rattrapage.","sp":"Bouclier percé d'un trou de sortie rond ; sous le bouclier, cochenille aplatie et desséchée, exuvie et granules fécaux noirs de la nymphe (méconium), parfois nymphe visible (S135).","sa":"—","ident":"Micro-guêpe d'environ 1,5 mm, thorax et abdomen jaunes, 3 petits ocelles rouges en triangle sur la tête, 2 paires d'ailes (S135).","bio":"Pond de préférence sur les femelles vierges du 3e stade (aussi sur les mâles et la fin du 2e stade) ; œuf → adulte en ~2 semaines au chaud ; femelle vivant ~2 semaines et pondant ~100 œufs ; tue aussi des cochenilles en s'en nourrissant (host-feeding) ; jusqu'à ~12 générations par an (S135).","cond":"Défavorisé par la chaleur (> 30 °C, S116), le manque de stades hôtes en été (S135), les fourmis qui protègent les cochenilles, la poussière et les insecticides à large spectre (S135).","stsens":"Activité utile de l'automne à la fin du printemps ; creux estival (S80).","m1":9,"m2":6,"surv":"Sur 10 fruits par bloc, compter les cochenilles L2–L3 parasitées (S111) ; noter les signes de parasitisme à chaque comptage du pou.","seuil":"Règle californienne : lutte biologique jugée suffisante si > 70 % des femelles L3 sont parasitées fin octobre (vallée de San Joaquin) (S111). Pas de règle marocaine publiée.","sseuil":"S111 (Californie)","conf":"Mâle ailé du pou de Californie, de taille voisine : 1 seule paire d'ailes et un anneau rouge foncé autour du thorax (S135).","confirm":"Loupe ×10–×20 : retourner les boucliers.","prev":"Contrôler les fourmis ; plantes fleuries (nectar) ; limiter la poussière (pistes arrosées) ; éviter les insecticides larges et persistants (S135). L'huile blanche (1,2–1,4 %) est l'option chimique la plus sélective et ne persiste pas (S111).","gest":"Lâchers proposés au Maroc de mi-septembre à fin juin, suspendus par temps de pluie (S80). Californie : 5 000–10 000/acre (12 000–25 000/ha) toutes les 2 semaines de mars à mi-novembre (San Joaquin) ou 1–4 lâchers d'environ 10 000/acre en avril–mai (Sud) (S111). Disponibilité commerciale au Maroc non vérifiée.","lbio":"Pou de Californie (Aonidiella aurantii) ; A. chrysomphali et A. lepidosaphes sur d'autres diaspines (S109). Autres auxiliaires des diaspines : Comperiella bifasciata (parasitoïde), coccinelles Rhyzobius lophanthae et Chilocorus (S109 ; S111).","onssa":[],"chim_note":"Avant un lâcher, test de résidus : rameaux traités + Aphytis pendant 24 h ; > 35 % de mortalité = résidus trop toxiques (S111). Le spirotétramate n'est pas toxique pour Aphytis (mais l'est pour les acariens prédateurs) (S111).","res":"—","suivi":"% de cochenilles parasitées 3–4 semaines après un lâcher ; boucliers par fruit à la récolte (objectif californien ≤ 10 boucliers/fruit, S111).","lim":"Parasitisme naturel jugé insuffisant seul au Tadla (S116) ; repères de lâcher californiens.","eff":"—","fia":"🟩","src":"S80 ; S116 ; S111 ; S135 ; S109"},{"id":"A-TT-02","cu":"Toutes","ty":"Auxiliaire","nom":"Coccinelle Rodolia (vedalia)","sci":"Rodolia (Novius) cardinalis — Coleoptera : Coccinellidae","grp":"Prédateur spécialisé : adultes et larves mangent uniquement la cochenille australienne.","cls":"Maroc — documenté","stat":"Utilisée par un producteur de myrtille marocain en 2019 (S46). Règle espagnole : ne jamais traiter la cochenille australienne, contrôlée par Rodolia (S109).","org":"Rameaux colonisés par la cochenille australienne (agrumes, myrtillier).","resume":"Contrôle une forte infestation de cochenille australienne en 4 à 6 semaines si on ne la tue pas avec des pyréthrinoïdes, néonicotinoïdes ou régulateurs de croissance. Ses es (S135).","confirm":"Loupe : vitesse de déplacement et forme des œufs.","prev":"Éviter pyréthrinoïdes et acaricides peu sélectifs ; limiter la poussière ; enherbement ou fétuque entre les rangs (S109 ; S135).","gest":"Lâchers de Neoseiulus californicus et Phytoseiulus persimilis cités contre le tétranyque en agrumes (S109) ; P. persimilis seulement si l'humidité est suffisante (S135). Doses de lâcher non documentées dans les sources lues.","lbio":"Acarien rouge, tétranyques, acarien de l'avocatier ; Euseius aussi larves de cochenilles, thrips et aleurodes (S135). Autres prédateurs d'acariens cités : coccinelle Stethorus punctillum, névroptère Conwentzia psociformis (S109).","onssa":[],"chim_note":"Certains acaricides réduisent les phytoséiides jusqu'à 6 semaines ; le spirotétramate est toxique pour les acariens prédateurs (S111).","res":"—","suivi":"% de feuilles avec phytoséiides et % de feuilles occupées par les acariens 7–10 jours plus tard.","lim":"Pas de seuil marocain intégrant les prédateurs.","eff":"—","fia":"🟩","src":"S157 ; S135 ; S109 ; S111 ; S101"},{"id":"A-TT-06","cu":"Toutes","ty":"Auxiliaire","nom":"Coccinelles prédatrices de pucerons","sci":"Coccinellidae aphidiphages (espèces à identifier)","grp":"Coléoptères dont adultes et larves mangent pucerons, cochenilles ou psylles selon les espèces.","cls":"Maroc — présence non vérifiée","stat":"Citées parmi les prédateurs de pucerons des agrumes en Espagne (S109) ; espèces présentes dans les vergers du Gharb non inventoriées dans les sources consultées.","org":"Pousses et colonies de pucerons.","resume":"Leurs larves « en petit alligator » sont souvent écrasées ou traitées par erreur. Une colonie de pucerons envahie de larves et de nymphes de coccinelles est en voie de régulation.","sp":"Œufs oblongs jaunâtres en groupes ou isolés ; larves actives à six longues pattes ; nymphes immobiles fixées sur les feuilles (S160).","sa":"—","ident":"Adultes ronds ou en demi-dôme, élytres durs, antennes courtes ; larves à quatre stades de taille croissante, certaines épineuses (S160).","bio":"Quatre stades : œuf, larve, nymphe, adulte ; adultes et larves prédateurs chez la plupart des espèces (S160).","cond":"Colonies de pucerons au printemps ; absence d'insecticides larges.","stsens":"Poussées de printemps.","m1":3,"m2":6,"surv":"Lors du comptage des pousses à pucerons, noter les pousses avec auxiliaires (coccinelles, syrphes, chrysopes, momies).","seuil":"Agrumes (Espagne) : traiter seulement si > 30 % des pousses sont occupées ET < 50 % des pousses occupées portent des ennemis naturels (S109).","sseuil":"S109","conf":"Chrysomèles phytophages : longues antennes, contrairement aux coccinelles (S160). Larve de Cryptolaemus : couverte de cire (voir A-TT-03).","confirm":"Loupe.","prev":"Éviter les traitements de « précaution » ; plantes fleuries.","gest":"—","lbio":"Pucerons ; selon les espèces cochenilles, psylles ; une coccinelle (Psyllobora) consomme les spores d'oïdium (S160).","onssa":[],"chim_note":"Pyriproxyfène et buprofézine tuent les coccinelles (S91) ; spinosad toxique pour les coccinelles pendant 5–7 jours (S91).","res":"—","suivi":"% de pousses occupées après 7–10 jours.","lim":"Espèces locales non inventoriées.","eff":"—","fia":"🟩","src":"S160 ; S109 ; S91"},{"id":"A-TT-07","cu":"Toutes","ty":"Auxiliaire","nom":"Chrysopes","sci":"Chrysoperla spp. (dont C. carnea) — Neuroptera : Chrysopidae","grp":"Prédateurs généralistes : la larve chasse de nombreux petits insectes et acariens.","cls":"Maroc — présence non vérifiée","stat":"Citées parmi les prédateurs de pucerons des agrumes en Espagne (S109) ; non inventoriées dans le Gharb dans les sources consultées.","org":"Toute la frondaison.","resume":"Les œufs portés par un fin pédicelle de soie et les larves à grosses mandibules recourbées signalent un prédateur actif contre pucerons, cochenilles, thrips et acariens.","sp":"Œufs ~1,5 mm au bout d'un pédicelle de soie (S135).","sa":"—","ident":"Larves aplaties « en petit al  du soleil, sans mélange, produit le moins toxique, prévenir l'apiculteur (contrat) (S156).","gest":"Installer les ruches à 5–10 % de floraison et les retirer à la chute des pétales (S156).","lbio":"Pollinisation croisée : meilleure nouaison, calibre et maturité plus précoce (S156).","onssa":[],"chim_note":"Classes de toxicité pour les abeilles : voir le tableau de sélectivité (S91).","res":"—","suivi":"% de nouaison et calibre des baies.","lim":"Repères de Floride ; besoins variétaux Manila/Eureka non publiés.","eff":"—","fia":"🟩","src":"S156 ; S91"},{"id":"A-AV-14","cu":"Avocatier","ty":"Auxiliaire","nom":"Pollinisateurs de l'avocatier","sci":"Apis mellifera (principalement), bourdons, abeilles sauvages, syrphes","grp":"Insectes pollinisateurs ; ils compensent la dichogamie (fleurs femelles puis mâles à des moments différents).","cls":"Maroc — documenté","stat":"Abeilles domestiques utilisées dans les vergers ; dichogamie documentée pour Hass (type A) (S158). Densité de ruches pour le Gharb non publiée.","org":"Inflorescences.","resume":"Chaque fleur s'ouvre deux fois : femelle puis mâle. Hass (type A) a besoin de pollen apporté au bon moment ; une variété de type B à proximité et des abeilles dans les rangs voisins augmentent la nouaison. Les abeilles butinent surtout 1 à 3 arbres.","sp":"Abeilles sur les fleurs en phase femelle (matin pour le type A) et mâle.","sa":"—","ident":"Type A (Hass, Gwen, Lamb Hass, Pinkerton, Reed) : femelle le matin du jour 1, mâle l'après-midi du jour 2. Type B (Bacon, Ettinger, Fuerte, Sharwil, Zutano…) : femelle l'après-midi du jour 1, mâle le lendemain matin (S158). Zutano est classé type A par une autre source (S159) : à vérifier.","bio":"Un arbre adulte peut porter plus d'un million de fleurs (S158). Les abeilles visitent surtout 1 à 3 arbres et croisent les variétés sur 2 rangs ; elles préfèrent souvent les fleurs non cultivées (nectar d'avocatier riche en K et P) (S155).","cond":"Cycle décrit pour des températures « idéales » (max 25 °C, min 20 °C) ; le froid perturbe le cycle et la nouaison (S159).","stsens":"Floraison (printemps).","m1":3,"m2":5,"surv":"Visites d'abeilles en fin de matinée et l'après-midi ; nouaison de rameaux marqués selon la distance aux pollinisateurs.","seuil":"—","sseuil":"—","conf":"—","confirm":"—","prev":"Pas d'insecticide toxique pour les abeilles pendant la floraison ; fleurs non cultivées (haies) près des rangs : plus de visites et de fruits (S155).","gest":"Placer les ruches dans le verger plutôt qu'en bordure (rayon de 1–4 arbres) (S158 ; S155). Essais sous filet : plus de fruits avec abeilles (S83).","lbio":"Pollinisation croisée A × B et autopollinisation.","onssa":[],"chim_note":"Classes de toxicité pour les abeilles (S91).","res":"—","suivi":"Nouaison et chute des fruitlets.","lim":"Intérêt des pollinisateurs débattu ; placement à raisonner (S158).","eff":"—","fia":"🟩","src":"S158 ; S155 ; S159 ; S83 ; S82 ; S91"},{"id":"A-AG-15","cu":"Agrumes","ty":"Auxiliaire","nom":"Pollinisation croisée et pépins (mandarines)","sci":"Apis mellifera (vecteur du pollen)","grp":"Effet indésirable de la pollinisation chez les variétés vendues sans pépins.","cls":"Maroc — documenté","stat":"Chez 'Afourer' (= Nadorcott), la pollinisation croisée par d'autres variétés donne des fruits à pépins ; l'isolement sous filets est efficace (S85).","org":"Fleurs, fruits.","resume":"Pour les mandarines vendues sans pépins, la présence de variétés pollinisatrices et d'abeilles pendant la floraison provoque des pépins : raisonner la proximité des variétés et la position des ruches.","sp":"—","sa":"Fruits à pépins.","ident":"—","bio":"Variétés parthénocarpiques (fruits sans fécondation) mais fécondables (S85).","cond":"Variétés compatibles proches ; ruches pendant la floraison.","stsens":"Floraison.","m1":3,"m2":4,"surv":"Nombre de pépins par fruit sur échantillons.","seuil":"—","sseuil":"—","conf":"—","confirm":"—","prev":"Gérer la proximité des variétés pollinisatrices ; filets (S85).","gest":"—","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"Pépins/fruit.","lim":"Données d'Uruguay.","eff":"—","fia":"🟩","src":"S85"},{"id":"D-AG-03","cu":"Agrumes","ty":"Désordre","nom":"Alternance, floraison et nouaison irrégulières","sci":"Équilibre charge en fruits / floraison (régulation hormonale et glucidique)","grp":"Désordre physiologique : une forte récolte réduit la floraison suivante.","cls":"Maroc — documenté","stat":"Phénomène documenté sur clémentiniers au Maroc (essais GA3, urée, paclobutrazol sur 'Nour' — références citées, non lues : El-Otmani et al. 2004 ; Benhamou et al. 2004) ; mécanismes d'après Agustí et al. 2022 (S151).","org":"Bourgeons, fleurs, fruitlets.","resume":"Les fruits présents pendant l'induction florale (novembre–décembre) répriment la floraison suivante : récolter tard une forte charge prépare une année faible. Raisonner la date de récolte, la charge et l'azote ; les régulateurs (GA3…) ne s'utilisent qu'avec un usage homologué et un objectif précis.","sp":"Très forte floraison une année, faible la suivante ; nouaison faible malgré beaucoup de fleurs.","sa":"Alternance de rendements ; petits calibres les années fortes.","ident":"—","bio":"Induction florale 2–3 mois avant le débourrement, différenciation au débourrement ; froid (< 15 °C pendant ≥ 1,5 mois) ou stress hydrique modéré induisent la floraison ; les fruits présents pendant l'induction répriment les gènes floraux (CiFT) dans les feuilles ; récolter avant novembre a peu d'effet, une récolte tardive d'une forte charge réduit la floraison ; les fruits réduisent aussi les pousses d'été-automne qui portent les fleurs (S151).","cond":"Récolte tardive ; forte charge ; excès d'azote (croissance végétative, moins de fleurs) (S151).","stsens":"Induction (novembre–décembre pour orangers et mandariniers dans l'hémisphère nord) ; floraison ; chute de juin.","m1":11,"m2":6,"surv":"Historique de charge par bloc ; intensité de floraison (fleurs par rameau) ; nouaison sur rameaux marqués.","seuil":"—","sseuil":"—","conf":"Gel des fleurs ; stress hydrique à la floraison ; carence en B (chute de fruits, S78) ; ravageurs des fleurs (Prays, thrips).","confirm":"Comptages de fleurs et de fruitlets sur rameaux marqués, deux années de suite.","prev":"Récolter les fortes charges avant novembre quand le marché le permet ; azote raisonné ; taille dirigée (+25 % de rendement cumulé sur 4 ans dans une étude citée) (S151).","gest":"Régulateurs : GA3 pendant l'induction réduit le nombre de fleurs (25–100 mg/L : −45 à −75 % ; clémentine 20 mg/L ≈ −12 %) puis améliore la nouaison ; paclobutrazol (1–2 g/L) sur arbres en année faible ; incision annulaire estivale (S151). Réponses très variables entre essais (S151). N'utiliser qu'un produit dont l'usage est homologué au Maroc pour cet objectif.","lbio":"—","onssa":["Agrumes|Action sur le processus de la nouaison","Agrumes: Clémentinier|Action sur le processus de la nouaison","Agrumes: Clémentinier|Action sur le processus de floraison","Agrumes|Fixation des fruits","Agrumes: Clémentinier|Amélioration du calibre des fruits","Agrumes|Action sur le grossissement des fruits","Agrumes: Clémentinier|Action sur le grossissement des fruits","Agrumes: Maroc late|Action sur le grossissement du calibre"],"chim_note":"Doses de GA3 citées d'après des essais étrangers (S151) : seules la dose et le stade de l'étiquette marocaine s'appliquent.","res":"—","suivi":"Fleurs/rameau et fruits/rameau l'année suivante ; rendement et calibre.","lim":"Réponses variables selon variété, charge et climat (S151) ; références marocaines citées non lues.","eff":"—","fia":"🟩","src":"S151 ; S78 ; S152"},{"id":"D-AV-05","cu":"Avocatier","ty":"Désordre","nom":"Alternance et chute des fruits","sci":"Équilibre charge en fruits / pousses d'été (avocatier 'Hass')","grp":"Désordre physiologique.","cls":"Maroc — documenté","stat":"Vague de chaleur (> 36 °C pendant 5 jours fin juin 2026) en pleine chute naturelle des fleurs et des jeunes fruits dans le Gharb (S107) ; mécanismes d'après Lovatt 2010 (Californie, S154).","org":"Pousses, inflorescences, jeunes fruits.","resume":"Une forte récolte (année « ON ») freine les pousses d'été qui portent la floraison suivante (année « OFF »). Gel, chaleur ou manque d'eau pendant la floraison et la nouaison, sous-fertilisation et taille excessive déclenchent le cycle. Agir sur la charge, l'irrigation et l'azote au bon moment.","sp":"Chute massive de jeunes fruits de mi-juin à fin juillet (« chute de juin »), aggravée par la chaleur (S154).","sa":"Années très chargées suivies d'années presque sans récolte.","ident":"Indice d'alternance = (récolte ON − récolte OFF) / (ON + OFF) : 0 = pas d'alternance, 1 = alternance totale ; 0,57 à 0,97 dans les vergers de Hass californiens (S154).","bio":"Dans les arbres en année OFF, ~75 % des pousses florifères de l'année suivante viennent des pousses d'été, ~15 % du printemps, ~10 % de l'automne ; la récolte présente (ON) inhibe les pousses d'été et d'automne ; garder les fruits mûrs sur l'arbre jusqu'à l'été-automne réduit la floraison de l'année d'après (S154).","cond":"Gel, températures extrêmes ou stress hydrique à la floraison et à la nouaison ; sous-fertilisation ; sous-irrigation ; taille excessive (S154).","stsens":"Floraison, nouaison et chute de juin ; pousses d'été.","m1":3,"m2":8,"surv":"Rendement par bloc chaque année ; nombre de pousses d'été ; chute de fruitlets sur rameaux marqués.","seuil":"—","sseuil":"—","conf":"Stress thermique (D-AV-03) ; asphyxie (D-AV-04) ; Phytophthora (M-AV-01) ; thrips sur fruitlets.","confirm":"Historique de récolte et relevés de température.","prev":"Irrigation sans déficit pendant la floraison et la nouaison ; éviter la taille excessive (S154).","gest":"Californie (S154) : éclaircir tôt en été (avant les pousses d'été) ou récolter tôt (avant juillet) une forte charge ; azote au sol en avril (50 lb N/acre ≈ 56 kg N/ha a réduit l'alternance sur 4 ans vs 25 lb) et ≥ 20–25 lb N/acre (≈ 22–28 kg N/ha) en juillet–août ; pulvérisation de bore (Solubor) ou d'urée faible biuret au stade « chou-fleur » des inflorescences, jamais ensemble, et pas d'urée à ≥ 32 °C. Vérifier le B foliaire avant tout apport de bore (S142).","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"Indice d'alternance sur plusieurs années.","lim":"Références californiennes ; dates à décaler selon la phénologie observée dans le Gharb.","eff":"—","fia":"🟩","src":"S154 ; S142 ; S107"},{"id":"AD-AG-01","cu":"Agrumes","ty":"Adventice","nom":"Adventices du rang","sci":"Graminées et dicotylédones annuelles et vivaces (espèces du Gharb non inventoriées)","grp":"Plantes concurrentes pour l'eau et les éléments.","cls":"Maroc — documenté","stat":"Usages d'herbicides homologués sur agrumes contre adventices annuelles et vivaces (index ONSSA, copie 05/2026) ; inventaire des espèces du Gharb non trouvé dans les sources consultées.","org":"Sol du rang et de l'inter-rang.","resume":"Identifier les espèces dominantes (annuelles ou vivaces, graminées ou dicotylédones) avant de choisir un herbicide homologué pour ce groupe ; protéger les jeunes troncs ; un enherbement maîtrisé de l'inter-rang peut nourrir les acariens prédateurs (pollen).","sp":"Recouvrement du rang.","sa":"Concurrence hydrique et minérale, gêne à la circulation.","ident":"Identifier les espèces (photos, flore locale).","bio":"—","cond":"Pluies d'automne et de printemps.","stsens":"Jeunes plantations.","m1":10,"m2":4,"surv":"% de recouvrement du rang.","seuil":"—","sseuil":"—","conf":"—","confirm":"—","prev":"Paillage ; désherbage mécanique ; fétuque entre les rangs favorable aux phytoséiides (S109).","gest":"Herbicide choisi selon le groupe d'adventices visé par l'étiquette.","lbio":"—","onssa":["Agrumes|Adventices*"],"chim_note":"Les herbicides ne doivent pas toucher les troncs ni le feuillage.","res":"Alterner les modes d'action (HRAC).","suivi":"Recouvrement 4–6 semaines après.","lim":"Fiche partielle : pas de source agronomique lu <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const br = s => esc(s).replace(/\n/g, "<br>");
const norm = s => (s == null ? "" : String(s)).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const MOIS = ["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];
const ML = ["J","F","M","A","M","J","J","A","S","O","N","D"];
const store = {get(k, d){try{const v = localStorage.getItem("cas-"+k); return v == null ? d : JSON.parse(v);}catch(e){return d;}},
               set(k, v){try{localStorage.setItem("cas-"+k, JSON.stringify(v));}catch(e){}}};
const NOW_M = new Date().getMonth() + 1;
const active = (m, m1, m2) => (m1 == null || m2 == null) ? false : (m1 <= m2 ? (m >= m1 && m <= m2) : (m >= m1 || m <= m2));
function monthStrip(m1, m2, cur){
  let h = '<div class="months" aria-label="Période : ' + (m1 ? MOIS[m1-1] + " à " + MOIS[m2-1] : "non précisée") + '">';
  for (let m = 1; m <= 12; m++) h += `<span class="${active(m, m1, m2) ? "on" : ""}${cur === m ? " now" : ""}">${ML[m-1]}</span>`;
  return h + "</div>";
}
const SYS = [
  {k:"ag", lab:"Agrumes", cas:"Agrumes", cu:"Agrumes", ps:["Tous"]},
  {k:"av", lab:"Avocatier", cas:"Avocatier", cu:"Avocatier", ps:["Tous"]},
  {k:"mpt", lab:"Myrtillier pleine terre", cas:"Myrtillier — pleine terre", cu:"Myrtillier", ps:["Tous","Pleine terre"]},
  {k:"mpo", lab:"Myrtillier en pots", cas:"Myrtillier — pots", cu:"Myrtillier", ps:["Tous","Pots sur substrat"]},
];
const TYPES = {"Base (selon analyse)":"p-base","Correction (si diagnostic)":"p-cor","Essai avec témoin":"p-ess","Ne pas faire / hors nutrition":"p-non"};
const TYLAB = {"Base (selon analyse)":"Base","Correction (si diagnostic)":"Correction","Essai avec témoin":"Essai","Ne pas faire / hors nutrition":"À ne pas faire"};
const ELS = ["N","P2O5","K2O","CaO","MgO","SO3","SiO2","B","Cu","Fe","Mn","Mo","Zn"];
const fmtN = v => (Math.round(v * 100) / 100).toString().replace(".", ",");
const S = {sys: store.get("sys", "ag"), month: NOW_M, cmp: store.get("cmp", ["FERRILENE 4.8","VALFER 30","XTRAFER"])};
const sysOf = k => SYS.find(s => s.k === k) || SYS[0];
const prodByName = Object.fromEntries(D.gamme.map(g => [g.nom, g]));
const orgById = Object.fromEntries(D.orgs.map(o => [o.id, o]));
const stById = Object.fromEntries(D.stades.map(s => [s.id, s]));
const idxCrop = r => r.cu.startsWith("Agrumes") ? "Agrumes" : r.cu;

/* ---------- état visuel ---------- */
function regPill(g){
  if (g.regl.startsWith("⛔")) return '<span class="pill p-non">⛔ allégation phyto</span>';
  if (g.regl.startsWith("🟨")) return '<span class="pill p-ess">régulateur ?</span>';
  return "";
}
function myrtPill(g){
  const m = g.myrt || "";
  if (/^Non/.test(m)) return '<span class="pill p-non">myrtillier : non</span>';
  if (/^(Avec précaution|Foliaire seulement|À vérifier|Rarement|Inutile|Non conseillé)/.test(m)) return `<span class="pill p-ess">myrtillier : ${esc(m.split(" (")[0].toLowerCase())}</span>`;
  return "";
}
function labelGrid(g){
  const cells = ELS.filter(e => g.el[e] != null).map(e => `<div><b>${e.replace("2O5","₂O₅").replace("K2O","K₂O").replace("SO3","SO₃").replace("SiO2","SiO₂")}</b><i>${fmtN(g.el[e])}</i></div>`);
  return cells.length ? `<div class="label-grid" title="Teneurs en % (catalogue)">${cells.join("")}</div>` : "";
}
function apport(g){
  if (!g.cmp) return null;
  const [el, t, dose, u] = g.cmp;
  if (dose == null) return {el, t, txt: `${el} : ${fmtN(t)} % du produit`};
  let v = null;
  if (u === "g" || g.base === "p/v") v = dose * t / 100; else if (g.dens) v = dose * g.dens * t / 100;
  return {el, t, dose, u, v, txt: v == null ? `${el} ${fmtN(t)} % — densité non imprimée` : `${fmtN(v)} g de ${el} pour ${fmtN(dose)} ${u}/hL`};
}

/* ---------- vues ---------- */
const VIEWS = [
  ["terrain","Terrain"],["tracker","Mon suivi"],["assistant","Assistant"],["calculs","Calculs"],["programme","Programme CAS"],["gamme","Gamme CAS"],["comparer","Comparer"],["diagnostic","Diagnostic"],
  ["organismes","Ravageurs & maladies"],["onssa","Index ONSSA"],["stades","Stades"],["technique","Programme technique"],["sources","Sources"]
];
function navRender(cur){
  $("#tabs").innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" ${k === cur ? 'aria-current="page"' : ""}>${l}</a>`).join("");
}
function sysPicker(onchg){
  return `<div class="chips" role="group" aria-label="Culture et système">${SYS.map(s => `<button class="chip" data-sys="${s.k}" aria-pressed="${S.sys === s.k}">${s.lab}</button>`).join("")}</div>`;
}
function bindSys(root, rerender){
  root.querySelectorAll("[data-sys]").forEach(b => b.onclick = () => {S.sys = b.dataset.sys; store.set("sys", S.sys); rerender();});
}
function chipGroup(name, opts, cur){
  return `<div class="chips" data-grp="${name}">${opts.map(([v, l]) => `<button class="chip" data-v="${esc(v)}" aria-pressed="${v === cur}">${esc(l)}</button>`).join("")}</div>`;
}
function bindChips(root, name, fn){
  root.querySelectorAll(`[data-grp="${name}"] .chip`).forEach(b => b.onclick = () => fn(b.dataset.v));
}

/* ---- cartes ---- */
function cardProgCas(p, cur){
  const g = prodByName[(p.prod.split(/ · | \(| \+ |,/)[0] || "").trim()];
  return `<article class="card">
    <div class="card-top"><div><span class="pill ${TYPES[p.ty]}">${TYLAB[p.ty]}</span> <span class="meta">${esc(p.st)}</span></div>${monthStrip(p.m1, p.m2, cur)}</div>
    <div class="card-title">${esc(p.obj)}</div>
    <dl class="kv">
      <dt>Déclencheur</dt><dd>${esc(p.decl)}</dd>
      <dt>Produit CAS</dt><dd>${g ? `<a href="#" data-prod="${esc(g.nom)}"><b>${esc(p.prod)}</b></a>` : `<b>${esc(p.prod)}</b>`}</dd>
      <dt>Dose</dt><dd>${esc(p.dose)}</dd>
      ${p.voie !== "—" ? `<dt>Voie · fréquence</dt><dd>${esc(p.voie)} · ${esc(p.freq)}</dd>` : ""}
      ${p.alt !== "—" ? `<dt>Alternative</dt><dd>${esc(p.alt)}</dd>` : ""}
      <dt>Pourquoi</dt><dd>${esc(p.pourquoi)}</dd>
      <dt>Preuve</dt><dd>${esc(p.preuve)}</dd>
      ${p.vig !== "—" ? `<dt>Vigilance</dt><dd>${esc(p.vig)}</dd>` : ""}
    </dl>
    <div class="meta">${esc(p.id)} · ${p.pv !== "—" ? "lié à " + esc(p.pv) + " · " : ""}${esc(p.src)}</div>
  </article>`;
}
function cardProd(g){
  const a = apport(g);
  return `<article class="card click" data-prod="${esc(g.nom)}" tabindex="0">
    <div class="card-top"><div class="card-title">${esc(g.nom)}</div><span class="meta">${esc(g.forme)}</span></div>
    <div class="meta">${esc(g.fam)} — ${esc(g.famnom)} · ${esc(g.marque)}</div>
    ${labelGrid(g)}
    <div style="font-size:14px">${esc(g.role)}</div>
    <div class="chips">${regPill(g)}${myrtPill(g)}${g.incoh !== "—" ? '<span class="pill p-ess">incohérence catalogue</span>' : ""}${a && a.v != null ? `<span class="pill p-mut num">${esc(a.txt)}</span>` : ""}</div>
  </article>`;
}
function cardOrg(o){
  return `<article class="card click" data-org="${esc(o.id)}" tabindex="0">
    <div class="card-top"><div><div class="card-title">${esc(o.nom)}</div><div class="meta"><i>${esc(o.sci)}</i></div></div>${monthStrip(o.m1, o.m2, S.month)}</div>
    <div class="meta">${esc(o.ty)} · ${esc(o.cu)} · ${esc(o.cls)} · ${esc(o.fia)}</div>
    <div style="font-size:14px">${esc(o.resume)}</div>
  </article>`;
}
function cardStade(s, cur){
  return `<article class="card click" data-stade="${esc(s.id)}" tabindex="0">
    <div class="card-top"><div><span class="pill p-mut">${esc(s.id)}</span> <span class="meta">BBCH ${esc(s.bbch)}${s.grp !== "Tous" ? " · " + esc(s.grp) : ""}</span></div>${monthStrip(s.m1, s.m2, cur)}</div>

async function initStore(){

    if (window.claude && typeof window.claude.use === "function") {
      db = await window.claude.use("db");

    }
  } catch (e) { db = null; }
  if (db && uid) {
    T.mode = "cloud";
    const root = db.doc(`data/users/${uid}/tracker`);
    T.base = k => root.collection(k);
    T.sdoc = db.doc(`data/users/${uid}/settings`);
    KINDS.forEach(k => T.base(k).limit(1000).onSnapshot(s => { T.data[k] = s.docs.map(d => Object.assign({}, d.data(), {id: d.id})); onData(); }, e => toast("Synchronisation interrompue (" + e.code + "). Recharger la page.")));

    try { T.assets = await window.claude.use("assets"); } catch (e) { T.assets = null; }
    T.sdoc.onSnapshot(s => { if (s.exists) { T.settings = Object.assign({objVis:"", objCA:"", tarifs:{}}, s.data()); onData(); } }, () => {});
  } else {
    T.mode = "local";
    KINDS.forEach(k => T.data[k] = store.get("t-" + k, []));

}

  if (T.mode === "cloud") {
    try { await T.base(kind).doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); try { await T.base(kind).doc(id).set(body); return id; } catch (e2) { e = e2; } }
      if (e && e.code === "invalid_argument") T.ro = true;
      toast(e && e.code === "quota_exceeded" ? "Base pleine : supprimer d'anciennes lignes." : e && e.code === "invalid_argument" ? "Enregistrement refusé : ce lien ne permet pas d'écrire." : "Enregistrement impossible pour le moment. Réessayer.");
      throw e;
    }
  } else {
    const L = T.data[kind].filter(x => x.id !== id); L.push(Object.assign(body, {id})); T.data[kind] = L; store.set("t-" + kind, L); onData();
  }

}

      const cu = g("culture"); if (p && /Myrtillier/.test(cu || "") && /^Non/.test(p.myrt)) w.push(`${esc(p.nom)} : à exclure en myrtillier (${esc(p.myrt)}).`); }
    if (kind === "essais") { if (g("temoin") === "Non") w.push("Sans témoin non traité, l'essai ne permettra pas de conclure."); if (g("reps") !== "" && +g("reps") < 3) w.push("Moins de 3 répétitions : conclusion fragile."); }
    $("#fwarn").innerHTML = w.map(x => `<div class="note">${x}</div>`).join("");
  };
  form.addEventListener("input", warn); form.addEventListener("change", warn); warn();
  form.onsubmit = async e => {
    e.preventDefault();
    const out = Object.assign({}, obj);
    for (const f of FIELDS[kind]) {
      if (f.t === "multi") { out[f.k] = [...form.querySelectorAll(`[data-multi="${f.k}"] input:checked`)].map(x => x.value); continue; }
      const el = form.querySelector(`[name="${f.k}"]`); let v = el.value.trim();

      if (f.t === "num" && v !== "" && isNaN(v)) { el.focus(); toast(`« ${f.l} » doit être un nombre.`); return; }
      if (f.req && (v === "" || v == null)) { el.focus(); toast(`« ${f.l} » est obligatoire.`); return; }
      out[f.k] = v;
    }
    if (kind === "opps" && (out.etape === "Gagnée" || out.etape === "Perdue") && !out.cloture) out.cloture = todayISO();
    if (kind === "opps" && !(out.etape === "Gagnée" || out.etape === "Perdue")) out.cloture = "";
    if (kind === "actions" && out.statut === "Fait" && !out.fait) out.fait = todayISO();
    if (kind === "visites") out.photos = (form._photos || []).slice();
    if (kind === "ventes" && (out.montant === "" || out.montant == null) && out.qte !== "" && out.pu !== "") out.montant = Math.round(out.qte * out.pu * 100) / 100;
    try {
      await tSave(kind, out);
      if (kind === "visites" && isNew && out.next && out.echeance) await tSave("actions", {titre: out.next, compte: out.compte, echeance: out.echeance, prio: "Normale", statut: "À faire", notes: "Suite de la visite du " + fdate(out.date), origine: "visite"});
      closeSheet(); toast(isNew ? `${KONE[kind][0].toUpperCase() + KONE[kind].slice(1)} ajoutée.`.replace("Compte ajoutée", "Compte ajouté").replace("Essai ajoutée", "Essai ajouté") : "Modifications enregistrées.");
    } catch (err) {}
  };
  if (!isNew) {
    $("#fdel").onclick = () => { $("#fconfirm").hidden = false; };
    $("#fdelno").onclick = () => { $("#fconfirm").hidden = true; };
    $("#fdelok").onclick = async () => { await tDel(kind, obj.id); closeSheet(); toast("Supprimé."); };
    if (kind === "visites") { $("#fcr").onclick = () => openCR(obj); $("#fpdf").onclick = () => visitPDF(obj); }
  }
}

/* ---------- lignes de liste ---------- */
function stPill(v){
  const m = {"Fait":"p-base","Réalisée":"p-base","Gagnée":"p-base","Terminé":"p-base","Client actif":"p-base","Effet positif":"p-base","Satisfaisant":"p-base",
    "À faire":"p-cor","Proposée":"p-cor","Planifié":"p-cor","Planifiée":"p-cor","Annulée":"p-mut","Prospect":"p-cor","Offre envoyée":"p-cor","Acceptée":"p-cor","En cours":"p-ess","Négociation":"p-ess","Partiel":"p-ess",
    "Client occasionnel":"p-ess","Haute":"p-non","Perdue":"p-non","Refusée":"p-non","Inactif":"p-mut","Insuffisant":"p-non","Effet négatif":"p-non"};
  return v ? `<span class="pill ${m[v] || "p-mut"}">${esc(v)}</span>` : "";
}
function rowHTML(kind, x){
  const today = todayISO(), cn = esc(compteNom(x.compte));
  let top = "", main = "", sub = "";
  if (kind === "comptes") { const lv = lastVisit(x.id); top = `${stPill(x.statut)} ${x.potentiel ? `<span class="pill p-mut">${esc(x.potentiel.split(" ")[0])}</span>` : ""}`; main = esc(x.nom);
    sub = [x.zone, (x.cultures || []).join(", "), x.surface ? x.surface + " ha" : "", lv ? "dernière visite " + fdate(lv) : "jamais visité"].filter(Boolean).map(esc).join(" · "); }
  if (kind === "visites") { top = `<span class="num">${fdate(x.date)}</span> ${x.statut && x.statut !== "Réalisée" ? stPill(x.statut) : ""} ${x.objet ? `<span class="pill p-mut">${esc(x.objet)}</span>` : ""} ${(x.photos || []).length ? `<span class="pill p-mut">${x.photos.length} photo(s)</span>` : ""}`; main = cn || "—";
    sub = [x.culture, x.stade && stById[x.stade] ? stById[x.stade].nom : "", x.organisme && orgById[x.organisme] ? orgById[x.organisme].nom : "", x.reco].filter(Boolean).map(esc).join(" · "); }
  if (kind === "ventes") { top = `<span class="num">${fdate(x.date)}</span> <span class="num">${mad(x.montant)}</span>`; main = `${esc(x.produit)} · ${esc(x.qte)} ${esc(x.unite || "")}`; sub = [compteNom(x.compte), x.culture, famOf(x.produit)].filter(Boolean).map(esc).join(" · "); }
  if (kind === "actions") { const late = x.statut !== "Fait" && x.echeance && x.echeance < today; top = `<span class="num ${late ? "late" : ""}">${late ? "En retard · " : ""}${fdate(x.echeance)}</span> ${stPill(x.statut)} ${x.prio === "Haute" ? stPill("Haute") : ""}`;
    main = esc(x.titre); sub = cn; }
  if (kind === "recos") { const p = prodByName[x.produit]; top = `<span class="num">${fdate(x.date)}</span> ${stPill(x.statut)} ${x.effet && x.effet !== "Non évalué" ? stPill(x.effet) : ""} ${p && p.regl.startsWith("⛔") ? '<span class="pill p-non">⛔</span>' : ""}`;
    main = `${esc(x.produit)}${x.dose ? " · " + esc(x.dose) : ""}`; sub = [compteNom(x.compte), x.culture, x.surface ? x.surface + " ha" : "", x.qte ? x.qte + " L/kg" : ""].filter(Boolean).map(esc).join(" · "); }
  if (kind === "essais") { const d = (x.rt !== "" && x.rm !== "" && x.rt != null && x.rm != null && +x.rt) ? ((x.rm - x.rt) / x.rt * 100) : null;
    top = `${stPill(x.statut)} ${x.conclusion && x.conclusion !== "Non conclu" ? stPill(x.conclusion) : ""} ${x.temoin === "Non" ? '<span class="pill p-non">sans témoin</span>' : ""}`;
    main = esc(x.titre); sub = [compteNom(x.compte), x.produit, x.indic, d != null ? `écart ${d >= 0 ? "+" : ""}${fmtN(Math.round(d * 10) / 10)} % vs témoin` : ""].filter(Boolean).map(esc).join(" · "); }
  if (kind === "opps") { top = `${stPill(x.etape)} <span class="num">${mad(x.montant)}</span>`; main = esc(x.titre); sub = [compteNom(x.compte), x.produits, x.date ? "prévu " + fdate(x.date) : ""].filter(Boolean).map(esc).join(" · "); }
  const chk = kind === "actions" ? `<button class="tick" data-done="${esc(x.id)}" aria-label="${x.statut === "Fait" ? "Remettre à faire" : "Marquer fait"}" aria-pressed="${x.statut === "Fait"}">${x.statut === "Fait" ? "✓" : ""}</button>` : "";

function lastVisit(cid){ const t = todayISO(); const v = T.data.visites.filter(x => x.compte === cid && (x.statut || "Réalisée") === "Réalisée" && x.date <= t).map(x => x.date).sort(); return v[v.length - 1] || ""; }
function sortKind(kind, L){

  return L.slice().sort((a, b) => { const A = by[kind](a), B = by[kind](b); return asc ? String(A).localeCompare(String(B), "fr") : String(B).localeCompare(String(A), "fr"); });
}
const FILT = {comptes:["statut", FIELDS.comptes[4].opts], actions:["statut", ["À faire","Fait"]], recos:["statut", FIELDS.recos[7].opts], essais:["statut", FIELDS.essais[11].opts], opps:["etape", ETAPES], visites:["statut", ["Réalisée","Planifiée","Annulée"]], ventes:["unite", ["L","kg","unité"]]};
function listView(kind){

    visites:"Aucune visite. Une visite enregistre ce qui a été vu, l'hypothèse, la recommandation et la prochaine action.",
    actions:"Aucune action. Les prochaines actions saisies dans une visite arrivent ici automatiquement.",
    recos:"Aucune recommandation. Suivre chaque produit proposé : proposé → accepté → réalisé, puis le résultat constaté.",
    essais:"Aucun essai. Un essai utile a un témoin non traité, au moins 3 répétitions et un indicateur mesuré.",
    opps:"Aucune opportunité. Suivre les affaires de l'offre à la commande, avec un montant estimé.",
    ventes:"Aucune vente. Saisir les ventes réelles (produit, quantité, prix) : l'onglet Analyse les répartit par mois, produit, famille, culture et zone."}[kind];
  return `<div class="controls"><input class="inp" id="tq" type="search" placeholder="Filtrer les ${KLAB[kind].toLowerCase()}…" value="${esc(T.q)}">

    <div class="controls">${chipGroup("tf", [["", "Tout"]].concat(fo.map(o => [o, o])), T.f)}</div>
    <section class="sec"><div class="sec-h"><span class="count">${L.length} ${KLAB[kind].toLowerCase()}</span></div>
    <div class="tlist">${L.map(x => rowHTML(kind, x)).join("") || `<p class="empty">${esc(empty)}</p>`}</div></section>`;
}

/* ---------- tableau de bord ---------- */
function vBord(){
  const t = todayISO(), mon = t.slice(0, 7), wk = addDays(t, 7);
  const vis = T.data.visites, act = T.data.actions.filter(a => a.statut !== "Fait"), recos = T.data.recos, ess = T.data.essais, opps = T.data.opps;
  const done = v => (v.statut || "Réalisée") === "Réalisée";
  const visM = vis.filter(v => done(v) && (v.date || "").startsWith(mon)).length;
  const venM = T.data.ventes.filter(v => (v.date || "").startsWith(mon)).reduce((s, v) => s + (+v.montant || 0), 0);
  const planW = vis.filter(v => v.statut === "Planifiée" && v.date >= t && v.date <= wk).length;
  const late = sortKind("actions", act.filter(a => a.echeance && a.echeance < t)), soon = sortKind("actions", act.filter(a => !a.echeance || (a.echeance >= t && a.echeance <= wk)));
  const prop = recos.filter(r => r.statut === "Proposée" || r.statut === "Acceptée"), toEval = recos.filter(r => r.statut === "Réalisée" && (!r.effet || r.effet === "Non évalué"));
  const essC = ess.filter(e => e.statut !== "Terminé");
  const open = opps.filter(o => o.etape !== "Gagnée" && o.etape !== "Perdue");
  const pipe = open.reduce((s, o) => s + (+o.montant || 0), 0), pond = open.reduce((s, o) => s + (+o.montant || 0) * PROBA[o.etape], 0);
  const won = opps.filter(o => o.etape === "Gagnée" && (o.cloture || "").startsWith(mon)).reduce((s, o) => s + (+o.montant || 0), 0);
  const relance = T.data.comptes.filter(c => c.statut !== "Inactif").map(c => ({c, lv: lastVisit(c.id)})).filter(x => !x.lv || x.lv < addDays(t, -30)).sort((a, b) => (a.lv || "").localeCompare(b.lv || ""));
  const ov = +T.settings.objVis || 0, oc = +T.settings.objCA || 0;
  // visites des 6 derniers mois
  const months = []; const d0 = new Date(); d0.setDate(1);
  for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); const key = todayISO(d).slice(0, 7); months.push([MOIS[d.getMonth()], vis.filter(v => done(v) && (v.date || "").startsWith(key)).length]); }
  const mx = Math.max(1, ov, ...months.map(m => m[1]));
  const bar = (v, o) => o ? `<div class="gauge" role="img" aria-label="${v} sur ${o}"><span style="width:${Math.min(100, v / o * 100)}%"></span></div>` : "";
  const byStep = ETAPES.slice(0, 3).map(e => [e, open.filter(o => o.etape === e)]);
  return `
  <div class="kpis">
    <div class="kpi"><span class="lbl">Visites ce mois</span><b>${visM}${ov ? `<small> / ${ov}</small>` : ""}</b>${bar(visM, ov)}</div>
    <div class="kpi ${late.length ? "alert" : ""}"><span class="lbl">Actions en retard</span><b>${late.length}</b><span class="meta">${soon.length} dans les 7 jours</span></div>
    <div class="kpi"><span class="lbl">Recommandations en cours</span><b>${prop.length}</b><span class="meta">${toEval.length} résultat(s) à constater</span></div>
    <div class="kpi"><span class="lbl">Essais ouverts</span><b>${essC.length}</b><span class="meta">${ess.filter(e => e.statut !== "Terminé" && e.temoin === "Non").length} sans témoin</span></div>
    <div class="kpi"><span class="lbl">Ventes ce mois</span><b class="num">${mad(venM)}</b>${bar(venM, oc)}<span class="meta">${oc ? "objectif " + mad(oc) + " · " : ""}affaires gagnées ${mad(won)}</span></div>
    <div class="kpi"><span class="lbl">Visites planifiées</span><b>${planW}</b><span class="meta">dans les 7 jours</span></div>
    <div class="kpi"><span class="lbl">Pipeline ouvert</span><b class="num">${mad(pipe)}</b><span class="meta">pondéré ${mad(pond)}</span></div>
  </div>
  <div class="cols">
    <section class="sec"><div class="sec-h"><h2>À faire</h2><span class="count">${late.length} en retard · ${soon.length} cette semaine</span><button class="btn ghost mini" data-new="actions">+ Action</button></div>
      <div class="tlist">${late.concat(soon).slice(0, 12).map(a => rowHTML("actions", a)).join("") || '<p class="empty">Rien en retard ni dans les 7 jours.</p>'}</div></section>
    <section class="sec"><div class="sec-h"><h2>Comptes à revoir</h2><span class="count">sans visite depuis 30 jours</span></div>
      <div class="tlist">${relance.slice(0, 8).map(x => rowHTML("comptes", x.c)).join("") || `<p class="empty">${T.data.comptes.length ? "Tous les comptes actifs ont été vus ce mois-ci." : "Ajouter des comptes pour suivre les relances."}</p>`}</div></section>
  </div>
  <div class="cols">
    <section class="sec"><div class="sec-h"><h2>Visites, 6 derniers mois</h2>${ov ? `<span class="count">trait = objectif ${ov}/mois</span>` : ""}</div>
      <div class="bars">${months.map(([l, v]) => `<div class="bcol"><span class="bv num">${v}</span><div class="btrack">${ov ? `<i class="bobj" style="bottom:${ov / mx * 100}%"></i>` : ""}<span class="bfill" style="height:${v / mx * 100}%"></span></div><span class="bl">${l}</span></div>`).join("")}</div></section>
    <section class="sec"><div class="sec-h"><h2>Pipeline par étape</h2></div>
      <div class="tlist">${byStep.map(([e, L]) => `<div class="pipe"><span>${stPill(e)} <span class="meta">${L.length} affaire(s) · probabilité ${Math.round(PROBA[e] * 100)} %</span></span><b class="num">${mad(L.reduce((s, o) => s + (+o.montant || 0), 0))}</b></div>`).join("")}</div></section>
  </div>
  <section class="sec"><div class="sec-h"><h2>Objectifs du mois</h2></div>
    <div class="controls"><label class="fld inline" for="ov">Visites / mois<input id="ov" type="number" min="0" step="1" value="${esc(T.settings.objVis)}"></label>
    <label class="fld inline" for="oc">Chiffre d'affaires / mois (MAD)<input id="oc" type="number" min="0" step="1000" value="${esc(T.settings.objCA)}"></label>
    <button class="btn ghost" id="osave">Enregistrer les objectifs</button></div></section>`;
}

/* ---------- export ---------- */

async function lazyScript(url, globalName){

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.82));
  } catch (e) { return file; }
}

function vImportBlock(){
  return `<section class="sec"><div class="sec-h"><h2>Importer</h2></div>
  <p class="lede">Importer vos comptes depuis un fichier Excel (.xlsx) ou CSV : une ligne par exploitation, avec des colonnes comme Nom, Zone, Cultures, Surface, Téléphone, Interlocuteur. Les noms déjà présents sont ignorés. Ou restaurer une sauvegarde JSON exportée ici.</p>
  <div class="controls"><input type="file" id="impf" accept=".xlsx,.xls,.csv,.json" hidden><button class="btn ghost" id="impbtn">Choisir un fichier</button><span class="meta" id="impmsg"></span></div>
  <div id="impprev"></div></section>`;
}
function parseCSV(txt){
  const sep = (txt.split("\n")[0].match(/;/g) || []).length >= (txt.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < txt.length; i++) { const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ""; } else if (ch === "\n") { row.push(cur.replace(/\r$/, "")); rows.push(row); row = []; cur = ""; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
function mapComptes(rows){
  const h = rows[0].map(x => norm(x));
  const find = keys => h.findIndex(c => keys.some(k => c.includes(k)));
  const ix = {nom: find(["exploitation","nom","client","raison","ferme","domaine","societe"]), zone: find(["zone","commune","ville","localite","region","secteur"]), cultures: find(["culture"]),
    surface: find(["surface","superficie","sau"]), tel: find(["tel","phone","gsm","mobile"]), contact: find(["interlocuteur","contact","responsable","gerant","proprietaire"]),
    statut: find(["statut","status"]), gps: find(["gps","coord","latitude"]), notes: find(["note","remarque","commentaire"])};
  if (ix.nom < 0) return {err: "Aucune colonne « Nom » / « Client » / « Exploitation » trouvée dans la première ligne."};
  const exist = new Set(T.data.comptes.map(c => norm(c.nom)));
  const out = []; const seen = new Set();
  for (const r of rows.slice(1)) {
    const nom = String(r[ix.nom] || "").trim(); if (!nom || exist.has(norm(nom)) || seen.has(norm(nom))) continue; seen.add(norm(nom));
    const cu = ix.cultures >= 0 ? norm(r[ix.cultures]) : "";
    const cultures = [cu.includes("agrum") || cu.includes("citr") || cu.includes("orang") || cu.includes("clem") ? "Agrumes" : "", cu.includes("avoc") ? "Avocatier" : "",
      cu.includes("myrt") || cu.includes("blue") ? "Myrtillier pleine terre" : ""].filter(Boolean);
    const st = ix.statut >= 0 ? String(r[ix.statut] || "") : "";
    out.push({nom, zone: ix.zone >= 0 ? String(r[ix.zone] || "").trim() : "", cultures, surface: ix.surface >= 0 && !isNaN(parseFloat(String(r[ix.surface]).replace(",", "."))) ? parseFloat(String(r[ix.surface]).replace(",", ".")) : "",
      tel: ix.tel >= 0 ? String(r[ix.tel] || "").trim() : "", contact: ix.contact >= 0 ? String(r[ix.contact] || "").trim() : "", gps: ix.gps >= 0 ? String(r[ix.gps] || "").trim() : "",
      statut: FIELDS.comptes.find(f => f.k === "statut").opts.find(o => norm(o) === norm(st)) || "Prospect", potentiel: "", notes: ix.notes >= 0 ? String(r[ix.notes] || "").trim() : ""});
  }
  return {out: out.slice(0, 500), cols: Object.entries(ix).filter(([, v]) => v >= 0).map(([k]) => k)};
}
function bImport(root){
  const f = $("#impf", root); if (!f) return;

        rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ""}); const hi = rows.findIndex(r => r.some(c => /nom|client|exploitation/i.test(String(c)))); if (hi > 0) rows = rows.slice(hi); }

      if (m.out.length) $("#impgo").onclick = () => runImport([["comptes", m.out]]);
    } catch (e) { msg.textContent = "Fichier illisible. Vérifier le format (.xlsx, .csv ou sauvegarde .json)."; }
  };

function bCalculs(root){

      ${/hL/.test(u) && isFinite(b) && (b < 500 || b > 4000) ? '<div class="note">Volume de bouillie inhabituel : une dose en mL/hL suppose le volume de l\'étiquette.</div>' : ""}` : '<p class="empty">Compléter les champs.</p>';
