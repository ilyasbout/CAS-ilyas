% de fleurs brunies.","act":"Aération, fongicide homologué selon le risque (PV-MY-05).","liens":"M-MY-01","src":"S48 ; S132","fia":"🟩"},{"id":"DD-MY-08","cu":"Myrtillier","th":"Petits calibres / défauts de qualité","org":"Fruits","symp":"Fruits mûrs ramollis avec masses de spores orange à saumon","causes":"Anthracnose","dist":"Spores orange à l'extrémité florale, parfois seulement après stockage.","ana":"Test de conservation 7 jours au froid.","act":"Cueillettes fréquentes, bois mort éliminé, froid rapide.","liens":"M-MY-04","src":"S132","fia":"🟩"},{"id":"DD-MY-09","cu":"Myrtillier","th":"Jaunissement / chlorose","org":"Feuilles","symp":"Décolorations rougeâtres puis feutrage blanc (automne)","causes":"Oïdium ; rougissement d'automne naturel ; carence en P ; dégâts de thrips","dist":"Oïdium : feutrage blanc à la loupe, petits corps jaunes puis noirs.","ana":"Loupe sur la dernière pousse.","act":"Fongicide homologué en alternance si confirmé (PV-MY-06).","liens":"M-MY-02","src":"S48 ; S46","fia":"🟩"},{"id":"DD-MY-10","cu":"Myrtillier","th":"Flétrissement","org":"Rameaux","symp":"Une canne flétrit d'un coup, feuilles brunes qui restent attachées","causes":"Dépérissement à Botryosphaeriacées (vigilance) ; Phomopsis ; Phytophthora ; sécheresse","dist":"Botryosphaeriacées : brunissement en part de tarte dans le bois à la coupe ; si le brunissement descend au collet, la plante est perdue.","ana":"Couper la canne et regarder le bois.","act":"Couper sous la lésion, désinfecter, évacuer le bois (PV-MY-13).","liens":"M-MY-07 ; M-MY-05","src":"S133","fia":"🟩"},{"id":"DD-MY-11","cu":"Myrtillier","th":"Salinité","org":"Plante entière","symp":"Croissance ralentie et bords des feuilles brûlés en pots","causes":"Accumulation de sels (drainage insuffisant, eau salée, solution trop concentrée)","dist":"EC du lixiviat ≥ 2 dS/m ; fraction de drainage < 15 %.","ana":"Pour-through ; volume drainé ; EC de l'eau et de la solution.","act":"Rinçage à l'eau acidifiée ; ajuster la fraction de drainage (PV-MYP-08).","liens":"D-MY-02 ; SU-10","src":"S39 ; S40","fia":"🟩"},{"id":"DD-MY-12","cu":"Myrtillier","th":"Nutrition","org":"Feuilles âgées","symp":"Petites feuilles vert foncé violacé, plants chétifs","causes":"Carence en P ; froid (coloration violette temporaire au printemps froid et humide)","dist":"Le violet de froid disparaît au réchauffement ; P foliaire bas en cas de carence.","ana":"P foliaire ; températures.","act":"Phosphore seulement si confirmé.","liens":"NC-MY-PT-P","src":"S69","fia":"🟩"},{"id":"DD-MY-13","cu":"Myrtillier","th":"Phytotoxicité","org":"Plante entière","symp":"Jaunissement ou mortalité de jeunes plants après un apport d'engrais","causes":"Azote concentré près du collet ; dose d'urée trop forte en une fois ; EC trop élevée","dist":"Apparition rapide après l'apport ; plants voisins non fertilisés sains.","ana":"Carnet d'apports ; EC du sol ou du lixiviat.","act":"Fractionner ; éloigner l'engrais du collet ; rincer en pots.","liens":"NC-MY-PT-N","src":"S69","fia":"🟩"},{"id":"DD-MY-14","cu":"Myrtillier","th":"Post-récolte","org":"Post-récolte","symp":"Baies flétries ou qui coulent","causes":"Déshydratation ; « leakers » (rupture physiologique) ; pourritures","dist":"Perte d'eau rapide si refroidissement tardif ; jus qui coule = leakers.","ana":"Délai récolte → froid ; HR de stockage.","act":"Froid rapide, HR 90–95 %.","liens":"DF-MY-01 ; DF-MY-02","src":"S89","fia":"🟩"}],"themes":["Jaunissement / chlorose","Nécroses / brûlures","Flétrissement","Chute de feuilles ou de fruits","Faible croissance","Mauvaise nouaison","Petits calibres / défauts de qualité","Dépérissement racinaire","Salinité","Asphyxie","Nutrition","Phytotoxicité","Dégâts de ravageurs","Post-récolte"],"orgs":[{"id":"M-AG-01","cu":"Agrumes","ty":"Maladie","nom":"Gommose du tronc et pourriture du collet","sci":"Phytophthora citrophthora ; P. nicotianae (= P. parasitica)","grp":"Oomycète : organisme filamenteux proche des algues, qui se dissémine par des spores nageuses (zoospores) dans l'eau. Ce n'est pas un vrai champignon : beaucoup de fongicides classiques sont sans effet ; seules certaines familles (phosphonates, phénylamides, oxathiapiproline, cuivre en protection) agissent.","cls":"Gharb — documenté","stat":"Présente au Maroc, y compris dans le Gharb (Vanderweyen 1983, S98). Phytophthora spp. comptent parmi les maladies les plus répandues des agrumes marocains (El-Otmani 2006, S121).","org":"Base du tronc (au-dessus et au-dessous du point de greffe), collet, grosses racines.","resume":"Gomme qui suinte et écorce morte à la base du tronc. Dans les sols lourds du Gharb, le risque vient surtout de l'eau au contact du tronc et du point de greffe enterré : tronc sec, collet dégagé, drainage, curetage précoce.","sp":"Petites fissures de l'écorce à la base du tronc d'où suinte une gomme ambrée (« saignement ») que la pluie peut laver ; l'écorce reste ferme ; sous l'écorce grattée, tissu brun et humide séparé du tissu sain par une marge nette (S111).","sa":"Écorce qui sèche, se fend et se détache en plaques ; la lésion progresse autour du tronc jusqu'à le ceinturer ; frondaison qui jaunit et s'éclaircit, chute de feuilles, petits fruits nombreux, branches qui sèchent ; déclin en un an ou sur plusieurs années (S111).","ident":"Pas de fructification visible : le diagnostic repose sur la gomme et la lésion brune sous l'écorce, limitée à l'écorce et au cambium. Confirmation par isolement au laboratoire.","bio":"Survit des années dans le sol sous forme de spores de conservation (chlamydospores, oospores). En sol humide, il forme des sporanges qui libèrent des zoospores ; celles-ci nagent dans l'eau du sol et sont projetées par les gouttes sur le bas du tronc. P. citrophthora est actif par temps frais, P. nicotianae par temps chaud (S111). Une lésion peut aussi servir de porte d'entrée à d'autres pathogènes.","cond":"Temps frais et humide ; tronc mouillé (asperseur ou goutteur contre le tronc, cuvette qui retient l'eau au collet) ; terre accumulée au collet, point de greffe enterré ou trop bas ; sols argileux engorgés ; blessures (S98 ; S111). Les étés chauds font sécher les lésions.","stsens":"Toute l'année ; risque maximal pendant la saison des pluies (novembre–mars, S105) et lors d'irrigations qui mouillent le tronc ; jeunes arbres et porte-greffes sensibles.","m1":10,"m2":4,"surv":"Inspecter plusieurs fois par an le bas du tronc et le collet : gomme, écorce morte, terre accumulée ; sur jeunes arbres, soulever les protections de tronc (au moins 10 % des arbres protégés) ; examiner porte-greffe et collet des plants avant plantation (S111). Noter par bloc le % d'arbres porteurs de lésion active.","seuil":"Pas de seuil chiffré : toute lésion active justifie une action culturale immédiate. Repère californien : si la lésion ceinture ≥ 50 % de la circonférence d'un arbre adulte, le remplacer est souvent plus rentable que le soigner (S111).","sseuil":"S111 (Californie)","conf":"Pourriture sèche des racines (Fusarium : pas de gomme, bois sec violacé en profondeur) ; gomme physiologique après blessure ou gel ; chancres de Botryosphaeriacées ; morsures de rongeurs ; brûlure d'herbicide au collet.","confirm":"Au champ : gratter à la marge de la lésion (tissu brun humide, marge nette). Laboratoire : isolement de Phytophthora sur milieu sélectif.","prev":"Plants certifiés ; porte-greffe tolérant : le bigaradier offre une résistance suffisante en pratique, le citronnier rugueux est très sensible (S98) ; planter sur butte, premières racines juste couvertes ; ne jamais enterrer le point de greffe ; goutteurs et jets éloignés du tronc ; cuvette double (eau loin du tronc) ; éviter les blessures et la greffe basse (S98) ; drainer les parcelles lourdes.","gest":"Curetage : retirer l'écorce malade jusqu'au tissu sain plus une marge d'environ 2,5 cm, puis laisser sécher à l'air ; garder le collet dégagé et sec ; corriger l'irrigation ; revoir les lésions traitées pendant quelques mois et recommencer si besoin (S111). Arracher les arbres ceinturés et improductifs.","lbio":"Aucun agent de lutte biologique de référence pour la gommose dans les sources consultées.","onssa":["Agrumes|Gommose à phytophthora"],"chim_note":"Familles actives sur oomycètes : phosphonates (fosétyl-Al, phosphites ; FRAC P07, ex-33), phénylamides (métalaxyl-M ; FRAC 4), oxathiapiproline (FRAC 49) ; cuivre (FRAC M01) en protection (S111).","res":"Phénylamides : risque de résistance élevé → pas de répétitions sans alternance ; respecter le nombre d'applications de l'étiquette marocaine.","suivi":"Lésion curetée : bourrelet de cicatrisation et absence de nouvelle gomme 1 à 3 mois plus tard ; reprise de la pousse ; aucun nouvel arbre atteint dans le bloc.","lim":"Aucun produit ne répare l'écorce détruite ; sans correction de l'eau au collet, les rechutes sont la règle. N'utiliser que les doses de l'étiquette marocaine.","eff":"Cuivre : s'accumule dans le sol en cas d'usage répété.","fia":"🟩","src":"S98 ; S121 ; S111 ; S105 ; S152"},{"id":"M-AG-02","cu":"Agrumes","ty":"Maladie","nom":"Pourriture des radicelles (déclin à Phytophthora)","sci":"Phytophthora citrophthora ; P. nicotianae","grp":"Oomycète (voir M-AG-01).","cls":"Maroc — documenté","stat":"Phytophthora spp. et pourritures racinaires parmi les maladies les plus répandues au Maroc (El-Otmani 2006, S121).","org":"Radicelles (racines fines d'absorption), puis vigueur générale.","resume":"Les racines fines pourrissent et l'arbre décline lentement. Les symptômes ressemblent à ceux des nématodes, du sel et de l'asphyxie : examiner les racines et faire analyser le sol avant de conclure.","sp":"Radicelles dont l'écorce devient molle, brune, et se détache du cylindre central quand on la tire entre deux doigts ; feuillage vert clair à jaunâtre ; chute modérée de feuilles (S111).","sa":"Déclin progressif, surtout en jeune plantation : peu de pousses, feuilles qui tombent, rendement qui baisse ; l'arbre épuise ses réserves et ne couvre plus ses besoins en eau et en éléments (S111).","ident":"Radicelles brunes, molles, « gainées » ; pas de signe visible du pathogène à l'œil nu.","bio":"P. citrophthora provoque des pourritures racinaires d'hiver et d'été et agit surtout quand les racines sont peu actives ; P. nicotianae agit par temps chaud quand les racines poussent (S111). Zoospores transportées par l'eau d'irrigation et de pluie.","cond":"Sols lourds ou mal drainés ; sur-irrigation ; eau qui stagne au goutteur ; porte-greffe sensible ; épisodes d'engorgement (ex. inondations de février 2026 dans le Gharb, S106).","stsens":"Toute l'année ; après les engorgements d'hiver ; été pour P. nicotianae.","m1":1,"m2":12,"surv":"Sur les arbres stressés, creuser au goutteur ou au bord de la frondaison et examiner les radicelles. Prélèvement de sol : 20 à 40 points par bloc d'environ 4 ha, près des goutteurs ; échantillon composite en sac fermé, ni réfrigéré ni chauffé, au laboratoire sous 24 à 48 h ; P. nicotianae de juillet à septembre, P. citrophthora toute l'année (S111).","seuil":"Repère californien : plus de 15 à 20 propagules par gramme de sol de la zone racinaire peut justifier un traitement (S111). Aucun seuil marocain publié trouvé.","sseuil":"S111 (Californie)","conf":"Nématode des agrumes (racines épaissies et terreuses, femelles visibles à la loupe) ; salinité (brûlure du bord des feuilles, EC et chlorures élevés) ; asphyxie (racines noires et malodorantes) ; carence en azote (racines saines).","confirm":"Laboratoire : comptage de propagules par gramme de sol et infestation des racines ; analyse nématologique en parallèle ; analyse d'eau et de sol (EC, Cl, Na, SAR).","prev":"Porte-greffes tolérants (trifoliata, citrumelo Swingle, citranges, Alemow, bigaradier, S111) ; drainage et buttes ; irrigation pilotée par sondes ; pas de sur-irrigation.","gest":"Si les pertes de racines sont limitées : allonger les intervalles d'irrigation, réduire le débit au pied des arbres atteints, corriger le drainage (S111).","lbio":"Non documentée dans les sources consultées.","onssa":["Agrumes|Gommose à phytophthora"],"chim_note":"Même familles que la gommose ; l'index ONSSA (copie 05/2026) ne distingue pas un usage « pourriture des radicelles » : vérifier que l'étiquette couvre l'application au sol.","res":"Voir M-AG-01.","suivi":"Nouvelles radicelles blanches 6 à 8 semaines après correction ; reprise des pousses ; analyse de sol de contrôle l'année suivante.","lim":"Les phosphonates freinent la maladie sans l'éradiquer ; sans drainage, la maladie revient.","eff":"—","fia":"🟩","src":"S111 ; S121 ; S106 ; S152"},{"id":"M-AG-03","cu":"Agrumes","ty":"Maladie","nom":"Pourriture brune des fruits","sci":"Phytophthora citrophthora (et autres Phytophthora)","grp":"Oomycète (voir M-AG-01).","cls":"Maroc — documenté","stat":"P. citrophthora cité parmi les agents de maladies graves des fruits au Maroc (El-Otmani 2006, S121) ; 49 usages « Agrumes / Pourriture brune » dans l'index ONSSA (copie 05/2026).","org":"Fruits proches du sol (jupes), parfois rameaux, feuilles et fleurs.","resume":"Tache ferme, cuireuse, à odeur piquante sur les fruits bas après les pluies d'automne-hiver. Relever les jupes et protéger avant ou juste après la première pluie.","sp":"Sur fruit mûr ou presque mûr : tache ferme et cuireuse, d'abord imbibée, beige à brun olive, à odeur piquante, surtout sur les fruits situés près du sol (S111).","sa":"La lésion gagne tout le fruit, qui tombe ; surinfections qui ramollissent ; des fruits infectés mais sains en apparence à la récolte pourrissent en caisse et contaminent les autres (S111).","ident":"Consistance ferme et odeur piquante ; en chambre humide, fin mycélium blanc.","bio":"Les spores présentes dans le sol sont projetées par les gouttes de pluie sur les fruits des jupes ; l'infection progresse tant que l'humidité persiste (S111).","cond":"Temps frais et pluvieux ; jupes basses ; sol nu qui éclabousse (S111).","stsens":"Fruits en fin de grossissement et à maturité : octobre à février (S111) ; en Andalousie, mars–mai et surtout septembre–novembre (S110).","m1":9,"m2":2,"surv":"4 fruits de la partie basse par arbre sur 25 arbres, % de fruits atteints, surtout après l'arrêt des pluies par temps doux (S110).","seuil":"Aucun seuil chiffré publié (S110 enregistre le % de fruits atteints).","sseuil":"—","conf":"Moisissures vertes ou bleues (Penicillium : fruit mou, mycélium blanc puis spores colorées) ; anthracnose ; pourriture noire interne (Alternaria) ; piqûre de cératite (larves dans la pulpe).","confirm":"Fermeté et odeur caractéristiques ; chambre humide ; laboratoire en cas de doute.","prev":"Relever les jupes à au moins 60 cm du sol ; limiter les éclaboussures (enherbement, paillage) ; protection préventive avant ou juste après la première pluie d'automne, à renouveler si les pluies sont excessives ; pulvériser les jupes jusqu'à environ 1,2 m et le sol sous l'arbre (S111).","gest":"Ramasser et éliminer les fruits tombés ; ne pas récolter de fruits mouillés ; trier et éliminer les fruits atteints avant le conditionnement.","lbio":"Non documentée dans les sources consultées.","onssa":["Agrumes|Pourriture brune"],"chim_note":"Cuivres (contact, préventif) ; phosphonates (foliaire, fruits, sol) (S111).","res":"Cuivre : risque faible de résistance ; phosphonates : faible.","suivi":"% de fruits bas atteints après chaque épisode pluvieux ; taux de pourritures en station de conditionnement.","lim":"Une protection appliquée après plusieurs jours de pluie est moins efficace ; vérifier le DAR avant les récoltes précoces de clémentines.","eff":"—","fia":"🟩","src":"S111 ; S110 ; S121 ; S152"},{"id":"M-AG-04","cu":"Agrumes","ty":"Maladie","nom":"Pourriture sèche des racines","sci":"Fusarium solani","grp":"Champignon du sol, opportuniste : il colonise surtout des tissus déjà blessés ou affaiblis.","cls":"Maroc — documenté","stat":"Citée parmi les maladies les plus répandues des agrumes au Maroc (El-Otmani 2006, S121 ; résumé).","org":"Grosses racines et collet sous terre.","resume":"Effondrement de l'arbre des années après l'infection, sans gomme. Elle suit souvent une autre blessure (Phytophthora, outils, brûlure d'engrais) ou un engorgement : il n'existe pas de fongicide efficace, tout repose sur la prévention.","sp":"Vigueur réduite, feuilles vert terne, peu de pousses, dessèchement de rameaux (S111).","sa":"Flétrissement et dessèchement brutal du feuillage quand les racines sont très atteintes ; écorce du collet pourrie (humide puis sèche, collée au bois) ; bois dur et sec coloré gris-brun à violet, en profondeur ; effondrement de l'arbre quand le collet est ceinturé (S111).","ident":"Pas de gomme ; coloration violacée du bois sous l'écorce du collet.","bio":"Champignon qui vit sur le bois mort ou mourant ; il infecte les grosses racines et le collet, souvent par une blessure ; les symptômes aériens apparaissent des années après l'infection (S111).","cond":"Blessures antérieures (Phytophthora, outils, rongeurs) ; brûlures racinaires par excès d'engrais, d'herbicides ou de nématicides ; stress ; sol saturé autour du collet ; tous les porte-greffes courants sont sensibles (S111).","stsens":"Toute l'année ; arbres stressés.","m1":1,"m2":12,"surv":"Sur tout arbre qui flétrit brutalement : dégager la terre tout autour du collet et des grosses racines ; rechercher les blessures et la gommose associée (S111).","seuil":"Sans objet (diagnostic d'arbre).","sseuil":"—","conf":"Gommose à Phytophthora (gomme, lésion superficielle à marge nette) ; asphyxie ; nématodes ; tristeza (porte-greffe bigaradier).","confirm":"Examen du collet ; isolement au laboratoire si nécessaire.","prev":"Irrigation adaptée au besoin, tronc sec, drainage ; matériel nettoyé entre vergers ; pas de blessure au collet, surtout par temps frais et humide ; engrais et herbicides aux doses de l'étiquette ; ne pas fertiliser un jeune plant avant environ 6 semaines ou avant la reprise (S111).","gest":"Dégager le collet pour le faire sécher, relever les jupes, corriger le drainage ; arracher les arbres très atteints et improductifs (S111).","lbio":"—","onssa":[],"chim_note":"Aucun fongicide efficace connu (S111).","res":"—","suivi":"Arrêt de la progression des symptômes ; absence de nouveaux arbres atteints.","lim":"Diagnostic souvent tardif ; seule la prévention est efficace.","eff":"—","fia":"🟩","src":"S111 ; S121"},{"id":"M-AG-05","cu":"Agrumes","ty":"Maladie","nom":"Tristeza (CTV)","sci":"Citrus tristeza virus (Closterovirus)","grp":"Virus transmis par greffage et par pucerons (transmission semi-persistante : le puceron acquiert et transmet le virus en 30 min à 24 h). Pas de transmission par la semence (S114).","cls":"Maroc — documenté","stat":"Présent au Maroc, distribution restreinte (OEPP, information 2015) : ~25 % des arbres testés infectés en moyenne lors d'une enquête nationale, jusqu'à 60 % dans le Loukkos (Afechtal et al. 2015, S122) ; Toxoptera citricida, le vecteur le plus efficace, n'a pas été trouvé au Maroc (S113). Programme de plants certifiés depuis 1980–1984 (S121 ; S113).","org":"Plante entière : point de greffe, racines, frondaison, fruits.","resume":"Sur bigaradier, porte-greffe historique, la tristeza peut tuer un oranger ou un mandarinier en quelques mois. Plants certifiés, porte-greffes tolérants et suivi des pucerons vecteurs sont la seule protection : aucun traitement ne guérit l'arbre.","sp":"Feuillage vert clair, pousses faibles, chute de feuilles ; forte charge de petits fruits ; jeunes arbres malades qui fleurissent tôt et abondamment (S111).","sa":"Déclin rapide des orangers, mandariniers et pomelos greffés sur bigaradier : frondaison flétrie, défoliée, mort en quelques mois ; selon les isolats, cannelures profondes du bois (« stem pitting ») sous une écorce épaissie, rameaux cassants (S114).","ident":"Diagnostic visuel impossible à coup sûr : le virus se détecte par test.","bio":"Les isolats diffèrent par leur virulence. Le bigaradier est très sensible au déclin et reste le porte-greffe dominant en Méditerranée. Vecteurs : Aphis gossypii (principal en Méditerranée), A. spiraecola, Toxoptera aurantii, A. craccivora, Myzus persicae ; T. citricida jusqu'à 25 fois plus efficace qu'A. gossypii (S114).","cond":"Porte-greffe bigaradier ; greffons non certifiés ; fortes populations de pucerons sur les pousses tendres.","stsens":"Pousses de printemps et d'automne (pucerons) ; symptômes plus nets en été (S111).","m1":3,"m2":11,"surv":"Suivi des pucerons sur 4 pousses par arbre sur 25 arbres au printemps et à l'automne, même quand la pousse est faible ; faire identifier les pucerons au laboratoire et vérifier l'absence de Toxoptera citricida (S110).","seuil":"Pas de seuil : tout arbre suspect est testé.","sseuil":"—","conf":"Pourriture des racines (Phytophthora), pourriture sèche (Fusarium), asphyxie, nématodes : tous donnent un déclin.","confirm":"ELISA (anticorps MCA13 pour les isolats sévères), RT-PCR ; indexage biologique sur lime mexicaine (S114). Contacter l'ONSSA pour tout foyer suspect.","prev":"Plants et greffons certifiés indemnes ; porte-greffes tolérants (trifoliata et hybrides, lime Rangpur, citronnier Volkamer, S114) — vérifier leur comportement vis-à-vis du calcaire, du sel et du Phytophthora avant de choisir ; ne pas surgreffer avec du matériel non contrôlé.","gest":"Arracher les arbres infectés selon les consignes officielles ; pas de traitement curatif (S114).","lbio":"Préserver les ennemis naturels des pucerons (voir pucerons).","onssa":[],"chim_note":"Aucun traitement contre le virus. Les insecticides contre pucerons ne protègent efficacement que s'ils sont appliqués sur de grandes surfaces (S111).","res":"—","suivi":"Tests de contrôle des nouveaux plants ; registre des arbres testés.","lim":"Le statut sanitaire réel d'une parcelle ne se connaît que par test ; les isolats « doux » restent latents longtemps.","eff":"—","fia":"🟩","src":"S113 ; S114 ; S122 ; S111 ; S110 ; S121"},{"id":"M-AG-06","cu":"Agrumes","ty":"Maladie","nom":"Stubborn","sci":"Spiroplasma citri","grp":"Bactérie sans paroi (mollicute) vivant dans la sève élaborée ; transmise par des cicadelles et par les greffons, pas par les outils ni la semence (S111).","cls":"Maroc — documenté","stat":"Présent et répandu au Maroc (OEPP, information 2022 ; Sagouti et al. 2022, S125).","org":"Plante entière : fruits, feuillage, port de l'arbre.","resume":"Fruits petits et déformés, de tailles et de maturités mélangées sur le même arbre. Il n'y a pas de traitement : greffons sains et arrachage des arbres atteints.","sp":"Floraison irrégulière : fruits de tailles et de maturités différentes en même temps ; fruits petits, asymétriques (ombilic décentré à la coupe), extrémité stylaire restant verte, graines avortées, goût fade ou amer (S111).","sa":"Entre-nœuds courts, frondaison touffue et rabougrie ; petites feuilles dressées et pointues, marbrures proches d'une carence en zinc, chute de feuilles, dessèchement, arbre à sommet plat ; rendement faible ou nul (S111).","ident":"Diagnostic visuel fiable seulement si les symptômes sont nets ; sinon test.","bio":"Transmis par des cicadelles et par greffage ; passe du greffon au porte-greffe. Favorisé par le temps chaud et sec ; plus grave en jeune verger (S111).","cond":"Chaleur, sécheresse ; hôtes alternatifs des cicadelles (pervenche, nombreuses crucifères) (S111).","stsens":"Jeunes vergers ; symptômes visibles sur la récolte.","m1":7,"m2":12,"surv":"Repérer en fin d'automne–début d'hiver les arbres à récolte faible et fruits déformés ; les marquer et les revoir (S111).","seuil":"Sans objet.","sseuil":"—","conf":"Carence en zinc (marbrures, mais fruits normaux) ; tristeza ; dégâts de thrips (fruits marqués, non déformés).","confirm":"PCR (plus sensible que la culture, 2–3 semaines) sur environ 15 baguettes de rameaux symptomatiques prélevées de juillet à octobre (S111).","prev":"Arbres-mères et greffons indemnes ; ne pas surgreffer ; désherber strictement autour des jeunes vergers (S111).","gest":"Remplacer chaque année les arbres malades ou improductifs dans les vergers de moins de 6 ans (S111).","lbio":"—","onssa":[],"chim_note":"Aucun traitement.","res":"—","suivi":"Recensement annuel des arbres symptomatiques par bloc.","lim":"Symptômes variables selon la variété (oranger, pomelo, tangelo les plus touchés ; citronniers plus tolérants, S111).","eff":"—","fia":"🟩","src":"S113 ; S125 ; S111"},{"id":"M-AG-07","cu":"Agrumes","ty":"Maladie","nom":"Exocortis","sci":"Citrus exocortis viroid (CEVd)","grp":"Viroïde : petite molécule d'ARN infectieuse, sans enveloppe ; transmise par greffage et par les outils de taille ; la chaleur ne l'inactive pas (S111).","cls":"Maroc — documenté","stat":"Présent et répandu au Maroc (OEPP, information 2020 ; Bibi et al. 2020, S123).","org":"Écorce du porte-greffe ; vigueur.","resume":"Écorce du porte-greffe qui s'écaille et arbre nanifié, surtout sur trifoliata et ses hybrides. Il n'y a aucun traitement : prévention par greffons indemnes et désinfection des outils.","sp":"Écaillement de l'écorce du porte-greffe : écorce qui sèche, se fend et se soulève en fines lamelles, souvent avec des gouttelettes de gomme dessous (S111).","sa":"Arbres nanifiés ; baisse lente de la productivité ; rarement mortel (S111).","ident":"Symptôme au porte-greffe uniquement si celui-ci est sensible.","bio":"Transmis par greffons infectés et outils contaminés (sécateurs, scies) (S111).","cond":"Porte-greffes sensibles (trifoliata le plus touché, S111).","stsens":"Toute la vie de l'arbre.","m1":null,"m2":null,"surv":"Examiner l'écorce du porte-greffe lors des visites d'hiver.","seuil":"Sans objet.","sseuil":"—","conf":"Gommose (gomme, lésion humide) ; dégâts mécaniques.","confirm":"Test moléculaire (RT-PCR) en laboratoire.","prev":"Greffons issus de matériel contrôlé ; désinfecter les outils à l'eau de Javel entre arbres (S111).","gest":"Arracher les arbres atteints si la production n'est plus rentable (S111).","lbio":"—","onssa":[],"chim_note":"Aucun traitement.","res":"—","suivi":"—","lim":"Sur porte-greffe tolérant, l'arbre peut porter le viroïde sans symptôme et le transmettre par les outils.","eff":"—","fia":"🟩","src":"S113 ; S123 ; S111"},{"id":"M-AG-08","cu":"Agrumes","ty":"Maladie","nom":"Cachexie / xyloporose","sci":"Hop stunt viroid (HSVd)","grp":"Viroïde (voir M-AG-07).","cls":"Maroc — documenté","stat":"Présent au Maroc : premier signalement sur agrumes (Afechtal et al. 2016, S124) ; incidence étudiée en vergers commerciaux (Bibi et al. 2020, S123).","org":"Écorce et bois (porte-greffe ou greffon selon les hôtes sensibles).","resume":"Viroïde présent au Maroc, transmis par greffage et outils. Même stratégie que l'exocortis : matériel végétal contrôlé et désinfection des outils.","sp":"Symptômes non décrits dans les sources consultées pour ce classeur.","sa":"Non décrits dans les sources consultées (diagnostic par test).","ident":"—","bio":"Transmission par greffage et outils (viroïde).","cond":"Matériel de greffage non contrôlé.","stsens":"—","m1":null,"m2":null,"surv":"Pas de surveillance visuelle spécifique documentée.","seuil":"Sans objet.","sseuil":"—","conf":"Exocortis ; autres maladies de greffe.","confirm":"RT-PCR en laboratoire.","prev":"Greffons contrôlés ; désinfection des outils.","gest":"Selon consignes officielles.","lbio":"—","onssa":[],"chim_note":"Aucun traitement.","res":"—","suivi":"—","lim":"Fiche limitée : symptômes non documentés dans les sources lues.","eff":"—","fia":"🟨","src":"S113 ; S124 ; S123"},{"id":"M-AG-09","cu":"Agrumes","ty":"Maladie","nom":"Alternariose des mandarines (tache brune)","sci":"Alternaria alternata, pathotype « tangerine » (toxine ACT spécifique de l'hôte)","grp":"Champignon à petites spores ; seules certaines souches produisent la toxine qui tue les tissus des variétés sensibles.","cls":"Vigilance — non signalé au Maroc","stat":"Non signalée au Maroc dans les sources consultées : la revue de Timmer et al. (2003, S120) la cite en Espagne, Israël et Turquie, pas au Maroc. Concerne les variétés sensibles (Nova, Fortune, Minneola, Murcott…).","org":"Jeunes feuilles, rameaux, fruits.","resume":"Maladie grave des mandarines sensibles en climat méditerranéen. À surveiller seulement si le client plante Nova, Fortune, Minneola ou Murcott ; les clémentines servent de parent résistant en sélection.","sp":"Petites taches brun-noir visibles dès 24 h après l'infection ; sur feuilles adultes, lésions brunes entourées d'un halo jaune, nécrose qui suit les nervures (S120).","sa":"Chute des feuilles, dessèchement des rameaux (lésions de 1 à 10 mm) ; sur fruits, taches brun-noir allant de la ponctuation au cratère, éruptions liégeuses, chute des fruits très atteints (S120).","ident":"Spores (conidies) formées sur les lésions âgées et les rameaux morts.","bio":"Les conidies se forment sur les lésions anciennes et sont libérées par la pluie ou par une variation brusque d'humidité ; optimum 27 °C ; peu d'infection à 32 °C ; 10 à 12 h d'humectation nécessaires pour une forte infection (4 à 8 h : faible) ; tous les tissus jeunes des variétés sensibles sont réceptifs (S120).","cond":"Variétés sensibles (Minneola la plus sensible, puis Orlando, Sunburst, Nova ; aussi Murcott, Emperor, Ponkan, Ellendale, Dancy) ; rosées nocturnes, pluies ; aspersion ; excès d'eau et d'azote (S120).","stsens":"Pousses de printemps ; fruits de la chute des pétales jusqu'au milieu de l'été (S120).","m1":3,"m2":11,"surv":"Variétés sensibles seulement : 25 arbres, tronc, charpentières, feuilles et fruits ; % d'arbres avec symptômes ; mars–mai et septembre–novembre ; forte chute de feuilles au sol = indice (S110).","seuil":"Pas de seuil de traitement publié ; modèle Alter-Rater (Floride) : points cumulés selon pluie, humectation (~10 h) et température (20–32 °C), traitement à 50, 100 ou 150 points selon la sensibilité et l'historique (S120).","sseuil":"S120 (Floride)","conf":"Anthracnose ; brûlures d'origine chimique ; dégâts de thrips sur fruits.","confirm":"Laboratoire : isolement et test de pathogénicité ou marqueurs génétiques (le pathotype ne se distingue pas au microscope, S120).","prev":"Plants sains (vergers restés sains 6 à 8 ans quand plantés avec du matériel indemne) ; espacement, relevage des jupes ; éviter aspersion, excès d'irrigation et d'azote (S120).","gest":"Réduire l'inoculum (rameaux morts) ; mesures culturales rarement suffisantes seules (S120).","lbio":"Non documentée.","onssa":[],"chim_note":"Aucun usage spécifique « alternariose » sur agrumes dans l'index ONSSA (copie 05/2026) : Usage Maroc non vérifié — ne pas intégrer au programme opérationnel.","res":"Strobilurines (QoI) à site unique : alterner ou associer (S120).","suivi":"% de feuilles et fruits tachés sur les variétés sensibles.","lim":"Référence étrangère : présence au Maroc non démontrée.","eff":"—","fia":"🟩","src":"S120 ; S110 ; S152"},{"id":"M-AG-10","cu":"Agrumes","ty":"Maladie","nom":"Pourritures de conservation (moisissures verte et bleue, pourriture amère…)","sci":"Penicillium digitatum (verte), P. italicum (bleue), Geotrichum candidum (pourriture amère), Alternaria citri (pourriture noire), Diplodia / Phomopsis (pourritures pédonculaires)","grp":"Champignons de blessure : ils n'infectent le fruit que par une plaie (sauf pourritures pédonculaires, qui entrent par le pédoncule).","cls":"Maroc — documenté","stat":"Penicillium spp., Geotrichum candidum et Alternaria citri cités comme agents de maladies graves des fruits au Maroc (El-Otmani 2006, S121) ; nombreux usages « Agrumes : Fruits » dans l'index ONSSA (copie 05/2026).","org":"Fruits récoltés (station, transport, marché).","resume":"Les pourritures de conservation commencent presque toujours par une blessure : récolte et manutention soignées, hygiène de station et froid rapide valent mieux que les traitements, d'autant que des résistances aux fongicides sont connues.","sp":"Zone molle et aqueuse décolorée ; puis mycélium blanc et spores vertes (P. digitatum) ou bleues (P. italicum) (S134).","sa":"Fruit entièrement pourri ; contamination des fruits voisins (P. italicum progresse au froid) ; pertes post-récolte pouvant atteindre 30 à 50 % sans maîtrise (contexte brésilien, S134).","ident":"Couleur des spores ; Geotrichum : pourriture aigre, liquide, sans spores colorées ; Alternaria : pourriture noire interne de la columelle (S120).","bio":"Spores dans l'air de la station et du verger ; infection par les blessures de récolte et de manutention ; P. digitatum cause environ 90 % des pertes, P. italicum tolère mieux le froid ; sévérité accrue avec la maturité et à 20–25 °C ; sur citron, lésion de 4,8 mm/jour à température ambiante contre 1,4 mm/jour au froid, premiers signes en 2–3 jours contre 12–13 jours (S134).","cond":"Blessures (ongles, pédoncules longs, chocs) ; fruits surmûrs ou mouillés ; délai avant le froid ; station sale.","stsens":"Récolte et conservation.","m1":10,"m2":6,"surv":"Taux de pourritures par lot en station ; contrôle des blessures à la récolte (échantillon de caisses).","seuil":"Sans objet : objectif qualité de l'acheteur.","sseuil":"—","conf":"Pourriture brune (Phytophthora : ferme, odeur piquante) ; dégâts de cératite ; anthracnose.","confirm":"Observation des spores ; laboratoire pour la sensibilité aux fongicides si échecs.","prev":"Récolte de fruits secs, pédoncules coupés court, caisses propres ; froid rapide ; hygiène et désinfection de la station ; éliminer les fruits pourris (S134).","gest":"Tri soigné ; traitement post-récolte autorisé par l'index ONSSA ; alternatives documentées : eau chaude (trempage 52–53 °C ou douche 62 °C), carbonates/bicarbonates, levures antagonistes (S134).","lbio":"Levures antagonistes (efficacité partielle, fortes concentrations nécessaires, S134).","onssa":["Agrumes: Fruits|*"],"chim_note":"Usages « Agrumes : Fruits » listés automatiquement ; respecter les LMR du pays de destination.","res":"Résistances de Penicillium à l'imazalil, au thiabendazole et à d'autres fongicides de post-récolte décrites (S134) : alterner et tester les isolats.","suivi":"Taux de pourritures après 7, 14 et 21 jours de conservation par lot.","lim":"Les traitements ne compensent pas les blessures ni un délai de mise au froid trop long.","eff":"—","fia":"🟩","src":"S121 ; S134 ; S120 ; S152"},{"id":"M-AG-11","cu":"Agrumes","ty":"Maladie","nom":"Mal secco (vigilance)","sci":"Plenodomus tracheiphilus (ex-Phoma tracheiphila)","grp":"Champignon vasculaire.","cls":"Vigilance — non signalé au Maroc","stat":"Aucun enregistrement pour le Maroc dans la base OEPP (consultée le 16/10/2026, S113) : ne pas le présenter comme présent. La v3 le listait parmi les bioagresseurs à surveiller ; c'est corrigé.","org":"Citronniers surtout : rameaux, branches.","resume":"Maladie vasculaire grave des citronniers en Méditerranée, non signalée au Maroc dans les sources consultées. Tout dessèchement suspect de citronnier doit être signalé à l'ONSSA.","sp":"Non détaillés dans les sources lues pour ce classeur.","sa":"—","ident":"—","bio":"—","cond":"—","stsens":"—","m1":null,"m2":null,"surv":"Signalement de tout dessèchement de rameaux de citronnier avec bois coloré.","seuil":"Sans objet.","sseuil":"—","conf":"Dessèchements à Botryosphaeriacées ; gel.","confirm":"Laboratoire officiel.","prev":"Plants contrôlés.","gest":"—","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Fiche de vigilance.","eff":"—","fia":"🟨","src":"S113"},{"id":"M-AG-12","cu":"Agrumes","ty":"Vigilance","nom":"Organismes de quarantaine absents (HLB, chancre, black spot)","sci":"Candidatus Liberibacter spp. (huanglongbing) et ses vecteurs Diaphorina citri et Trioza erytreae ; Xanthomonas citri (chancre) ; Phyllosticta citricarpa (black spot)","grp":"Bactéries et champignon réglementés.","cls":"Absent — organisme de quarantaine","stat":"Phyllosticta citricarpa : absent, confirmé par prospection (OEPP ; Maroc reconnu indemne par la décision UE 98/83). Diaphorina citri et Trioza erytreae : aucun enregistrement pour le Maroc dans la base OEPP (S113).","org":"Plante entière.","resume":"Ces maladies n'existent pas au Maroc selon les sources consultées. Le risque vient de l'introduction de plants ou de greffons non contrôlés et, pour le HLB, de l'arrivée d'un psylle vecteur.","sp":"Non traités en détail dans ce classeur (organismes absents).","sa":"—","ident":"—","bio":"—","cond":"Introduction de matériel végétal non contrôlé.","stsens":"—","m1":null,"m2":null,"surv":"Ne jamais introduire de plants ou de greffons hors circuit officiel ; signaler tout psylle sur jeunes pousses d'agrumes.","seuil":"Sans objet.","sseuil":"—","conf":"—","confirm":"Laboratoire officiel (ONSSA).","prev":"Plants certifiés ; respect des quarantaines.","gest":"Déclaration obligatoire.","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Fiche de vigilance.","eff":"—","fia":"🟩","src":"S113"},{"id":"D-AG-01","cu":"Agrumes","ty":"Désordre","nom":"Excès de sels et chlorures (brûlures de bord de feuille)","sci":"Salinité de l'eau ou du sol ; toxicité du chlorure, du sodium ou du bore","grp":"Désordre abiotique (non parasitaire).","cls":"Maroc — documenté","stat":"Qualité des eaux souterraines variable selon les secteurs du Gharb (Mnasra, Sidi Yahya, littoral) : analyser chaque forage (TR-EAU).","org":"Feuilles âgées puis jeunes ; racines.","resume":"Le sel réduit l'eau que l'arbre peut absorber (effet osmotique) et le chlorure s'accumule dans les feuilles. Mesurer l'eau et le sol avant toute conclusion ; la correction passe par la fraction de lessivage et le drainage, pas par un produit miracle.","sp":"Brûlure de la pointe et des bords des feuilles âgées ; flétrissement aux heures chaudes alors que le sol est humide (S145).","sa":"Chute de feuilles, petits fruits, baisse de rendement ; seuil de baisse de rendement de l'oranger : ECe 1,7 dS/m (−16 % par dS/m, FAO-29) ou 1,3 dS/m (−13,1 %/dS/m, mise à jour Maas & Grattan) (S143 ; S67).","ident":"—","bio":"Le sel s'accumule dans la zone racinaire si le lessivage est insuffisant ; en goutte-à-goutte, il se concentre en surface et en bordure du bulbe humide (S143).","cond":"Eau d'irrigation salée ; lessivage insuffisant ; nappe salée ; pluies légères qui ramènent le sel vers les racines (S143).","stsens":"Été (forte demande climatique) ; jeunes arbres.","m1":6,"m2":10,"surv":"Analyse d'eau (EC, Cl, Na, SAR, HCO3, B) au moins une fois par an et à chaque nouveau forage ; EC de la solution du sol (pâte saturée) ; analyse foliaire Cl et Na.","seuil":"Eau : restriction légère à modérée de 0,7 à 3,0 dS/m, sévère au-delà ; chlorure en irrigation de surface 4–10 me/L modéré, > 10 sévère ; bore 0,7–3,0 mg/L modéré (FAO-29, S143).","sseuil":"S143","conf":"Carence en potassium (bords brûlés, même aspect) ; sécheresse ; pourriture racinaire ; brûlures d'engrais.","confirm":"EC et chlorures de l'eau, de la pâte saturée du sol et des feuilles.","prev":"Porte-greffe tolérant aux chlorures ; fraction de lessivage adaptée ; drainage ; continuer d'irriguer pendant les petites pluies jusqu'à 50–100 mm cumulés (S143).","gest":"Calculer le besoin de lessivage (feuille Eau, sel et racines) ; mélanger les eaux si possible ; éviter les engrais chlorés.","lbio":"—","onssa":[],"chim_note":"Voir la fiche « Correcteurs de salinité » : aucun produit n'élimine le sel sans drainage.","res":"—","suivi":"EC de la pâte saturée et chlorures foliaires l'année suivante ; disparition des brûlures sur les nouvelles pousses.","lim":"Les seuils FAO supposent des porte-greffes n'accumulant pas rapidement Na et Cl (S143).","eff":"—","fia":"🟩","src":"S143 ; S67 ; S145 ; TR-EAU"},{"id":"D-AG-02","cu":"Agrumes","ty":"Désordre","nom":"Asphyxie racinaire (engorgement)","sci":"Manque d'oxygène dans la zone racinaire","grp":"Désordre abiotique.","cls":"Gharb — documenté","stat":"Sols argileux engorgés favorisant la gommose (S98) ; inondations de février 2026 dans le Gharb (S106).","org":"Racines, puis frondaison.","resume":"Après plusieurs jours d'eau stagnante, les racines meurent faute d'oxygène et ouvrent la porte au Phytophthora. Drainer, ne pas irriguer un sol encore saturé et surveiller les collets dans les semaines qui suivent.","sp":"Flétrissement et jaunissement après un épisode d'engorgement ; chute de feuilles.","sa":"Dessèchement de branches ; racines noires et malodorantes ; pourritures secondaires (Phytophthora, Fusarium).","ident":"—","bio":"—","cond":"Sols lourds, cuvettes, nappe haute, fortes pluies (S106) ; irrigation sur sol déjà humide.","stsens":"Saison des pluies (novembre–mars, S105).","m1":11,"m2":3,"surv":"Après chaque forte pluie : repérer les zones d'eau stagnante ; sonder l'humidité avant de reprendre l'irrigation.","seuil":"Sans objet.","sseuil":"—","conf":"Pourriture des racines à Phytophthora ; tristeza ; nématodes.","confirm":"Examen des racines (noires, odeur) ; analyse Phytophthora si le déclin persiste.","prev":"Drainage, buttes de plantation, nivellement ; pilotage de l'irrigation par sondes.","gest":"Évacuer l'eau ; suspendre l'irrigation jusqu'au ressuyage ; surveiller les collets.","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"Reprise des radicelles blanches ; nouvelles pousses.","lim":"—","eff":"—","fia":"🟩","src":"S98 ; S106 ; S105"},{"id":"R-AG-01","cu":"Agrumes","ty":"Ravageur","nom":"Cératite (mouche méditerranéenne des fruits)","sci":"Ceratitis capitata (Diptera : Tephritidae)","grp":"Insecte, diptère (mouche) ; la larve (asticot) se développe dans la pulpe du fruit.","cls":"Gharb — documenté","stat":"Présente et répandue au Maroc (OEPP, information 2018, S113) ; étude de piégeage massif en vergers de clémentiniers du Gharb (Rouissi et al., IOBC, S117 — titre seul) ; programme national de lâchers de mâles stériles depuis 2024 dans le Souss (pas encore dans le Gharb, S118).","org":"Fruits.","resume":"Une seule piqûre suffit à faire refuser un lot vers les marchés exigeants. Pièges de surveillance dès que les fruits deviennent réceptifs, ramassage des fruits tombés, piégeage massif ou appâts selon les captures ; respecter le DAR des clémentines précoces.","sp":"Petites piqûres de ponte souvent difficiles à voir au début (S114).","sa":"Galeries et pourriture interne, visibles à l'extérieur seulement quand les dégâts internes sont importants ; chute des fruits ; pourritures secondaires (S114).","ident":"Adulte : mâle à antennes jaune-orangé, thorax noir à dessins argentés, scutellum blanc-jaune taché, ailes à bandes jaune-brun interrompues ; une soie de la tête du mâle se termine par une palette sombre en losange. Femelle : ovipositeur pointu. Larve : asticot cylindrique de 5 à 15 mm (l'espèce ne se reconnaît pas sur la larve seule) (S114).","bio":"Ponte sous l'épiderme du fruit ; trois stades larvaires dans le fruit ; la larve âgée quitte le fruit et se nymphose dans le sol. Ponte 3 à 6 jours après l'émergence ; adultes vivant environ 11 semaines (mâles) et 9 semaines (femelles) ; développement larvaire 5–21 j et nymphal 8–35 j entre 30 et 15 °C ; cycle complet d'environ 32 jours à 25 °C ; plus de 350 plantes hôtes (S114).","cond":"Fin d'été et automne ; variétés précoces (clémentines) récoltées au pic de population (S119) ; fruits tombés non ramassés ; hôtes voisins.","stsens":"Fruits réceptifs, du calibre définitif à la récolte : variétés précoces de juillet à mi-décembre, mi-saison de mi-août à mi-décembre, tardives (Maroc-Late) de mars à août (S110).","m1":7,"m2":12,"surv":"Pièges de surveillance au trimedlure (mâles) ou à attractif alimentaire (deux sexes) ; en Andalousie, 2 pièges par station de 25 arbres, relevés hebdomadaires en mouches/piège/jour ; observation de 8 fruits par arbre (2 par orientation) pour le % de fruits piqués (S110 ; S114). Pratique marocaine rapportée : au moins 1 piège pour 2 ha (S44, presse technique).","seuil":"Espagne : intervenir au-delà d'1 mâle/piège/jour (S119). Repère marocain rapporté par la presse technique : > 1 mâle/piège/jour ou > 0,5 femelle/piège/jour et > 1 % de fruits piqués (S44, 🟨). Vers les marchés à protocole (États-Unis…) : tolérance zéro de fruit piqué (S110 ; S119).","sseuil":"S119 ; S44","conf":"Piqûres d'autres insectes, blessures, pourriture brune, pourritures de conservation.","confirm":"Couper les fruits suspects et rechercher les asticots ; élever les larves pour identification si nécessaire (S114).","prev":"Ramasser et détruire les fruits tombés ou infestés ; récolter à temps ; supprimer les hôtes abandonnés voisins ; piégeage massif sur les variétés précoces (S119 ; S114).","gest":"Piégeage massif ; traitements par appâts en taches (moins d'impact sur les auxiliaires) ou stations d'appâts ; lutte autocide (mâles stériles) dans les zones couvertes par le programme national (S114 ; S118).","lbio":"Lâchers de mâles stériles (centre d'Agadir, 20 millions/semaine en 2025 ; lâchers à Ouled Berhil, Taroudant, 2 000 insectes/ha, S118). Parasitoïde cité : Opius (Psyttalia) concolor (S44, 🟨).","onssa":["Agrumes|Cératite"],"chim_note":"Privilégier les appâts et les stations ; les pyréthrinoïdes en plein détruisent les auxiliaires (risque de pullulation d'acariens et de cochenilles).","res":"Alterner les modes d'action IRAC ; vérifier les DAR avant les récoltes précoces.","suivi":"Courbe hebdomadaire des captures ; % de fruits piqués avant chaque récolte ; taux de refus à l'export.","lim":"Les captures de pièges ne disent pas à elles seules le % de fruits attaqués ; le seuil marocain cité provient de la presse technique (non publié).","eff":"Pyréthrinoïdes : toxiques pour les auxiliaires et les pollinisateurs.","fia":"🟩","src":"S113 ; S114 ; S110 ; S119 ; S118 ; S117 ; S44 ; S152"},{"id":"R-AG-02","cu":"Agrumes","ty":"Ravageur","nom":"Mineuse des agrumes","sci":"Phyllocnistis citrella (Lepidoptera : Gracillariidae)","grp":"Insecte, petit papillon dont la chenille mine les jeunes feuilles.","cls":"Maroc — documenté","stat":"Présente au Maroc (OEPP, information 2015) et considérée comme ravageur clé des agrumes marocains (Mazih 2015, S127) ; travaux publiés dans le Gharb (S115, référence citée).","org":"Jeunes feuilles des pousses tendres (feuilles encore souples).","resume":"Grave sur pépinières et arbres de moins de 4 ans ; négligeable sur verger adulte (sauf citronniers à pousses multiples). Grouper les pousses (taille et azote raisonnés) et ne traiter que les jeunes arbres avec galeries actives.","sp":"Galeries serpentines argentées sur la face supérieure ou inférieure des feuilles naissantes (S111).","sa":"Feuilles enroulées et déformées ; perte de surface foliaire et retard de croissance des jeunes arbres ; porte d'entrée du chancre bactérien là où il existe (absent du Maroc) (S111).","ident":"Adulte < 2 mm, envergure ~4 mm, ailes blanc argenté irisé avec une tache noire à l'extrémité, actif du crépuscule au matin. Œufs isolés à la face inférieure des feuilles naissantes, le long de la nervure. Larve dans une galerie sinueuse avec un trait d'excréments au centre ; nymphe dans le bord de feuille enroulé (S111).","bio":"Éclosion en 4–5 jours ; 4 mues larvaires en 1 à 3 semaines ; cycle complet de 2 à 7 semaines selon la température ; seules les feuilles très tendres sont attaquées (S111 ; S110).","cond":"Pousses tendres d'été et d'automne ; taille répétée ; azote qui relance la pousse quand la pression est forte ; gourmands et rejets (S111).","stsens":"Pousses de printemps (jeunes arbres), d'été et d'automne ; mai à fin octobre en Andalousie (S110).","m1":5,"m2":10,"surv":"4 pousses nouvelles par arbre sur 25 arbres (% de pousses avec galeries actives) ; n'évaluer que si la pousse est suffisante ; méthode des anneaux de 50 cm pour juger l'intensité de la pousse (S110). Pièges à phéromone (1 pour 2 ha) pour suivre les vols (S111).","seuil":"Aucun seuil chiffré publié (S111 ; S110). Arbres adultes : traitement en général inutile (S111).","sseuil":"S111","conf":"Enroulement par pucerons ; déformations de carence ; thrips.","confirm":"Galerie avec trait d'excréments central et larve visible par transparence.","prev":"Une seule taille par an pour grouper la pousse ; ne pas pousser l'azote quand la pression est forte ; supprimer gourmands et rejets sous le greffon ; ne pas enlever les feuilles minées (elles restent utiles) (S111).","gest":"Sur jeunes arbres et pépinières seulement : protéger les pousses en croissance (S111).","lbio":"Parasitoïdes (Cirrospilus, Pnigalio… en Californie) ; leur présence au Maroc n'est pas documentée dans les sources consultées (S111).","onssa":["Agrumes|Mineuse","Agrumes|Mineuse des feuilles"],"chim_note":"Les néonicotinoïdes sont soumis à des LMR UE très basses (thiaméthoxame) : vérifier la destination des fruits.","res":"Alterner les modes d'action (S111).","suivi":"% de pousses avec galeries actives 7 à 10 jours après intervention ; croissance des jeunes arbres.","lim":"Traiter des galeries anciennes (sans larve vivante) est inutile.","eff":"Néonicotinoïdes : toxiques pour les pollinisateurs (hors floraison seulement).","fia":"🟩","src":"S113 ; S127 ; S111 ; S110 ; S152"},{"id":"R-AG-03","cu":"Agrumes","ty":"Ravageur","nom":"Pou de Californie","sci":"Aonidiella aurantii (Hemiptera : Diaspididae)","grp":"Insecte, cochenille à bouclier (diaspine) : la femelle vit fixée sous un bouclier cireux qu'elle ne quitte jamais.","cls":"Gharb — documenté","stat":"Présent au Maroc : études de lutte au Tadla (Guirrou et al. 2003, S116) ; Aphytis melinus, parasitisme d'environ 52 % cité pour le Gharb (S80).","org":"Fruits, feuilles, rameaux, branches.","resume":"Ravageur clé : les boucliers déclassent les fruits et une forte population fait sécher les rameaux. Dater les stades sensibles (pièges et degrés-jours), préserver Aphytis et ne traiter que sur dépassement du seuil, au bon stade.","sp":"Boucliers arrondis sur fruits, feuilles et jeunes rameaux.","sa":"Fruits déclassés en station ; jaunissement et chute des feuilles, dessèchement de rameaux et de branches ; sans contrôle, dépérissement complet d'arbres en 2 à 3 ans (S116 ; S111).","ident":"Femelle sous un bouclier arrondi (taille d'une pointe de clou émoussée) ; larves mobiles (« crawlers ») qui se fixent après quelques heures ; bouclier du mâle allongé ; mâle adulte ailé qui vit environ 6 h (S111).","bio":"Chaque femelle produit 100 à 150 larves (2–3 par jour), dispersées par le vent, les oiseaux, les cueilleurs ; environ 4 vols de mâles par an ; un été chaud ajoute une génération ; seuil de développement 11,7 °C (S111 ; S116). Au Tadla, somme de 287,7 °C-jours au-dessus de 11,7 °C utilisée pour dater le traitement ; Aphytis melinus demande 593,3 °C-jours par génération (S116).","cond":"Chaleur ; poussière ; fourmis ; insecticides à large spectre qui détruisent Aphytis (S111 ; S116).","stsens":"Fruits de la nouaison à la récolte ; pics de stades sensibles (L1 + L2) au printemps (mars–juin), fin juillet–septembre, fin septembre–novembre (S110).","m1":3,"m2":11,"surv":"Pièges à phéromone (plaques collantes, mâles/plaque/jour) ; % de stades sensibles L1 + L2 sur 100 formes vivantes tous les 7 jours (S110) ; fruits : 10 fruits/arbre sur 25 arbres, % de fruits portant > 3 boucliers, mensuel en juillet–août puis avant récolte (S109).","seuil":"Espagne : > 2 % de fruits portant plus de 3 boucliers (S109). Seuils utilisés au Maroc (Tadla) : 2 000 mâles capturés cumulés, 60 % de stades sensibles, 287,7 °C-jours (S116). Californie : objectif ≤ 10 boucliers/fruit à la récolte (S111).","sseuil":"S109 ; S116","conf":"Pou noir (Parlatoria : bouclier noir allongé) ; autres diaspines ; dépôts divers.","confirm":"Retourner le bouclier : corps jaune-orangé vivant ; bouclier parasité : trou de sortie rond, corps aplati desséché (S135).","prev":"Taille d'aération qui facilite l'accès des parasitoïdes et la pénétration des traitements ; lutte contre les fourmis ; limiter la poussière (S109 ; S111).","gest":"Traiter au premier pic de formes sensibles du printemps (si l'échantillon a été fait sur fruits développés) ou au 2e pic d'été (sur fruits en croissance) (S109) ; confusion sexuelle à phéromone efficace (S109).","lbio":"Aphytis melinus (principal), A. chrysomphali, Comperiella bifasciata ; prédateur Rhyzobius lophanthae (S109 ; S111). Au Tadla, parasitisme proche de 100 % en avril dans le témoin non traité, mais > 30 °C fin avril–début mai réduit l'activité ; 0 à 14 % dans les vergers traités chimiquement (S116).","onssa":["Agrumes|Cochenilles","Agrumes|Cochenilles (pou de Californie)"],"chim_note":"Usages « cochenilles » : vérifier que l'étiquette vise les cochenilles diaspines. Huile minérale = option la plus sélective (S111).","res":"Résistances fréquentes : ne pas répéter les mêmes produits (S109) ; en Californie, résistances au carbaryl et au pyriproxyfène, pas à l'huile ni à la buprofézine ; spirotétramat toxique pour les phytoséiides ; pyriproxyfène et buprofézine toxiques pour Rodolia (S111).","suivi":"% de formes vivantes et de L1 + L2 2 à 3 semaines après traitement ; % de fruits > 3 boucliers à la récolte ; % de parasitisme.","lim":"Les seuils marocains publiés viennent du Tadla (conditions plus chaudes que le Gharb).","eff":"Insecticides larges : effondrement d'Aphytis et rebond du pou.","fia":"🟩","src":"S116 ; S80 ; S109 ; S110 ; S111 ; S135 ; S152"},{"id":"R-AG-04","cu":"Agrumes","ty":"Ravageur","nom":"Pou noir (Parlatoria) — et Parlatoria grise","sci":"Parlatoria ziziphi ; Parlatoria pergandii (Hemiptera : Diaspididae)","grp":"Insecte, cochenille à bouclier (diaspine).","cls":"Gharb — documenté","stat":"P. ziziphi présent au Maroc (OEPP) et décrit comme l'un des ravageurs les plus importants des agrumes marocains ; essai à Mechraa Bel Ksiri (Gharb) sur Valencia Late (Assouguem et al. 2021, S115). P. pergandii également citée au Maroc (S115).","org":"Feuilles, fruits, rameaux.","resume":"Cochenille noire très tenace, difficile à éliminer au lavage des fruits : 2 à 5 générations par an dans le Gharb. Suivre feuilles et fruits, viser les jeunes stades et préserver les parasitoïdes.","sp":"Boucliers noirs sur feuilles et fruits ; feuilles décolorées.","s "Insecte, cochenille farineuse invasive en Espagne.","cls":"Vigilance — non signalé au Maroc","stat":"Ravageur émergent en Espagne (guide MAPA, S109) ; présence au Maroc non vérifiée dans les sources consultées.","org":"Jeunes fruits.","resume":"Cochenille qui déforme les jeunes fruits en Espagne. À surveiller lors des échanges de matériel végétal ; seuils espagnols disponibles.","sp":"—","sa":"Fruits déformés (Espagne).","ident":"—","bio":"—","cond":"—","stsens":"De la chute des pétales jusqu'au fruit de 3–4 cm (S109).","m1":null,"m2":null,"surv":"Espagne : 2 fruits nouvellement noués par arbre sur 100 arbres, hebdomadaire ; 1 piège à phéromone par parcelle (S109).","seuil":"Espagne : > 10–12 % de fruits occupés ou > 10–15 mâles/piège/jour de mars à mai (S109).","sseuil":"S109","conf":"Planococcus citri.","confirm":"Identification par spécialiste.","prev":"Matériel végétal contrôlé.","gest":"—","lbio":"Cryptolaemus (2 000/ha) (S109).","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Fiche de vigilance.","eff":"—","fia":"🟩","src":"S109"},{"id":"M-AV-01","cu":"Avocatier","ty":"Maladie","nom":"Pourridié racinaire à Phytophthora","sci":"Phytophthora cinnamomi","grp":"Oomycète du sol (voir M-AG-01) ; plus de 1 000 plantes hôtes ; quatre formes de spores : sporanges, zoospores (nageuses), chlamydospores et oospores (survie) (S112).","cls":"Maroc — documenté","stat":"Présent au Maroc (OEPP, premier signalement en 1975, S113) ; isolé d'un cas de pourridié d'avocatier et de sol de verger d'avocatiers (Vanderweyen 1983, S98). Incidence dans les vergers du Gharb non publiée dans les sources trouvées.","org":"Radicelles, puis toute la frondaison.","resume":"Maladie la plus grave de l'avocatier dans le monde. Sur les sols lourds du Gharb, l'excès d'eau est le facteur décisif : drainage, buttes, plants certifiés, porte-greffes clonaux tolérants, irrigation pilotée et paillage épais forment la base ; les phosphonates aident l'arbre sans éliminer le pathogène.","sp":"Petites feuilles vert pâle ou jaunâtres, souvent flétries, à pointe brune nécrosée ; feuillage clairsemé, peu de nouvelles pousses, peu de litière sous l'arbre ; dessèchement de petites branches qui expose fruits et bois au soleil ; souvent forte charge de petits fruits (S112).","sa":"Radicelles rares, noires, cassantes et mortes ; l'arbre flétrit même en sol humide ; déclin rapide ou lent jusqu'à la mort (S112).","ident":"Racines noires et cassantes au lieu de blanches ; pathogène identifié au laboratoire.","bio":"Zoospores et sporanges circulent avec l'eau à la surface et dans le sol : une zone entière peut être contaminée rapidement ; chlamydospores et oospores assurent la survie. Dissémination par plants contaminés, matériel, chaussures, eau d'irrigation, terre humide déplacée, galeries de rongeurs (S112).","cond":"Excès d'humidité du sol et mauvais drainage ; arbres de tout âge (S112) ; sols argileux engorgeables de la plaine du Gharb (S98) ; épisodes d'inondation (février 2026, S106).","stsens":"Toute l'année ; risque maximal en saison des pluies et en cas d'irrigation excessive.","m1":1,"m2":12,"surv":"Surveiller régulièrement le verger (drainage, zones humides) ; examiner les racines des arbres faibles et des plants avant plantation (S112) ; noter par bloc l'état de la frondaison (clairsemée, petites feuilles).","seuil":"Pas de seuil : la décision repose sur l'état des racines et du site.","sseuil":"—","conf":"Carence en azote (feuilles pâles, racines saines, S70) ; brûlures salines (pointes brûlées, EC/Cl élevés) ; asphyxie ; acarien de l'avocatier (défoliation, taches sous les feuilles).","confirm":"Laboratoire (isolement ou test moléculaire sur racines et sol).","prev":"Sol drainant ou drainé (buttes, sous-solage, drains) ; éviter sols mal drainés, salins ou contaminés ; plants certifiés ; porte-greffes clonaux plus résistants que les francs (Dusa, Latas ; plus récents : Uzi, Zentmyer ; Duke 7, Duke 9 moins résistants), jamais immuns ; paillage de copeaux grossiers de 10 à 15 cm, écarté du tronc ; gypse sous la frondaison ; azote modéré, éviter fumiers et engrais salins ou ammoniacaux en excès ; eau peu chargée en sel, bore, chlorure et sodium (S112).","gest":"Irrigation pilotée par l'évapotranspiration ou des sondes (tensiomètres) : ne jamais arroser un sol déjà humide ; goutteurs à plus faible débit et vannes séparées pour les zones atteintes ; hygiène : travailler les zones saines d'abord, matériel propre, pas de travaux en sol humide dans les zones atteintes ; ne pas fumiger (réinfestation souvent pire) (S112).","lbio":"Paillage organique (environnement défavorable au pathogène) ; aucun agent biologique de référence dans les sources lues.","onssa":["Avocatier|Pourriture à phytophtora"],"chim_note":"Phosphonates : améliorent la tolérance et la reprise de l'arbre sans éradiquer le pathogène ; injection au tronc la plus efficace sur arbres très atteints (si l'étiquette le permet) ; pulvérisation d'écorce peu efficace sur racines ; appliquer quand la pousse foliaire est presque terminée et que les feuilles durcissent (transport vers les racines). Phénylamide en drench ou chimigation, moins efficace sur vieux arbres (S112).","res":"Alterner les familles (S112).","suivi":"Reprise de radicelles blanches ; densité du feuillage et taille des feuilles sur les nouvelles pousses ; réduction du dessèchement ; carte des zones atteintes d'une année à l'autre.","lim":"Aucun produit ne compense un sol saturé. Les porte-greffes cités sont des références californiennes : vérifier leur disponibilité au Maroc.","eff":"—","fia":"🟩","src":"S112 ; S98 ; S113 ; S106 ; S70 ; S152"},{"id":"M-AV-02","cu":"Avocatier","ty":"Maladie","nom":"Chancre du tronc et pourriture du collet à Phytophthora","sci":"Phytophthora mengei (ex-P. citricola) ; P. cinnamomi touche plutôt les racines fines","grp":"Oomycète.","cls":"Maroc — présence non vérifiée","stat":"Non documenté au Maroc dans les sources consultées (référence californienne, S112).","org":"Base du tronc, collet, bas des charpentières blessées.","resume":"Chancre sombre à exsudat rougeâtre à la base du tronc, qui progresse sous l'écorce. Prévention : tronc sec, pas de blessures, outils désinfectés.","sp":"Chancre d'écorce sombre exsudant souvent une résine rouge qui sèche en poudre brunâtre à blanche (S112).","sa":"Sous l'écorce, lésion orange-beige à brune, parfois à odeur fruitée ; éclaircissement progressif de la frondaison (feuilles de taille normale), perte de vigueur, mort soudaine possible en stade avancé (S112).","ident":"Confirmation par isolement sur milieu sélectif (S112).","bio":"Infection de l'écorce interne et du bois externe à partir du sol humide ou de blessures (S112).","cond":"Sol humide ; blessures (outils, taille, rongeurs, vent) ; troncs mouillés par asperseurs ; plants ou outils contaminés (S112).","stsens":"Toute l'année.","m1":10,"m2":4,"surv":"Examiner la base des troncs lors des visites d'hiver et après les pluies.","seuil":"Sans objet.","sseuil":"—","conf":"Chancres à Botryosphaeriacées (plus haut sur les branches) ; coups de soleil sur tronc.","confirm":"Laboratoire.","prev":"Tronc sec (asperseurs dirigés loin du tronc ou goutte-à-goutte) ; éviter de blesser racines et tronc ; ne pas arracher les rejets ; bois coupé et paillage loin du tronc ; désinfecter les outils (S112).","gest":"Curetage des chancres débutants puis protection de la plaie ; plaies fraîches au sol protégées (S112).","lbio":"—","onssa":["Avocatier|Pourriture à phytophtora"],"chim_note":"Phosphonates en pulvérisation de tronc (Californie) ; respecter un délai entre acide phosphoreux et cuivre (10 j, ou 20 j après un cuivre) (S112).","res":"—","suivi":"Arrêt de l'exsudation ; cicatrisation.","lim":"Référence étrangère.","eff":"—","fia":"🟨","src":"S112 ; S152"},{"id":"M-AV-03","cu":"Avocatier","ty":"Maladie","nom":"Anthracnose","sci":"Colletotrichum gloeosporioides","grp":"Champignon à infections latentes : il pénètre tôt dans le fruit puis reste « dormant » jusqu'au ramollissement.","cls":"Maroc — usage ONSSA, présence non publiée","stat":"Usages homologués « Avocatier / Anthracnose » dans l'index ONSSA (copie 05/2026) ; pas de publication marocaine trouvée sur l'incidence. Anthracnose dominante dans des vergers méditerranéens étudiés en Turquie (S99).","org":"Fruits (surtout après récolte), feuilles, rameaux, fleurs.","resume":"Les infections se font au verger mais apparaissent au ramollissement : la maîtrise se joue sur l'hygiène de la frondaison (bois mort), la récolte par temps sec et la chaîne du froid.","sp":"Avant récolte : petites lésions brun-noir de moins de 5 mm autour des lenticelles, faciles à manquer ; la peau sombre de Hass masque les symptômes (S112).","sa":"Après récolte : lésions qui foncent, s'élargissent, se creusent, pourriture hémisphérique de la pulpe ; masses de spores roses (visqueuses par temps humide). Feuilles : taches jaunes puis brunes (pointes, bords), chute ; rameaux : lésions brunes ou violettes, dessèchement ; fleurs noircies, chute des jeunes fruits (S112).","ident":"Masses de spores roses (≠ pourritures pédonculaires à mycélium gris-brun).","bio":"Spores dispersées par les éclaboussures ; infection de la nouaison à la récolte ; inoculum sur bois mort et fruits momifiés ; une fois le fruit mûr, développement accéléré à partir de 24 °C et ralenti sous 15 °C (S112).","cond":"Brouillard ou pluies prolongées, hivers doux, bois mort accumulé ; Fuerte plus sensible que Hass (S112).","stsens":"De la nouaison à la récolte ; post-récolte.","m1":10,"m2":5,"surv":"% de fruits avec pourriture après mûrissement d'un échantillon de chaque récolte (test de mûrissement en conditions contrôlées).","seuil":"Aucun seuil chiffré publié.","sseuil":"—","conf":"Pourritures pédonculaires (Botryosphaeriacées : mycélium gris-brun, départ au pédoncule) ; dégâts de froid ; coups de soleil.","confirm":"Spores roses ; laboratoire si besoin.","prev":"Supprimer bois mort et rameaux secs, faire tomber les feuilles mortes de la frondaison ; relever les branches basses à au moins 60 cm ; éliminer bois mort et vieux fruits avant la floraison ; tailler et récolter par temps sec (S112).","gest":"Fruits secs et sans blessures ; refroidir à 5 °C au plus vite (au-delà de 6 h de délai, les pourritures augmentent) ; ne pas stocker sous 5 °C (dommages de froid) ; commercialiser rapidement, surtout en fin de saison (S112).","lbio":"—","onssa":["Avocatier|Anthracnose"],"chim_note":"Traitements avant récolte rarement nécessaires en Californie (S112) ; au Maroc, n'utiliser que les usages ✅.","res":"Strobilurines (FRAC 11) : une seule application avant alternance (règle californienne, S112).","suivi":"% de fruits pourris au test de mûrissement par lot.","lim":"Présence et importance au Maroc non publiées.","eff":"—","fia":"🟩","src":"S112 ; S99 ; S152"},{"id":"M-AV-04","cu":"Avocatier","ty":"Maladie","nom":"Chancres et dépérissements de rameaux (Botryosphaeriacées)","sci":"Champignons de la famille des Botryosphaeriaceae (Neofusicoccum, Lasiodiplodia, Dothiorella…) et Diaporthe","grp":"Champignons de blessure, souvent latents, qui s'expriment quand l'arbre est stressé.","cls":"Maroc — présence non vérifiée","stat":"Non documentés sur avocatier au Maroc dans les sources consultées ; Neofusicoccum parvum et Lasiodiplodia theobromae isolés de dépérissements d'avocatier en Turquie (S99).","org":"Charpentières, rameaux, point de greffe ; fruits (pourriture pédonculaire).","resume":"Dépérissements favorisés par les stress (chaleur, sécheresse, sel, défoliation) et les plaies de taille. Supprimer le bois mort, tailler par temps sec et corriger les stress valent mieux que toute pulvérisation.","sp":"Sève rougeâtre qui sèche en poudre brune et blanche ; écorce fendue, foncée ou légèrement déprimée (S112).","sa":"Bois brun-rouge en coin sous le chancre ; dessèchement de pousses, brûlure foliaire, pourriture pédonculaire des fruits ; infections latentes au point de greffe qui tuent de jeunes arbres (S112).","ident":"Coupe en coin brun-rouge dans le bois.","bio":"Spores produites sur le bois mort, dispersées par la pluie et l'irrigation ; entrée surtout par les plaies de taille (S112).","cond":"Fortes pluies ; stress hydrique, eau de mauvaise qualité, carences, ravageurs ; taille fréquente en haute densité (S112) ; vagues de chaleur (> 36 °C fin juin 2026, S107).","stsens":"Après taille ; étés chauds et secs.","m1":6,"m2":10,"surv":"Repérer rameaux secs et chancres lors des visites d'été ; noter le % d'arbres avec dessèchement.","seuil":"Sans objet.","sseuil":"—","conf":"Coups de soleil (face exposée, sans chancre interne) ; Phytophthora au collet ; brûlures salines.","confirm":"Laboratoire (isolement).","prev":"Tailler et récolter par temps sec ; corriger les stress (eau, nutrition) ; lessivage périodique si l'eau est saline ; pépinières : hygiène stricte (S112).","gest":"Supprimer et évacuer le bois mort et les vieux fruits loin des arbres (S112).","lbio":"—","onssa":[],"chim_note":"Aucun usage spécifique sur avocatier dans l'index ONSSA (copie 05/2026).","res":"—","suivi":"% d'arbres avec nouveaux dessèchements après la saison chaude.","lim":"Référence étrangère.","eff":"—","fia":"🟨","src":"S112 ; S99 ; S107 ; S152"},{"id":"M-AV-05","cu":"Avocatier","ty":"Maladie","nom":"Pourritures pédonculaires et pourritures du fruit après récolte","sci":"Botryosphaeriaceae ; Colletotrichum spp.","grp":"Champignons de blessure et de lenticelle.","cls":"Maroc — présence non vérifiée","stat":"Non documentées au Maroc dans les sources consultées (référence californienne, S112).","org":"Fruits après récolte (au ramollissement).","resume":"Pourritures qui partent du pédoncule pendant le mûrissement. Couper le pédoncule (ne pas l'arracher), récolter des fruits secs et refroidir rapidement.","sp":"Petites lésions irrégulières brun-rougeâtre sur la peau ; taches brun-violet surtout au pédoncule (S112).","sa":"Lésions noires déprimées couvertes d'un mycélium gris-brun ; stries brunes dans la pulpe ; pulpe brune, aqueuse, malodorante (S112).","ident":"Mycélium gris-brun (≠ spores roses de l'anthracnose) (S112).","bio":"Spores issues des chancres, du bois mort, des fruits et feuilles mourants ; entrée par blessures et lenticelles ; fruits surmûrs sur branches mortes très atteints (S112).","cond":"Récolte sous la pluie ; pédoncules arrachés ; délai avant le froid.","stsens":"Récolte et mûrissement.","m1":11,"m2":6,"surv":"Test de mûrissement d'un échantillon par lot.","seuil":"—","sseuil":"—","conf":"Anthracnose ; dommages de froid.","confirm":"Laboratoire.","prev":"Assainir la frondaison ; paillage épais (décomposition des propagules) ; corriger les stress ; ne pas récolter pendant ou juste après la pluie ; couper le pédoncule au sécateur, désinfecté souvent (eau de Javel 1:10) ; délai récolte–froid minimal (S112).","gest":"Tri ; froid rapide.","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"% de fruits pourris au test de mûrissement.","lim":"Référence étrangère.","eff":"—","fia":"🟨","src":"S112"},{"id":"M-AV-06","cu":"Avocatier","ty":"Vigilance","nom":"Pourridié blanc (vigilance)","sci":"Rosellinia (Dematophora) necatrix ; R. bunodes en Californie","grp":"Champignon du sol, persistant dans le bois enfoui.","cls":"Vigilance — non signalé au Maroc","stat":"Aucune donnée pour le Maroc dans la base OEPP (S113).","org":"Racines, collet.","resume":"Pourridié très persistant qui progresse d'arbre en arbre par les racines. À signaler et confirmer au laboratoire : arracher les foyers et isoler la zone.","sp":"Feuillage jaune, fruits ridés, peu de pousses (S112).","sa":"Mycélium blanc cotonneux sur les radicelles qui pourrissent ; plaques pâles sous l'écorce des grosses racines et du collet, devenant grises ou noires ; mort en 1 à 3 ans (S112).","ident":"En enceinte humide, mycélium blanc abondant en quelques jours, sans odeur de champignon (≠ Armillaria) (S112).","bio":"Persiste des années dans le bois enfoui et la matière organique ; passe d'un arbre à l'autre par les contacts entre racines ; spores peu importantes (S112).","cond":"Bois ou débris enfouis ; terre déplacée.","stsens":"—","m1":null,"m2":null,"surv":"Tout arbre mourant en foyer qui s'étend : dégager les racines.","seuil":"—","sseuil":"—","conf":"Phytophthora ; Armillaria.","confirm":"Laboratoire.","prev":"Pas de terre ni de bois venant de parcelles atteintes.","gest":"Arracher les arbres atteints et voisins, extraire les racines, tranchée pour couper les contacts racinaires, zone sèche, pas de ruissellement ; solarisation ou fumigation avant replantation (S112).","lbio":"—","onssa":[],"chim_note":"—","res":"—","suivi":"—","lim":"Fiche de vigilance.","eff":"—","fia":"🟨","src":"S112 ; S113"},{"id":"M-AV-07","cu":"Avocatier","ty":"Maladie","nom":"Verticilliose","sci":"Verticillium dahliae","grp":"Champignon du sol vasculaire, persistant (microsclérotes).","cls":"Maroc — présence non vérifiée","stat":"Citée au Maroc par une société de conseil (S50) ; non documentée par une publication dans les sources consultées.","org":"Vaisseaux du bois ; branches.","resume":"Flétrissement brutal de branches ou de l'arbre ; pas de traitement. Éviter les parcelles à précédent tomate ou autres hôtes.","sp":"Flétrissement soudain de l'arbre entier ou de branches (S112).","sa":"Feuilles brunes restant accrochées des mois ; stries brunes à gris-brun dans le bois sous l'écorce (S112).","ident":"Stries vasculaires.","bio":"Microsclérotes persistants des années ; entrée par les radicelles (S112).","cond":"Précédents sensibles (tomate, aubergine, poivron, olivier, fraisier, coton, fruits à noyau) ; terre infestée déplacée (S112).","stsens":"—","m1":null,"m2":null,"surv":"Noter les arbres flétris et les observer.","seuil":"—","sseuil":"—","conf":"Phytophthora ; asphyxie ; dépérissements.","confirm":"Laboratoire.","prev":"Éviter les parcelles à précédent sensible ; porte-greffes mexicains plutôt que guatémaltèques en sol infesté ; ne pas intercaler d'autres hôtes ; ne pas prélever d l'identification de l'espèce demande un spécialiste (ONSSA, INRA, université) ; les critères morphologiques n'ont pas été relevés dans les sources lues.","bio":"Polyphage : hôtes cultivés cités, oranger, pomelo et avocatier (S162). Répartition : région afrotropicale, Israël, Liban, Maroc ; établie au Portugal (Algarve, trouvée sur oranger en 2012) et détectée en Espagne en 2020 (S162). Cycle, nombre de générations et périodes d'activité au Gharb : non documentés dans les sources lues.","cond":"Non documentées pour le Gharb (sources lues).","stsens":"Jeunes fruits (nouaison, grossissement) : période de vigilance retenue par le classeur (PV-AV-18), à préciser par l'observation.","m1":4,"m2":9,"surv":"Battage de rameaux au-dessus d'un plateau et pièges jaunes ; noter la présence par bloc et le % de jeunes fruits marqués ; envoyer des échantillons pour identification (PV-AV-18).","seuil":"Aucun seuil publié.","sseuil":"—","conf":"Autres cicadelles ; cicatrices liégeuses dues aux thrips (R-AV-03) ou aux frottements par le vent (DD-AV-07).","confirm":"Identification de l'espèce par un entomologiste ; signalement aux services de protection des végétaux (ONSSA) en cas de foyer nouveau.","prev":"Surveillance et signalement ; plants sains à la plantation ; ne pas déplacer de matériel végétal infesté.","gest":"Pas de méthode de gestion documentée pour le Maroc dans les sources lues.","lbio":"Non documentée dans les sources lues.","onssa":[],"chim_note":"Aucun usage homologué trouvé dans la copie de l'index ONSSA (11/05/2026) pour cette cicadelle sur avocatier : pas de lutte chimique sans usage autorisé.","res":"—","suivi":"Présence par bloc d'une visite à l'autre ; % de jeunes fruits marqués à la récolte.","lim":"Impact au Maroc encore à étudier (OEPP 2019/033) ; l'EFSA juge l'impact incertain (S162). L'article marocain de 2025 sur avocatier et agrumes (S164) n'a pas été lu : la fiche est à compléter avec ses résultats.","eff":"—","fia":"🟩","src":"S113 ; S162 ; S164 ; S176"},{"id":"M-MY-01","cu":"Myrtillier","ty":"Maladie","nom":"Pourriture grise (Botrytis)","sci":"Botrytis cinerea","grp":"Champignon polyphage qui colonise d'abord les tissus sénescents ou blessés (corolles fanées, fruits abîmés), puis les tissus sains voisins.","cls":"Gharb — documenté","stat":"Maladie la plus fréquente de l'enquête 2019 : 65,9 % des exploitations, présente dans les trois régions dont le Gharb (Nouere et al. 2019, S46).","org":"Fleurs (corolles), jeunes pousses, feuilles, fruits ; post-récolte.","resume":"Infecte les corolles fanées ou gelées pendant la floraison, puis les fruits, et se poursuit en conservation. Aération, limitation de l'humectation (aspersion antigel, brumisation) et froid rapide après récolte priment ; les fongicides demandent une alternance stricte.","sp":"Fleurs brunies ; sur feuilles, taches circulaires à irrégulières beige à brun foncé à marge foncée ; nécrose des tiges (S48).","sa":"Touffe grisâtre (mycélium et spores) sur les fruits ; baies infectées qui contaminent les baies saines ; pourritures en conservation (S48).","ident":"Feutrage gris poudreux ; sclérotes noirs de 1 à 3,5 mm en culture (S48).","bio":"Conserve sur les tissus infectés ; sporulation au printemps ; spores dispersées par le vent et la pluie ; les corolles blessées ou sénescentes sont la porte d'entrée pendant la floraison ; le risque baisse après pollinisation et chute des corolles (S48 ; S132).","cond":"Temps pluvieux à 15–20 °C (S48) ; plus de 24 h d'humectation par temps frais et humide ; tissus abîmés par le gel (S132) ; brumisation et aspersion antigel prolongées.","stsens":"Floraison et fruits mûrs ; dans le Gharb, floraison d'octobre à janvier selon les variétés (fenêtre du classeur, à caler).","m1":10,"m2":4,"surv":"Pendant la floraison : noter les épisodes d'humectation longue par temps frais (S132) et observer des grappes repérées (% de fleurs brunies) — méthode de travail du classeur, pas de protocole publié pour le Maroc ; post-récolte : % de baies ntes en dernier (S48) ; refroidissement rapide (S132).","gest":"—","lbio":"Bacillus subtilis (seul produit homologué cité en 2018, S48).","onssa":["Myrtillier|Anthracnose"],"chim_note":"Floride : résistance fréquente à l'azoxystrobine (S132).","res":"Ne pas utiliser seul un QoI (FRAC 11) (S132).","suivi":"% de fruits atteints après 7 jours au froid.","lim":"Faible fréquence au Maroc en 2019.","eff":"—","fia":"🟩","src":"S46 ; S48 ; S132 ; S152"},{"id":"M-MY-05","cu":"Myrtillier","ty":"Maladie","nom":"Phomopsis (dessèchement des rameaux)","sci":"Diaporthe vaccinii (forme asexuée Phomopsis vaccinii)","grp":"Champignon de rameaux, entrant par les blessures et les bourgeons floraux.","cls":"Maroc — documenté","stat":"Un seul cas (Souss-Massa) dans l'enquête 2019 (S46).","org":"Rameaux de 1 à 2 ans, bourgeons, feuilles, fruits.","resume":"Lésions brun foncé autour des bourgeons et dessèchement de rameaux fructifères ; peut ressembler à Botrytis ou au gel. Éviter les blessures et le stress hydrique, tailler le bois atteint.","sp":"Taches nécrotiques sur feuilles ; lésions brun foncé sur rameaux fructifères, souvent autour des bourgeons floraux (S48 ; S132).","sa":"Brûlures et chancres sur rameaux de 1–2 ans, dessèchement des jeunes rameaux, grappes de fleurs et de fruits flétries (S48 ; S132).","ident":"—","bio":"Conidies dans les lésions et les rameaux morts ; entrée par blessures, boutons floraux et pointes des jeunes pousses ; optimum 21–24 °C, croissance limitée au-dessus de 32 °C et sous 4 °C (S48).","cond":"Blessures de taille ; stress hydrique par temps chaud et sec (S48).","stsens":"Débourrement–floraison.","m1":10,"m2":3,"surv":"Rameaux secs lors des visites de floraison.","seuil":"—","sseuil":"—","conf":"Botrytis ; gel ; cécidomyie (bourgeons secs) ; Botryosphaeria.","confirm":"Laboratoire.","prev":"Éviter les blessures mécaniques lors de la taille ; arrosage régulier par temps chaud (S48).","gest":"Tailler les rameaux atteints (S132).","lbio":"—","onssa":[],"chi
