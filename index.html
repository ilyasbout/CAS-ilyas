    const lines = rows.filter(r => r.p && r.d).map(r => { const q = (+String(r.d).replace(",", ".")) * (+r.n || 1); const pr = tf[r.p]; if (pr == null || pr === "") { miss.push(r.p); return `<div class="res"><span>${esc(r.p)}</span><b class="num">${fq(q)} ${r.u.split("/")[0]}/ha · prix ?</b></div>`; }
      const c = q * pr; tot += c; return `<div class="res"><span>${esc(r.p)} · ${fq(q)} ${r.u.split("/")[0]}/ha</span><b class="num">${mad(c)} /ha</b></div>`; });
    $("#k-out").innerHTML = lines.length ? lines.join("") + `<div class="res total"><span>Total par hectare</span><b class="num">${mad(tot)}</b></div>${isFinite(s) ? `<div class="res total"><span>Total pour ${fq(s)} ha</span><b class="num">${mad(tot * s)}</b></div>` : ""}
      ${miss.length ? `<div class="note">Prix manquant pour : ${esc(miss.join(", "))} — l'ajouter dans « Mes tarifs ».</div>` : ""}` : '<p class="empty">Saisir au moins un produit et sa dose par hectare.</p>';
  };
  root.querySelectorAll("#c-dose input, #c-dose select").forEach(e => e.addEventListener("input", dose)); dose();
  root.querySelectorAll("#c-acid input, #c-acid select").forEach(e => e.addEventListener("input", acid)); $("#a-t").addEventListener("change", acid); acid();
  root.querySelectorAll("#c-dar input").forEach(e => e.addEventListener("change", dar)); $("#r-u").addEventListener("input", dar); dar();
  root.querySelectorAll("#c-cost input, #c-cost select").forEach(e => e.addEventListener("change", cost)); cost();
  $("#t-add").onclick = async () => { const p = $("#t-p").value.trim(), v = +String($("#t-v").value).replace(",", "."); if (!p || !(v >= 0) || $("#t-v").value === "") { toast("Produit et prix requis."); return; }
    await tSettings({tarifs: Object.assign({}, T.settings.tarifs || {}, {[p]: v})}); toast("Prix enregistré."); render(); };
  root.querySelectorAll("[data-trm]").forEach(b => b.onclick = async () => { const t = Object.assign({}, T.settings.tarifs || {}); delete t[b.dataset.trm]; await tSettings({tarifs: t}); render(); });
}

/* ---------- assistant ---------- */
const AS = {turns: [], img: null, busy: false};
function retrieve(q, n = 8){
  const w = norm(q).split(/[^a-z0-9]+/).filter(x => x.length > 2);
  if (!w.length) return [];
  const score = k => w.reduce((s, x) => s + (k.includes(x) ? 1 : 0), 0);
  const pool = [].concat(
    D.gamme.map(g => ({t: "produit", id: g.nom, k: norm([g.nom, g.famnom, g.compo, g.role, g.agent].join(" ")), s: `${g.nom} (${g.famnom}) : ${g.compo}. Rôle : ${g.role} Doses catalogue — agrumes ${g.d_ag} ; avocatier ${g.d_av} ; myrtillier ${g.d_my}. Myrtillier : ${g.myrt}. Précautions : ${g.prec}. Réglementation : ${g.regl}.`})),
    D.orgs.map(o => ({t: "organisme", id: o.id, k: norm([o.nom, o.sci, o.resume, o.sp, o.ident, o.cu].join(" ")), s: `${o.id} ${o.nom} (${o.sci || ""}, ${o.cu}, ${o.ty}) : ${o.resume} Identification : ${o.ident} Seuil : ${o.seuil} (${o.sseuil}). Gestion : ${o.gest}`})),
    D.diag.map(d => ({t: "diagnostic", id: d.id, k: norm([d.symp, d.causes, d.th, d.org, d.cu].join(" ")), s: `${d.id} (${d.cu}) ${d.symp} — causes : ${d.causes}. Signes distinctifs : ${d.dist}. À vérifier : ${d.ana}. Ensuite : ${d.act}`})),
    D.progcas.map(p => ({t: "programme CAS", id: p.id, k: norm([p.sys, p.obj, p.prod, p.decl, p.st].join(" ")), s: `${p.id} ${p.sys} ${p.st} [${p.ty}] ${p.obj} — déclencheur : ${p.decl} ; produit : ${p.prod} ${p.dose} ; preuve : ${p.preuve}`})),
    D.stades.map(s => ({t: "stade", id: s.id, k: norm([s.nom, s.cu, s.crit, s.phase].join(" ")), s: `${s.id} ${s.cu} ${s.nom} (BBCH ${s.bbch}, ${s.fen}) : ${s.crit} Besoins : ${s.bes} Risques : ${s.risq}`})));
  return pool.map(x => Object.assign(x, {sc: score(x.k)})).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, n);
}
const AS_RULES = () => `Tu es l'assistant technique de terrain d'Ilyas Boutamart, technico-commercial CMGP CAS dans le Gharb (Maroc) : agrumes, avocatier, myrtillier (pleine terre et pots).
Règles : appuie-toi sur les extraits du référentiel fournis et sur les outils ; cite les identifiants (ex. M-AG-04, PC-AG-03, GC-012, S167) ; n'invente ni dose, ni homologation, ni seuil ; si l'information manque, dis-le. Un symptôme ou une photo donne des hypothèses, pas un diagnostic confirmé : indique ce qu'il faut vérifier. Pour un produit phytosanitaire, renvoie à l'index ONSSA et à l'étiquette (copie de l'index du ${D.meta.index_copie}). Un engrais ou biostimulant ne peut pas être présenté comme traitement (loi 53-18, art. 47). Réponds dans la langue de la question (français ou darija), de façon concise et pratique pour le terrain. Date du jour : ${fdate(todayISO())}.`;
const AS_TOOLS = () => [
  {name: "chercher_referentiel", description: "Cherche dans le référentiel technique de l'application (produits CAS, fiches bioagresseurs, diagnostic, programme CAS, stades) et renvoie les meilleurs extraits.", inputSchema: {type: "object", properties: {requete: {type: "string", description: "mots-clés en français"}}, required: ["requete"]},
    execute: i => retrieve(String(i.requete || ""), 8).map(x => ({type: x.t, id: x.id, extrait: x.s.slice(0, 900)}))},
  {name: "usages_onssa", description: "Liste les usages homologués (copie de l'index ONSSA) pour une culture (Agrumes, Avocatier, Myrtillier) et un mot-clé de cible, produit ou matière active. Renvoie produit, matière active, dose, DAR, validité.", inputSchema: {type: "object", properties: {culture: {type: "string"}, motcle: {type: "string"}}, required: ["culture","motcle"]},
    execute: i => { const k = norm(i.motcle); return D.index.filter(r => idxCrop(r) === String(i.culture) && norm([r.p, r.m, r.cible].join(" ")).includes(k)).slice(0, 25).map(r => ({produit: r.p, matiere_active: r.m, cible: r.cible, dose: r.ds, dar_j: r.dr, validite: r.v, valide: r.valid})); }},
  {name: "mon_suivi", description: "Lit le suivi d'Ilyas (ses saisies) : comptes, actions ouvertes, visites récentes, recommandations, opportunités, ventes. Utiliser pour les questions sur son activité.", inputSchema: {type: "object", properties: {rubrique: {type: "string", enum: KINDS}}, required: ["rubrique"]},
    execute: i => { const k = KINDS.includes(i.rubrique) ? i.rubrique : "actions"; return sortKind(k, T.data[k]).slice(0, 60).map(x => { const o = Object.assign({}, x); delete o.id; delete o.maj; delete o.photos; if (o.compte) o.compte = compteNom(o.compte); return o; }); }},
];
function vAssistant(){
  return `<h1>Assistant</h1><p class="lede">Poser une question de terrain : un symptôme, un produit, un programme, une homologation, ou votre activité (« quels comptes relancer ? »). L'assistant s'appuie sur le référentiel de l'application et sur votre suivi.</p>
  <div class="chat" id="chat">${AS.turns.map(t => `<div class="msg ${t.role}">${t.role === "assistant" ? esc(t.content) : esc(t.shown || t.content)}</div>`).join("") || `<div class="msg hint">Exemples :<br>• « Feuilles jeunes jaunes entre les nervures sur clémentinier, sol calcaire : que vérifier ? »<br>• « Quelle différence entre FERRILENE 4.8 et XTRAFER pour le myrtillier en pots ? »<br>• « Quels produits homologués contre le thrips sur myrtillier ? »<br>• « Quelles actions sont en retard cette semaine ? »</div>`}</div>
  <form id="askf" class="askf"><textarea id="askq" rows="2" placeholder="Votre question (français ou darija)…" aria-label="Question"></textarea>
    <div class="factions"><button class="btn" type="submit" id="askgo">Envoyer</button><button class="btn ghost" type="button" id="askstop" hidden>Arrêter</button>
    <input type="file" id="askimg" accept="image/jpeg,image/png,image/webp" hidden><button class="btn ghost" type="button" id="askimgb" hidden>Joindre une photo</button><span class="meta" id="askmsg">${AS.img ? "Photo jointe." : ""}</span>
    ${AS.turns.length ? '<button class="btn ghost" type="button" id="asknew">Nouvelle conversation</button>' : ""}</div></form>`;
}
async function bAssistant(root){
  const sample = await getSample();
  const msg = $("#askmsg"), go = $("#askgo");
  if (!sample) { msg.textContent = "L'assistant fonctionne quand la page est ouverte dans claude.ai."; go.disabled = true; return; }
  let lim = null; try { lim = await sample.limits(); } catch (e) {}
  if (lim && lim.images) { $("#askimgb").hidden = false; $("#askimgb").onclick = () => $("#askimg").click(); $("#askimg").onchange = e => { AS.img = e.target.files[0] || null; msg.textContent = AS.img ? "Photo jointe : " + AS.img.name : ""; }; }
  const nb = $("#asknew"); if (nb) nb.onclick = () => { AS.turns = []; AS.img = null; render(); };
  let ctl = null;
  $("#askstop").onclick = () => ctl && ctl.abort();
  $("#askf").onsubmit = async e => {
    e.preventDefault(); const q = $("#askq").value.trim(); if (!q || AS.busy) return;
    const ctx = retrieve(q, 6).map(x => `[${x.t} ${x.id}] ${x.s}`).join("\n");
    const content = `${q}${AS.img ? "\n\n(Photo jointe : décrire ce qui est visible, proposer des hypothèses et ce qu'il faut vérifier sur place.)" : ""}${ctx ? "\n\nExtraits du référentiel liés à la question :\n" + ctx.slice(0, 7000) : ""}`;
    AS.turns.push({role: "user", content, shown: q + (AS.img ? " 📷" : "")});
    const chat = $("#chat"); chat.innerHTML = AS.turns.map(t => `<div class="msg ${t.role}">${esc(t.role === "assistant" ? t.content : (t.shown || t.content))}</div>`).join("") + '<div class="msg assistant" id="live">Réflexion…</div>';
    $("#askq").value = ""; AS.busy = true; go.disabled = true; $("#askstop").hidden = false; chat.lastChild.scrollIntoView({block: "nearest"});
    ctl = new AbortController();
    const opts = {signal: ctl.signal, onText: ({text}) => { const l = $("#live"); if (l) l.textContent = text; }};
    if (lim && lim.tools) opts.tools = AS_TOOLS(); else opts.cache = false;
    if (AS.img) opts.images = [await shrink(AS.img)];
    const hist = AS.turns.slice(-8).map(t => ({role: t.role, content: t.content}));
    try { const r = await sample([{role: "user", content: AS_RULES()}].concat(hist), opts); AS.turns.push({role: "assistant", content: r.text + (r.truncated ? "\n\n[Réponse coupée : poser une question plus courte.]" : "")}); }
    catch (err) { if (err.text) AS.turns.push({role: "assistant", content: err.text + "\n\n[Réponse interrompue]"}); else AS.turns.pop(); if (err.code !== "cancelled") toast(SERR[err.code] || "Réponse impossible pour le moment."); }
    finally { AS.busy = false; AS.img = null; if (currentView() === "assistant") render(); }
  };
}

/* ---------- recherche globale ---------- */
const SIDX = [].concat(
  D.gamme.map(g => ({t: "Produit CAS", title: g.nom, sub: g.famnom, k: norm([g.nom, g.compo, g.famnom, g.role, g.agent].join(" ")), open: () => openSheet(sheetProd(g))})),
  D.orgs.map(o => ({t: "Fiche organisme", title: o.nom, sub: `${o.sci || ""} · ${o.cu}`, k: norm([o.nom, o.sci, o.resume, o.ty].join(" ")), open: () => openSheet(sheetOrg(o))})),
  D.stades.map(s => ({t: "Stade", title: s.nom, sub: `${s.id} · ${s.cu}`, k: norm([s.nom, s.id, s.crit, s.phase].join(" ")), open: () => openSheet(sheetStade(s))})),
  D.diag.map(d => ({t: "Diagnostic", title: d.symp, sub: `${d.cu} · ${d.th}`, k: norm([d.symp, d.causes, d.th, d.org].join(" ")),
    open: () => {S.sys = SYS.find(x => x.cu === d.cu).k; DF.th = d.th; location.hash = "diagnostic"; route();}})),
  D.index.map(r => ({t: "Usage ONSSA", title: `${r.p} — ${r.cible}`, sub: `${r.cu} · ${r.m}`, k: norm([r.p, r.m, r.cible].join(" ")),
    open: () => openSheet({title: r.p, sub: r.cu, body: idxRow(r) + '<div class="note">Copie de l\'index du ' + esc(D.meta.index_copie) + ' : revalider sur l\'index officiel.</div>'})}))
);
function vSearch(q){
  const words = norm(q).split(/\s+/).filter(Boolean);
  const hits = SIDX.filter(x => words.every(w => x.k.includes(w)));
  const groups = {};
  hits.forEach(h => (groups[h.t] = groups[h.t] || []).push(h));
  window.__hits = hits;
  return `<h1>Résultats pour « ${esc(q)} »</h1><p class="lede">${hits.length} résultat(s).</p>` +
    (Object.entries(groups).map(([t, L]) => `<section class="sec"><div class="sec-h"><h2>${esc(t)}</h2><span class="count">${L.length}</span></div><div class="srch-group">
      ${L.slice(0, 25).map(h => `<button class="srch-item" data-hit="${hits.indexOf(h)}"><b>${esc(h.title)}</b><span class="meta">${esc(h.sub)}</span></button>`).join("")}
      ${L.length > 25 ? `<p class="meta">+ ${L.length - 25} autre(s) : préciser la recherche.</p>` : ""}</div></section>`).join("") || '<p class="empty">Aucun résultat. Essayer un autre mot (ex. « fer », « thrips », « bore »).</p>');
}

/* ---------- fiche latérale ---------- */
let lastFocus = null;
function openSheet(s){
  lastFocus = document.activeElement;
  const el = $("#sheet");
  el.innerHTML = `<div class="sheet-head wrap"><div><h2>${esc(s.title)}</h2><div class="meta" style="color:inherit;opacity:.85">${esc(s.sub || "")}</div></div><button class="x" id="sx">Fermer</button></div>
    <div class="sheet-body wrap">${s.body}</div>`;
  el.hidden = false; $("#sheetbg").hidden = false; el.scrollTop = 0;
  $("#sx").focus();
  $("#sx").onclick = closeSheet;
  wire(el);
}
function closeSheet(){ $("#sheet").hidden = true; $("#sheetbg").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$("#sheetbg").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* liens transversaux (produits, fiches, stades, comparateur) */
function wire(root){
  root.querySelectorAll("[data-prod]").forEach(el => {
    const go = e => { e.preventDefault(); e.stopPropagation(); const g = prodByName[el.dataset.prod]; if (g) openSheet(sheetProd(g)); };
    el.onclick = go; if (el.tagName === "ARTICLE") el.onkeydown = e => { if (e.key === "Enter") go(e); };
  });
  root.querySelectorAll("[data-org]").forEach(el => {
    const go = e => { e.preventDefault(); e.stopPropagation(); const o = orgById[el.dataset.org]; if (o) openSheet(sheetOrg(o)); };
    el.onclick = go; if (el.tagName === "ARTICLE") el.onkeydown = e => { if (e.key === "Enter") go(e); };
  });
  root.querySelectorAll("[data-stade]").forEach(el => {
    const go = e => { e.preventDefault(); const s = stById[el.dataset.stade]; if (s) openSheet(sheetStade(s)); };
    el.onclick = go; el.onkeydown = e => { if (e.key === "Enter") go(e); };
  });
  root.querySelectorAll("[data-cmpadd]").forEach(b => b.onclick = () => {
    const n = b.dataset.cmpadd;
    if (!S.cmp.includes(n)) { S.cmp = S.cmp.concat([n]).slice(-3); store.set("cmp", S.cmp); }
    b.textContent = "Dans le comparateur"; b.classList.add("ghost");
    if (currentView() === "comparer") render();
  });
  root.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => window.__hits[+b.dataset.hit].open());
}

/* ---------- routage ---------- */
const R = {terrain:[vTerrain,bTerrain], tracker:[vTracker,bTracker], assistant:[vAssistant,bAssistant], calculs:[vCalculs,bCalculs], programme:[vProgramme,bProgramme], gamme:[vGamme,bGamme], comparer:[vComparer,bComparer], diagnostic:[vDiagnostic,bDiagnostic],
           organismes:[vOrganismes,bOrganismes], onssa:[vOnssa,bOnssa], stades:[vStades,bStades], technique:[vTechnique,bTechnique], sources:[vSources,bSources]};
const currentView = () => { const h = location.hash.replace("#", ""); return R[h] ? h : "terrain"; };
let searchQ = "";
function render(){
  const v = currentView(), root = $("#view");
  navRender(searchQ ? "" : v);
  if (searchQ) { root.innerHTML = vSearch(searchQ); wire(root); return; }
  root.innerHTML = R[v][0]();
  R[v][1](root);
  wire(root);
}
function route(){ searchQ = ""; $("#q").value = ""; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
let tmr = null;
$("#q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { searchQ = e.target.value.trim(); render(); }, 160); });
$("#foot").innerHTML = `CAS Terrain · données techniques du classeur ${esc(D.meta.version)} · ${D.gamme.length} produits CAS · ${D.orgs.length} fiches · ${D.index.length} usages ONSSA (copie ${esc(D.meta.index_copie)}). Aucune donnée client intégrée (le suivi ne contient que vos saisies). Doses du catalogue et allégations des fabricants à vérifier sur l'étiquette.`;
$("#dl-zones").innerHTML = ZONES.map(z => `<option value="${esc(z)}">`).join("");
$("#dl-prods").innerHTML = PRODS.map(p => `<option value="${esc(p)}">`).join("");
T.sub = store.get("tsub", "bord"); if (!TSUB.some(x => x[0] === T.sub)) T.sub = "bord";
render();
initStore();
</script>
