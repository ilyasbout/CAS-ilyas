<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CAS Terrain Gharb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête collant (marque + recherche + onglets), une colonne de cartes en mobile, deux colonnes au-delà de 900 px ; fiches en panneau latéral/plein écran. */
:root{
  --bg:#EEF2EA; --surface:#FFFFFF; --sunk:#E3E9DE; --ink:#16231A; --muted:#55665A; --line:#D3DBCD;
  --accent:#1E5631; --accent-ink:#FFFFFF; --leaf:#7FA83A; --leaf-soft:#E4EFD2;
  --ok:#2E7A3A; --ok-bg:#DCEFD9; --warn:#946200; --warn-bg:#FBEFC9; --bad:#A3271F; --bad-bg:#F8DEDA; --info:#245F7A; --info-bg:#DCEBF2;
  --shadow:0 1px 2px rgba(22,35,26,.06),0 6px 18px rgba(22,35,26,.06);
  --head:#1E5631; --head-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1510; --surface:#16201A; --sunk:#1D2921; --ink:#E3EBE0; --muted:#9BAE9F; --line:#2B3A2F;
  --accent:#78C07E; --accent-ink:#0E1510; --leaf:#A9CC63; --leaf-soft:#25331F;
  --ok:#8FD497; --ok-bg:#1E3322; --warn:#F0C25A; --warn-bg:#3A3018; --bad:#F2928A; --bad-bg:#3D1F1C; --info:#86C3DE; --info-bg:#1A2E38;
  --shadow:0 1px 2px rgba(0,0,0,.3); --head:#163D23; --head-ink:#EAF3E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1510; --surface:#16201A; --sunk:#1D2921; --ink:#E3EBE0; --muted:#9BAE9F; --line:#2B3A2F;
  --accent:#78C07E; --accent-ink:#0E1510; --leaf:#A9CC63; --leaf-soft:#25331F;
  --ok:#8FD497; --ok-bg:#1E3322; --warn:#F0C25A; --warn-bg:#3A3018; --bad:#F2928A; --bad-bg:#3D1F1C; --info:#86C3DE; --info-bg:#1A2E38;
  --shadow:0 1px 2px rgba(0,0,0,.3); --head:#163D23; --head-ink:#EAF3E6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
a{color:var(--info)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink)}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px 6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;opacity:.8;text-transform:uppercase;margin-top:3px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;border:0;border-radius:8px;padding:9px 12px 9px 34px;background:rgba(255,255,255,.16);color:inherit}
.search input::placeholder{color:currentColor;opacity:.7}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.8}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:inherit;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;padding:8px 10px 9px;border-bottom:3px solid transparent;opacity:.78}
nav.tabs a[aria-current="page"]{opacity:1;border-color:var(--leaf)}
main{padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;letter-spacing:.01em}
h2{font-size:21px;letter-spacing:.02em;text-transform:uppercase;color:var(--accent)}
h3{font-size:19px}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:900px){.grid.two{grid-template-columns:1fr 1fr}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select.sel,input.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
input.inp{flex:1 1 220px}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:var(--accent)}
.card-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-start;justify-content:space-between}
.card-title{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15}
.meta{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:3px 10px;font-size:14px}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.kv{grid-template-columns:1fr}.kv dt{padding-top:6px}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.p-base{background:var(--ok-bg);color:var(--ok)} .p-cor{background:var(--info-bg);color:var(--info)} .p-ess{background:var(--warn-bg);color:var(--warn)} .p-non{background:var(--bad-bg);color:var(--bad)}
.p-mut{background:var(--sunk);color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:300px}
.months span{font-family:var(--f-mono);font-size:10px;text-align:center;padding:2px 0;border-radius:2px;background:var(--sunk);color:var(--muted)}
.months span.on{background:var(--leaf);color:#13230F;font-weight:500}
.months span.now{outline:1.5px solid var(--ink)}
.label-grid{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;width:max-content;max-width:100%}
.label-grid div{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border-right:1px solid var(--line);min-width:46px}
.label-grid div:last-child{border-right:0}
.label-grid b{font-family:var(--f-display);font-size:14px;letter-spacing:.03em}
.label-grid i{font-style:normal;font-family:var(--f-mono);font-size:13px}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:0 6px 6px 0;font-size:13.5px}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.note.info{border-color:var(--info);background:var(--info-bg)}
.note.ok{border-color:var(--ok);background:var(--ok-bg)}
.split{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.split{grid-template-columns:1fr 1fr}}
.box{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;background:var(--surface)}
.box h4{margin:0 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent)}
.more{align-self:flex-start}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.cmp th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:150px;background:var(--sunk)}
table.cmp thead td{font-family:var(--f-display);font-size:18px;font-weight:600}
@media (max-width:600px){table.cmp th{width:92px;font-size:10.5px}}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.acc summary{cursor:pointer;padding:11px 14px;font-family:var(--f-display);font-size:18px;font-weight:600;list-style-position:inside}
details.acc>div{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.srch-group{display:flex;flex-direction:column;gap:6px}
.srch-item{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.srch-item .meta{margin-left:auto;text-align:right}
/* fiche */
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:40}
.sheet{position:fixed;z-index:41;inset:0 0 0 auto;width:min(720px,100%);background:var(--bg);overflow-y:auto;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;background:var(--head);color:var(--head-ink);display:flex;gap:10px;align-items:flex-start;padding-block:12px;z-index:2}
.sheet-head h2{color:inherit;text-transform:none;font-size:24px;letter-spacing:.01em}
.sheet-head .x{margin-left:auto;background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;cursor:pointer;flex:none}
.sheet-body{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.hero{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.picker .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat-row{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.stat b{font-family:var(--f-display);font-size:20px;margin-right:4px}
footer.foot{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-block:14px 30px}

/* tracker */
.th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.subtabs .chip{flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.kpi b.num{font-family:var(--f-display);font-size:22px}
.kpi b small{font-size:16px;color:var(--muted)}
.kpi.alert{border-color:var(--bad);background:var(--bad-bg)} .kpi.alert b{color:var(--bad)}
.gauge{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.gauge span{display:block;height:100%;background:var(--leaf)}
.cols{display:grid;grid-template-columns:1fr;gap:0 18px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:9px;min-width:0}
.trow.done{opacity:.6}
.trow-main{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-radius:9px}
.trow-main:hover{background:var(--leaf-soft)}
.trow-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.trow-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.late{color:var(--bad);font-weight:600}
.tick{flex:none;width:30px;margin:8px 0 8px 10px;height:30px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent-ink);cursor:pointer;font-weight:700}
.tick[aria-pressed="true"]{background:var(--accent)}
.sec-h .btn.mini{margin-left:auto;padding:3px 10px;font-size:13px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.btrack{position:relative;width:100%;max-width:42px;height:110px;background:var(--sunk);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.bfill{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.bobj{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--warn);z-index:1}
.bv{font-size:12px} .bl{font-size:11.5px;color:var(--muted)}
.pipe{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label,.fld.inline{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fld.inline{gap:4px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
.fld textarea{resize:vertical}
.chipbox{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0}
.factions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
#fwarn{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;margin:0;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:1/1;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;inset:auto 0 0 0;background:rgba(10,18,12,.6);color:#fff;font-size:10.5px;padding:2px 5px}
.phx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,18,12,.65);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.week{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:900px){.week{grid-template-columns:1fr 1fr 1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--leaf)}
.day-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day-h b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.share{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 140px;justify-content:flex-end}
.sharebar{display:block;height:6px;border-radius:3px;background:var(--leaf);max-width:120px}
.bars.b12{grid-template-columns:repeat(12,1fr);gap:4px}
.bars.b12 .bl{font-size:10px}
.calc .result{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.res{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.res b{font-size:16px}
.pipe b.num,.res b.num{white-space:nowrap}
.res.total{border-color:var(--accent);background:var(--leaf-soft)}
.costrows{display:flex;flex-direction:column;gap:6px}
.costrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}
.costrow input,.costrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;min-width:0;width:100%;color:var(--ink)}
@media (max-width:560px){.costrow{grid-template-columns:1fr 1fr}.costrow input[data-k="p"]{grid-column:1/-1}}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg{max-width:min(720px,92%);padding:10px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.hint{align-self:stretch;max-width:none;background:var(--leaf-soft);color:var(--ink);font-size:14px}
.askf{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:6px;margin-top:10px;border-top:1px solid var(--line)}
.askf textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);font-size:15px;resize:vertical;width:100%}
.crout{white-space:pre-wrap;font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

:"150–300 g/hL (arboriculture) ; injection 5–10 L/ha","d_av":"150–300 g/hL","d_my":"⚠ À éviter en fertigation (alcalin)","d_fert":"","prec":"—","incoh":"Liquide dosé en g/hL ; absent de la base Produits.","regl":"⛔ Allégation phytopharmaceutique sur un engrais : interdite (loi 53-18, art. 47) sauf produit mixte autorisé — ne pas la reprendre ; protection = produit homologué ONSSA","myrt":"Non en fertigation (alcalin)","marque":"CAS (exclusif ★)","logo":"★","doublon":"—","cmp":null,"fia":"🟨","id":"GC-089","famnom":"Silicium"}],"familles":[{"code":"F01","nom":"Azote foliaire (urée sans biuret)","nat":"Engrais","quoi":"Solutions d'urée à faible biuret, parfois avec Mg, S et lignosulfonates.","agit":"L'urée traverse vite la cuticule ; l'azote est disponible en quelques heures. Apport faible par passage : c'est un complément ciblé (stade précis), jamais la base de la fumure.","att":"Utile à des stades précis (préfloraison agrumes et avocatier, essais de Lovatt) quand la dose d'azote réellement apportée est connue. Le biuret brûle les jeunes feuilles."},{"code":"F02","nom":"Acides aminés et hydrolysats","nat":"Biostimulant","quoi":"Acides aminés libres et peptides d'origine végétale ou animale ; teneur exprimée en « acides aminés libres » ou en « protéine brute ».","agit":"Source d'azote organique rapidement absorbée ; certains acides aminés (glycine, proline, glutamate) jouent un rôle de signal ou d'osmoprotection. L'apport en azote par passage est minime.","att":"Résultats variables selon la culture et le stress (méta-analyse S148). À évaluer par essai avec témoin. Une « protéine brute 2 % » n'est pas un produit riche en acides aminés."},{"code":"F03","nom":"Extraits d'algues","nat":"Biostimulant","quoi":"Algues brunes (Ascophyllum nodosum, Ecklonia maxima, Fucus, Laminaria) : polysaccharides (alginates, laminarine), mannitol, traces d'hormones.","agit":"Action surtout attribuée aux polysaccharides et aux petites quantités de cytokinines/auxines ; effets plus nets sous stress. Les teneurs hormonales déclarées ne sont pas comparables entre fabricants.","att":"Essai publié sur clémentinier et Navelina avec un autre extrait (S149) ; méta-analyse : gains moyens modestes et très variables (S148). Toujours tester avec témoin."},{"code":"F04","nom":"Substances humiques et fulviques","nat":"Biostimulant / amendement","quoi":"Extraits de léonardite (acides humiques et fulviques), humates de potassium.","agit":"Agissent au sol : complexation des cations, stimulation racinaire, activité microbienne. Les produits liquides sont très alcalins (pH 13) : ils précipitent avec le calcium et en milieu acide.","att":"Effets surtout visibles sur jeunes plantations et sols pauvres en matière organique (myrtillier : masse racinaire, pas de rendement, S173). Quantité de matière humique apportée faible par rapport au sol."},{"code":"F05","nom":"Osmoprotecteurs (glycine-bétaïne)","nat":"Biostimulant","quoi":"Glycine-bétaïne quasi pure (97 %).","agit":"Molécule qui stabilise protéines et membranes et aide la cellule à garder son eau sous chaleur, sécheresse ou salinité.","att":"Hypothèse à tester AVANT un épisode de chaleur (chergui) ou de salinité, en plus de l'irrigation, jamais à sa place. Aucun essai sur nos cultures lu."},{"code":"F06","nom":"Enracineurs (mélanges)","nat":"Biostimulant","quoi":"Mélanges de polysaccharides, acides aminés, phosphore, matière organique.","agit":"Le phosphore et l'azote apportés expliquent une partie de l'effet ; les allégations « riche en auxines » relèvent d'un régulateur.","att":"Intérêt possible à la plantation ou au rempotage ; comparer à un témoin recevant le même P."},{"code":"F07","nom":"Allégation hormonale / régulation","nat":"Biostimulant revendiqué (statut à vérifier)","quoi":"Produits présentés comme apportant des auxines, cytokinines ou levant la dormance.","agit":"Un effet de régulation de la floraison, de la nouaison ou du débourrement est l'effet d'un régulateur de croissance, qui relève de l'homologation phytosanitaire.","att":"Ne conseiller l'effet hormonal que si le produit est homologué pour cet usage ; sinon, essai avec témoin et sans promesse."},{"code":"F08","nom":"Fer EDDHA (sol, pH élevé)","nat":"Correcteur de carence","quoi":"Fer chélaté par l'EDDHA ; seule la fraction ortho-ortho (o,o) reste stable en sol calcaire.","agit":"Le chélate garde le fer soluble jusqu'à pH ≈ 9–10 (S180, S181) ; la teneur « o,o » (3,0 ; 3,8 ; 4,8 % du produit) mesure le fer réellement durable dans un sol calcaire.","att":"Comparer les produits en g de fer o,o par kg (ou par MAD), pas sur le « 6 % de fer ». Inutile en sol ou substrat acide (myrtillier), où un EDTA suffit."},{"code":"F09","nom":"Fer EDTA, multi-chélaté ou sel","nat":"Correcteur de carence","quoi":"Fer chélaté EDTA, mélanges de chélates/complexants, sulfate de fer.","agit":"EDTA efficace jusqu'à pH ≈ 6 (S180) : bon en foliaire, en solution nutritive acide et en sol acide ; perd le fer en sol calcaire. Le sulfate de fer précipite vite en sol alcalin.","att":"Pour les agrumes et l'avocatier en sol calcaire, choisir un EDDHA au sol ; EDTA/complexés en foliaire. Pour le myrtillier : EDTA (ou DTPA) suffit si le pH est maîtrisé."},{"code":"F10","nom":"Zinc, manganèse","nat":"Correcteur de carence","quoi":"Chélates EDTA, complexes lignosulfonates (LSA), formes carboxyliques, sulfates, suspension concentrée (Zn 80 % p/v).","agit":"Zn et Mn sont immobiles dans la plante : la pulvérisation sur la pousse en expansion est la voie la plus efficace (S167). Au sol, ils sont bloqués en pH élevé.","att":"Comparer en g de Zn ou Mn apportés par hL et par ha, et suivre l'analyse foliaire la campagne suivante."},{"code":"F11","nom":"Bore, molybdène","nat":"Correcteur de carence","quoi":"Bore éthanolamine, borates, bore + zinc (LSA), molybdates.","agit":"Le bore intervient dans la germination du pollen et la nouaison ; marge étroite entre carence et toxicité (eau d'irrigation à vérifier). Le molybdène est nécessaire en quantité infime.","att":"Bore : préfloraison, selon analyse foliaire et bore de l'eau, jamais en double (sol + foliaire). Molybdène : uniquement sur diagnostic."},{"code":"F12","nom":"Cuivre","nat":"Correcteur de carence","quoi":"Gluconate, heptagluconate, EDTA ou sulfate de cuivre.","agit":"Le cuivre est rarement carencé en verger traité au cuivre ; l'excès est toxique (racines, sol).","att":"Correction uniquement sur analyse. Les allégations « défenses », « cicatrisation » sont des allégations phytopharmaceutiques interdites pour un engrais (S179)."},{"code":"F13","nom":"Oligo-éléments multiples","nat":"Correcteur de carence","quoi":"Mélanges Fe-Zn-Mn-B-Cu-Mo chélatés (EDTA, parfois EDDHA) pour fertigation ou foliaire.","agit":"Pratique en solution nutritive (apport régulier) ; en correction, ils apportent trop peu de l'élément réellement manquant.","att":"Choisir d'après le rapport des éléments et l'analyse ; attention au Mn élevé (OLIGOMIX) en substrat acide."},{"code":"F14","nom":"Calcium foliaire","nat":"Correcteur de carence","quoi":"Calcium chélaté (EDTA), citrate, lignosulfonate, calcium-bore.","agit":"Le calcium est immobile dans le phloème (S136) : une pulvérisation n'atteint que l'organe mouillé et ne remplace pas le calcium apporté par l'eau et le sol.","att":"Effet attendu limité aux fruits pulvérisés, à des stades précoces ; justification uniquement si Ca foliaire bas ou désordre lié au calcium, à vérifier par essai."},{"code":"F15","nom":"Calcium au sol / correcteurs de salinité","nat":"Correcteur / amendement","quoi":"Calcium carboxylique ou lignosulfonate en suspension ou solution, phosphate de calcium en suspension.","agit":"Le calcium déplace le sodium du complexe d'échange si le drainage évacue ensuite le sodium. Plusieurs produits ont une valeur neutralisante (30–35 %) : ils remontent le pH.","att":"Raisonner avec l'analyse (SAR, ESP) et le lessivage ; comparer au gypse en coût par kg de Ca. À exclure en myrtillier (pH)."},{"code":"F16","nom":"Magnésium","nat":"Correcteur de carence","quoi":"MgO complexé lignosulfonate (avec CaO).","agit":"Mg mobile : la carence apparaît sur feuilles âgées ; la base est la fertigation (sulfate de Mg).","att":"Foliaire en complément si Mg foliaire bas ; sinon fertigation."},{"code":"F17","nom":"Potassium foliaire, P-K","nat":"Engrais / correcteur","quoi":"Thiosulfate/sulfate, carbonate, nitrate-EDTA, sulfate de K + B, P-K solubles.","agit":"Le potassium est demandé en masse pendant le grossissement : un passage foliaire apporte quelques centaines de g de K2O/ha contre des dizaines de kg en fertigation.","att":"Complément de fin de grossissement ou de coloration seulement ; la base reste la fertigation (PV-AG-07, PV-AV-05, PV-MYT-05)."},{"code":"F18","nom":"Silicium","nat":"Élément bénéfique","quoi":"Acide orthosilicique stabilisé (acide) ou silicate de potassium (alcalin).","agit":"Le silicium renforce les parois et la tolérance aux stress chez certaines plantes ; les silicates sont très alcalins.","att":"Essai uniquement ; « barrière contre champignons et insectes » est une allégation phytopharmaceutique interdite pour un engrais (S179)."},{"code":"F19","nom":"Phosphites et « activateurs de défense »","nat":"Engrais à allégation phytosanitaire","quoi":"Phosphite de potassium ou de cuivre, cuivre + acides aminés.","agit":"Le phosphite n'est pas une source de phosphore assimilable comme le phosphate ; son effet sur les oomycètes est celui d'un fongicide (FRAC P07).","att":"Pour protéger contre Phytophthora, utiliser un produit HOMOLOGUÉ (Index ONSSA). Ne pas compter le phosphite dans la fumure phosphatée."},{"code":"F20","nom":"Acidifiants, régulateurs de pH, mouillants","nat":"Adjuvant / engrais acide","quoi":"Urée-acide sulfurique, acide phosphorique + mouillant, sels phosphoriques.","agit":"Abaissent le pH de l'eau ou de la bouillie, neutralisent les bicarbonates, apportent N, P ou S qu'il faut compter dans la fumure.","att":"Dose par titration de l'eau (feuille Calculateurs), pas une dose fixe par hectare."},{"code":"F21","nom":"Savons et nettoyants","nat":"Engrais à allégation insecticide","quoi":"Savons potassique ou phosphorique.","agit":"Nettoient la fumagine et le miellat ; l'action « insecticide » est celle d'un produit phytosanitaire.","att":"Allégation insecticide interdite pour un engrais sans homologation (S179) ; contre les aleurodes, utiliser un produit homologué."}],"groupes":[{"id":"CG-01","nom":"Fer au sol en terrain calcaire","q":"Quel fer pour une chlorose ferrique d'agrumes ou d'avocatier en sol calcaire ?","prods":"FERRILENE 4.8 · VALFER 4.8 · FERRILENE · SEQUESTRENE 138 · VALFER 30 · FEREXTREME","diff":"Tous à 6 % de fer EDDHA ; seule la fraction ortho-ortho (o,o) reste durable au-dessus de pH 8 : 4,8 > 3,8 > 3,0 % du produit. FEREXTREME : o,o non chiffré.","quand":"Chlorose confirmée (jeunes feuilles, limite nette) + calcaire actif ou eau bicarbonatée ; application au sol au départ de la pousse de printemps (PV-AG-08).","eviter":"Ne corrige pas une chlorose d'asphyxie (sols lourds du Gharb engorgés) ni une carence en Zn/Mn. Inutile en sol acide.","rep":"Fer o,o par kg : 48 g (FERRILENE 4.8, VALFER 4.8) ; 38 g (FERRILENE, SEQUESTRENE 138) ; 30 g (VALFER 30). Comparer le prix par g de fer o,o.","preuve":"✅ chimie des chélates (S180) ; doses = catalogue","src":"S178 ; S180 ; S167"},{"id":"CG-02","nom":"Fer foliaire, en solution ou en sol acide","q":"Quel fer pour le myrtillier, la fertigation acide ou une pulvérisation ?","prods":"XTRAFER (EDTA 12 %) · FEROMAX · FER MULTICHELATÉ · FER UP · CHELAMIX · SULFATE DE FER","diff":"XTRAFER : 100 % EDTA, agent connu. FEROMAX / FER MULTICHELATÉ : 12 % de fer dont 8 % chélaté, agents non nommés. FER UP : forme non précisée. Sulfate : non chélaté.","quand":"Myrtillier (pH 4,5–5,5), solutions nutritives acides, foliaire : l'EDTA suffit (stable jusqu'à pH ≈ 6).","eviter":"Au sol en terrain calcaire : l'EDTA perd son fer (allégation « pH 4–10 » de XTRAFER à ne pas suivre).","rep":"XTRAFER 75 g/hL = 9 g Fe/hL ; FEROMAX 250 g/hL = 30 g Fe/hL (dont 2/3 chélatés).","preuve":"🟩 (S180, S181)","src":"S178 ; S180 ; S181"},{"id":"CG-03","nom":"Zinc et manganèse foliaires","q":"Quel correcteur Zn-Mn sur la pousse de printemps ?","prods":"AGRUMIX (EDTA, Zn 13 + Mn 10 + MgO 4) · BIOSTAR Zn-Mn · ROMBIQUEL Zn-Mn · CHELAZINC · CHELAMAN EDTA · BIOSTAR Zn · ROMBIQUEL Zn EXTRA SL · ZINC UP · SULFATES","diff":"Forme : EDTA (AGRUMIX, CHELAZINC, CHELAMAN) ; lignosulfonate (ROMBIQUEL) ; carboxylique (BIOSTAR) ; suspension d'oxyde (ZINC UP) ; sel (sulfates, le moins cher par kg d'élément). Quantité de Zn par hL très différente selon le produit.","quand":"Zn/Mn foliaire bas ou symptômes ; pousse de printemps aux 2/3–pleine expansion (PV-AG-09, PV-AV-06).","eviter":"Mn rarement utile en myrtillier (déjà disponible en sol acide).","rep":"Zn apporté par hL à la dose de comparaison : BIOSTAR Zn ≈ 75 g ; BIOSTAR Zn-Mn ≈ 54 g ; AGRUMIX ≈ 33 g ; CHELAZINC ≈ 11 g (voir colonne calculée).","preuve":"✅ (S167, S70)","src":"S178 ; S167 ; S70"},{"id":"CG-04","nom":"Bore (et molybdène)","q":"Quel bore avant floraison ?","prods":"ORBORE 150 · VENTAGE (B + Zn) · CALBOR (Ca + B) · OLIPLANT B 17 · MOLYFLOR (B + Mo + Zn) · ALGAPACK (B 3 %) · K-LEAF XTRABOR","diff":"ORBORE : bore seul, liquide, le plus simple à doser. VENTAGE : bore + zinc en un passage. CALBOR : peu de bore (1 %). MOLYFLOR : beaucoup de Mo. OLIPLANT B 17 : fertigation.","quand":"B foliaire bas, B de l'eau bas ; agrumes AG-S04/S05, avocatier stade chou-fleur (AV-S02, S142), myrtillier avant floraison (MY-S05).","eviter":"Jamais sol + foliaire la même campagne ; jamais si B de l'eau élevé ; avocatier : pas mélangé à l'urée (PV-AV-07).","rep":"B par hL : ORBORE 200 mL ≈ 30 g ; VENTAGE 175 g ≈ 17,5 g ; MOLYFLOR 175 g ≈ 19 g ; CALBOR 350 mL ≈ 4 g (densité non imprimée).","preuve":"✅ (S142, S167, S69)","src":"S178 ; S142 ; S154 ; S167 ; S69"},{"id":"CG-05","nom":"Calcium foliaire","q":"Faut-il pulvériser du calcium ?","prods":"CITO CAL (citrate) · ROMBI CAL (EDTA) · CALBOR (+ B) · OSMOCAL · MAGNÉSIOL 26 (Mg + Ca)","diff":"Teneurs très différentes (CaO 11 à 42 %) ; formes citrate, EDTA, lignosulfonate, non précisée. La teneur de ROMBI CAL (Ca 30 % « EDTA ») est chimiquement improbable.","quand":"Ca foliaire bas, désordre lié au calcium (éclatement, fermeté) documenté, en essai sur fruits jeunes.","eviter":"Le calcium ne migre pas d'une feuille vers le fruit (S136) : il ne remplace pas le calcium de l'eau, du sol ou de la solution (nitrate de calcium en bac A).","rep":"CaO par hL : CITO CAL 325 mL ≈ 65 g ; OSMOCAL 225 g ≈ 68 g ; ROMBI CAL 100 g ≈ 42 g ; CALBOR ≈ 39 g par 350 mL si densité 1.","preuve":"🟨 (effet qualité non démontré dans les sources lues)","src":"S178 ; S136 ; S138"},{"id":"CG-06","nom":"Calcium au sol et correction de sodicité","q":"Quel produit sur un sol ou une eau sodique ?","prods":"ROMBI-SAL PLUS SL · ALCAFLOW · FLORACAL · PLASMA-FOS FLOW (+ P) · (gypse, hors catalogue)","diff":"ROMBI-SAL : calcium soluble, acide (pH 3,2). ALCAFLOW / FLORACAL : calcium à valeur neutralisante 30–35 % (remontent le pH). PLASMA-FOS : phosphate de calcium.","quand":"SAR/ESP élevés et infiltration faible, avec lessivage possible (feuille Eau & salinité).","eviter":"Aucun ne fait baisser la salinité sans lessivage ; ALCAFLOW et FLORACAL interdits en myrtillier ; comparer au gypse en coût par kg de Ca.","rep":"Ca apporté : ROMBI-SAL 10 L/ha ≈ 1,6 kg Ca ; ALCAFLOW 4 kg ≈ 0,9 kg Ca ; à comparer aux besoins calculés en meq de Na à déplacer.","preuve":"🟨 (S146 : pas de chiffres publiés)","src":"S178 ; S145 ; S146"},{"id":"CG-07","nom":"Potassium foliaire et P-K","q":"Quel potassium en fin de grossissement ?","prods":"KION · CARBO K 30 · ROMBI KS SP · K-LEAF XTRABOR · SUPRALEX 90 · ENERMAX · PRESTIGE","diff":"Forme : soufre (KION), carbonate alcalin (CARBO K 30), sel soluble 54 % (ROMBI KS), sulfate + B (K-LEAF), P-K (SUPRALEX, ENERMAX).","quand":"Complément foliaire de la fertigation potassique quand K foliaire est bas ou au grossissement final.","eviter":"Une pulvérisation apporte ≈ 1–1,5 kg K2O/ha (1000 L) contre 50–150 kg/ha/an nécessaires : ce n'est pas la base. CARBO K en fertigation de myrtillier : non.","rep":"K2O par hL : ROMBI KS 250 g ≈ 135 g ; KION 325 mL ≈ 119 g ; CARBO K 325 mL ≈ 107 g ; SUPRALEX 150 g ≈ 75 g.","preuve":"🟩 (ordre de grandeur des besoins : PV-AG-07, PV-AV-05)","src":"S178 ; S72 ; S167"},{"id":"CG-08","nom":"Azote foliaire","q":"AZOFLOW ou UREAFOL ?","prods":"AZOFLOW (N 20 %) · UREAFOL (N 16 % + MgO 4 + SO3 7,9)","diff":"Même usage (urée sans biuret) ; UREAFOL apporte un peu de Mg et de S ; AZOFLOW plus concentré.","quand":"Préfloraison agrumes (AG-S04) et stade chou-fleur de l'avocatier (AV-S02) en complément ciblé (S141, S142, S154).","eviter":"Dose catalogue (1 L/hL) ≈ 2–3 kg N/ha : 10 fois moins que l'urée des essais californiens (≈ 26 kg N/ha) ; ne pas mélanger urée et bore sur avocatier.","rep":"N par hL : AZOFLOW 750 mL ≈ 150 g si densité 1 ; UREAFOL ≈ 120 g.","preuve":"🟩 (essais Californie) / 🟨 (dose catalogue)","src":"S178 ; S141 ; S142 ; S154"},{"id":"CG-09","nom":"Acides aminés","q":"Quel acide aminé choisir ?","prods":"PRESTIGE (60 %) · CLOROMAX (30 % + MgO 17) · PLYAMINOL 30 (30 % p/v) · VIGOSTIM (19 %) · ECOSTIM (7 % + ATTC) · TRYTON (8,7 % + « auxines ») · BIOTONIC (protéine 2 %)","diff":"Comparer en g d'acides aminés libres par hectare et par MAD, pas sur les promesses : PLYAMINOL 300 mL/hL ≈ 90 g AA/hL ; PRESTIGE 30 g/hL ≈ 18 g AA/hL ; BIOTONIC : très peu.","quand":"Après un stress (froid, chaleur, phytotoxicité) ou à la reprise, en essai.","eviter":"Effet moyen modeste et variable (S148) ; ECOSTIM/TRYTON : allégations de régulateur.","rep":"Voir colonne calculée « apport par hL ».","preuve":"🟨 (S148)","src":"S178 ; S148"},{"id":"CG-10","nom":"Extraits d'algues","q":"SM6, ECKLOMAR, MEGAFOL, ALGAPACK ou VIVA ?","prods":"SM6 (Ascophyllum + Fucus + Laminaria, alginate 7 %) · ECKLOMAR (Ecklonia, « cytokinine 0,5 % ») · MEGAFOL
